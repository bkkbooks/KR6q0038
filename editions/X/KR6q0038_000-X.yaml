body:
  text: 繼燈錄序禪家歷世相傳喻之為燈取其能破暗以顯物亦取其能繼照於無盡也自宋景德間道原大師始為傳燈嗣是則有廣燈續燈聯燈普燈之作所述互有詳略學者難以盡考由是大川濟公合之為會元始終一貫後學便之功至渥也若紹定以後諸師會元未及収者猶賴續燈收之但採錄未備且止於宋末元初自元以至今日將四百載諸師霾光鏟彩未獲著明於世伊誰之責乎愚不自揣乃於戊子之春博採旁蒐冀以緝補前闕至庚寅夏復得遠門柱公所輯五燈續略益補其所未備無何而病作殊劇歷三月始愈愈則目加昏耳加聾手亦不能復親筆硯故其所錄尚闕成化以下葢止乎其所不得不止也錄凡六卷名之曰繼燈或謂禪家貴在心悟語言文字其糟粕也何必連編累牘牽枝引蔓如五燈耶況又益之為繼燈耶是不知言可以障道亦可以載道執之則精醇即為糟粕了之則糟粕皆為精醇言顧可盡廢歟至其所錄或詳或略則亦因其時與機之不同其勢不得不然也如少林面壁二祖安心此則上古結繩之政也繼而有信心銘法寶壇經則軒轅之書契也唐世馬祖石頭二派浩浩說禪非三代之禮樂乎宋世五派競興五燈迭出非洙泗之六經乎時當略則結繩不為少時當詳則六經不為多要在逗眾生之機以明本有之性而已若責春秋之民曰何不為結繩之簡不亦悖乎至今日而猶有作者非得已也政如六經之後復有孟氏之七篇道性善稱堯舜倡仁義息邪說亦以明先王之道耳豈曰益之而為贅哉若夫所錄混濫弗當於西來之旨則如王通之五經雖自謂可繼孔氏而不自知實塵飯塗羹之戲也其罪戾不亦重乎此則吾之所深懼而不能自迯者尚當質之大方以俟郢削云歲在辛卯秋九月下浣之吉鼓山嗣祖沙門元贒序於聖箭堂中凡例七條宗派舊有五今惟臨濟曹洞二宗臨濟宗會元終於十七世故茲錄即始於十八世曹洞宗會元終於十五世故茲錄即始於十六世諸師法語不存而出處可考者必載之或一行之可傳或臨終之有異者亦載之使人毋謂宗門徒打口鼓也諸師或有名可知而出處言句俱失錄者但依舊例存其名以俟後人攷入其有頌古傳世者亦取其一二則附入此乃續略舊例今因之諸師言句或有醇疵相半者難以槩錄豈可盡捐今則節取之一以成前人之美一以碎金斷璧無非寶也五燈續略一書採錄為詳余所未及見者多得之此書其功偉矣但有余之所見而彼未及見者或有彼之所取而余則削去者或同一語錄而取舍各異者或同一行實而詳略有殊者故茲錄之行自不可已豈其功而為之哉五宗次序景德傳燈及正宗記俱先青原後南嶽大川乃私黨己宗以南嶽先青原後又恐人諍論故復以法眼先臨濟紊亂極矣今一依舊例為定諸師年代既遠嗣續難以攷正聞明初有續傳燈余未及見世已無傳惟嘉靖間有祖派圖載之頗詳然混亂極矣未可全據近見五燈續略攷正良多然亦未盡如東嶼海下有月林鏡今攷月林乃參本來人入道者實徑山第八十代住持入滅於正德乙卯與東嶼相去遠甚故特去之餘未及正姑以俟後之君子繼燈錄目錄序文凡例卷一曹洞宗青原下十六世雪竇鑑禪師法嗣天童如淨禪師華藏祚禪師法嗣東谷光禪師青原下十七世天童淨禪師法嗣鹿門覺禪師雪菴從瑾禪師石林秀禪師無錄孤蟾瑩禪師無錄日本道元禪師東谷光禪師法嗣直翁舉禪師無錄青原下十八世鹿門覺禪師法嗣青州一辯禪師直翁舉禪師法嗣天童岫禪師青原下十九世青州辯禪師法嗣大明寶禪師慈雲覺禪師天童岫禪師法嗣雪竇大證禪師青原下二十世大明寶禪師法嗣王山體禪師仁山恒禪師青原下二十一世王山體禪師法嗣雪巖滿禪師勝默光禪師仁山恒禪師法嗣大明詮禪師無錄青原下二十二世雪巖滿禪師法嗣報恩行秀禪師青原下二十三世報恩秀禪師法嗣少室福禪師報恩從倫禪師從寬禪師華嚴至溫禪師丞相移剌楚材居士青原下二十四世少室禪師法嗣少室文泰禪師報恩智泰禪師靈巖淨肅禪師青原下二十五世少室泰禪師法嗣寶應福遇禪師靈巖潔禪師無錄靈巖肅禪師法嗣寶應永達禪師封龍普就禪師青原下二十六世寶應遇禪師法嗣少室文才禪師靈谷謙禪師無錄靈巖潔禪師法嗣天界道成禪師封龍就禪師法嗣天慶義讓禪師青原下二十七世少室材禪師法嗣萬安子嚴禪師靈谷謙禪師法嗣靈谷正映禪師天慶讓禪師法嗣熊耳子定禪師青原下二十八世萬安嚴禪師法嗣少室了改禪師靈谷映禪師法嗣雪峰遠芷禪師無錄青原下二十九世少室改禪師法嗣少室契斌禪師卷第二臨濟宗南嶽下十八世鼓山永禪師法嗣淨慈悟明禪師靈隱善禪師法嗣雪峰善珍禪師龍濟宗鍪禪師淨慈仲頴禪師淨慈簡禪師法嗣育王大觀禪師徑山琰禪師法嗣淨慈廣聞禪師雙林朋禪師徑山原肇禪師靈隱普濟禪師東山源禪師弁山阡禪師育王瑞禪師法嗣瑞巖崇壽禪師乾元頴禪師法嗣鼓山祖鑑禪師育王堪禪師法嗣薦福燦禪師無錄天童傑禪師法嗣臥龍祖先禪師靈隱崇嶽禪師天童自鏡禪師薦福生禪師隱靜致柔禪師淨慈慧光禪師侍郎張鎡居士天童觀禪師法嗣華藏善淨禪師無錄虎丘善濟禪師天童頴禪師法嗣靈隱如珏禪師萬壽觀禪師法嗣黃龍慧開禪師孤峰德秀禪師無錄石霜妙印禪師南嶽下十九世雪峰珍禪師法嗣徑山行端禪師淨慈頴禪師法嗣江心了萬禪師嶽林益禪師育王觀禪師法嗣仰山元熈禪師淨慈聞禪師法嗣徑山妙高禪師天童鑒禪師雙林朋禪師法嗣靈隱祖誾禪師靈隱濟禪師法嗣雪竇炳同禪師薦福燦禪師法嗣支提澄鑑禪師臥龍先禪師法嗣徑山師範禪師靈隱法薰禪師雲居慈覺禪師靈隱嶽禪師法