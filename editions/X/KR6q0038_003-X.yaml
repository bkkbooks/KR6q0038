body:
  text: 鼓山嗣祖沙門元賢輯臨濟宗南嶽下二十世徑山端禪師法嗣杭州靈隱性原慧明禪師台州黃巖夏氏子既長不甘處俗往依樂清寶冠寺出家後謁元叟叟曰東嶺來西嶺來師指草鞋曰此是三文錢買的叟曰未在更道師曰某甲只恁麼和尚作麼生叟曰念汝新到放汝三十棒師乃悟旨久之究盡底蘊乃曰纔涉思惟皆為剩法初住鄞之五峰洪武五年詔建佛會於鍾山召高行沙門師與季潭泐公與焉後住靈隱上堂舉香嚴和尚曰去年貧未是貧今年貧始是貧去年貧猶有卓錐之地今年貧錐也無眾中忽有個漢出來問長老錯了也今朝四月八是佛生日如何舉此公案山僧只對他道住持事繁師室中垂語曰蓮華峰被蜉蝣食却半邊因什麼不知又曰冷泉亭吞却壑雷亭即不問南高峰與北高峰鬬額是第幾機十九年遭無妄之災逮捕或勸師早自為計師不顧怡然詣所司未鞫即廡下說偈端坐而化海鹽州天寧楚石梵琦禪師寧波象山朱氏子生在襁褓有僧見而謂其父曰此佛日也必當大振佛法照耀濁世九歲授經十六為僧二十因閱楞嚴至緣見因明暗成無見不明自發則諸暗相永不能昏於此有省參元叟於徑山問如何是言發非聲色前不物叟遽曰言發非聲色前不物速道速道師擬進語叟振威一喝師乃錯愕而退已而應書大藏之選至京師一夕聞城樓上鼓聲豁然大悟述偈曰崇天門外鼓騰騰驀劄虗空就地崩拾得紅爐一片雪却是黃河六月冰冬歸再參叟叟迎笑曰且喜大事了畢命分座未幾出世海鹽之福臻升主永祚次報國再遷本覺帝師錫號佛日普照慧辯禪師移光孝再住永祚開堂日僧問我本無心有所希求今此法王大寶自然而至如何是法王大寶師曰有眼者見有耳者聞曰莫只者便是麼師曰擊碎髑髏拽脫鼻孔曰如何受用師曰直待雨淋頭上堂舉僧問乾峰十方薄伽梵一路涅槃門未審路頭在什麼處峰以拄杖畫一畫曰在者裏師曰白雲萬里僧舉前話問雲門門曰扇子𨁝跳上三十三天築著帝釋鼻孔東海鯉魚打一棒雨似盆傾師曰白雲萬里忽有人出來問天寧與麼批判還愜得二大老意麼向他道白雲萬里呵呵呵囉囉哩囉囉哩剎剎塵塵知幾幾十字街頭石敢當忽然吸竭滄溟水你輩茄子瓠子那裏知得拍禪牀便起上堂汝等諸人見我開口便作說法會見我無言便作默然會總向兩頭覓我爭知不在兩頭你道尋常在什麼處莫是高高峰頂立不露頂麼深深海底行不濕脚麼若恁麼早被伊尋著也還知山僧有隱身訣麼終朝不見長相見盡日相逢却不逢有念盡為煩惱鎻無心端是水晶宮喝一喝上堂聞茶板喫茶去聞浴板洗浴去聞壽山道你諸人休去歇去為什麼不肯與麼去忽有人出來道和尚恠某甲不得向他道未到壽山與汝三十棒了也上堂一向面壁道絕人荒一向貪程眼瞤耳熱未有長行而不住未有長住而不行或時十字街頭拈起拄杖和其光同其塵灼然一切處光明燦爛去或時孤峰頂上放下鉢囊杜其谿塞其穴灼然一切處放教枯淡去即心即佛也不得非心非佛也不得不是心不是佛不是物也不得我見兩個泥牛鬬入海直至如今無消息喝一喝一日因施主送楊梅僧就盒拈起問曰一般楊梅為什麼有赤有白師以盒子合却曰見個什麼僧無語師又開盒曰聻僧又無語師曰你只是個無開合漢問大悲菩薩用許多手眼作麼師曰春風不褁頭一夕望月次僧指月問師曰一半得恁麼明者一半得恁麼暗師曰明者從他明暗者從他暗曰十五夜圓時暗向什麼處去師曰也與三十不較多曰恁麼則全無明暗也師曰還見真月麼曰如何是真月師曰不照燭曰照燭時如何師曰多少人撈天摹地曰莫只者便是麼師曰猶是影在僧擬進言師便喝一僧送拄杖師曰從什麼處得來僧度拄杖師竪起曰是體是用曰拈也從體起用放也攝用歸體師曰你與麼來只得其體不得其用曰和尚與麼舉只得其用不得其體師卓一下靠拄杖曰體用一齊收洪武元年九月十一日徵師說法於蔣山廷臣奏其說上大悅二年三月復用元年故事召師說法如初錫宴文樓下親承顧問暨還出內府白銀以賜三年之秋上以鬼神之理甚幽意遺經必有明文命揀僧中通三藏之說者集焉師與夢堂行中等十六人應召而至館於大天界寺上命儀曹勞之既而援據經論成書將入朝敷奏忽示微疾跏趺書偈曰真性圓明本無生滅木馬夜鳴西方日出書畢謂夢堂曰師兄我將去矣堂曰何處去師曰西方去堂曰西力有佛東方無佛耶師振威一喝而逝時七月二十六日也弟子奉遺骸及諸不壞者歸海鹽塔於西齋壽七十五臘六十二杭州徑山愚菴智及禪師蘇之吳縣顧氏子生而靈異發祥及入海雲院為童子釋書儒典竝進其師嘉之使其祝髮受具聞賢首家講法界觀往聽之未及終章莞爾而笑曰一真法界圓同太虗但涉言辭即成賸法縱獲天雨寶花於我奚益哉遂往建業參笑隱於龍翔隱以文章道德傾動一世師微露文采交相延譽同袍嶼上座呵曰子才俊爽若此不思荷負大法甘作詩騷奴僕乎無盡燈偈所謂黃葉飄飄者不知作何見解師舌噤不能加答即歸海雲目不交睫者踰月忽見秋葉墮於庭豁然有省謁元叟於徑山遂得法焉至正壬午宣政院舉師出世昌國之隆教轉普慈未幾升淨慈復升徑山上堂師召大眾眾皆仰視師曰子過新羅便下座上堂僧問釋迦已滅彌勒未生正當今日佛法委付何人師曰老僧打退鼓曰前無釋迦後無彌勒還有參學分也無師曰風不來樹不動乃曰目前無法心外無機皇風蕩蕩民物熈熈花霏霏日遲遲高下林巒錦繡圍却恠當時杜䳌子春山無限好猶道不如歸上堂時維三月節屆清明不寒不熱半陰半晴落花啼鳥一聲聲驀拈拄杖曰穿却解空鼻孔𭣟瞎達磨眼睛踏破草鞋赤脚走好山猶在最高層上堂四大本空佛依何住青青翠竹盡是法身若悟無依佛亦無得鬱鬱黃花無非般若諸人信也好不信也好三千里外遇著本色道流輙不得道徑山從來柳下惠善權通長老嗣書到上堂自從胡亂後三十年不少鹽醬雪後始知松栢操任你非心非佛我只管即心即佛事難方見丈夫心有底便道江西信息通也大梅梅子熟也善權方便固當如是只如石頭道書亦不達信亦不通諸人如何話會直下道得鈯斧子未到你在師一日入園見典座割瓜師問割得幾個祖師頭座曰三十個師曰那個皮下有血座曰和尚何是重重相戲師曰好心不得好報僧問如何是清淨法身師曰月色和雲白松聲帶露寒問藥山示眾曰我有一句子待特牛生兒即向汝道未審是那一句師曰千手大悲提不起曰時有僧出云特牛生兒也祇是和尚不道山喚侍者將燈來僧便抽身歸眾意旨如何師曰一對鴛鴦畵不成問竺土大仙心東西密相付如何是密付底心師曰九秋黃葉亂飄金曰和尚莫將境示人師曰老僧罪過問天上無彌勒地下無彌勒未審誰與安名師曰我行荒草裏汝又入深村問淨法界身本無出沒因甚釋迦老子今日降生師曰知而故犯曰遵布衲浴佛次藥山問你只浴得者個還浴得那個麼遵曰把那個來如何是那個師曰擔枷過狀問如何是本身盧舍那師曰不離闍黎所問曰如何保任師曰彼自無瘡勿傷之也問如何是一句具三玄師曰萬仞峰頭駕鐵船曰如何是一玄中具三要師曰眼裏瞳人吹木呌曰如何是和尚家風師曰吹折門前一株松曰學人不問者個風師曰汝問什麼風曰家風師曰我者裏大功不竪賞問既是一真法界為什麼却有萬別千差師曰甜瓜徹蒂甜苦瓠連根苦問道遠乎哉觸事而真喚什麼作真師曰千年無影樹曰聖遠乎哉體之即神喚什麼作神師曰今時沒底靴曰羣陰欲去未去之際一陽欲生未生之時還有佛法也無師曰鐘作鏡鳴鼓作鼓響曰今古應無墜分明在目前師曰莫眼花洪武癸丑詔有道之僧十人集京師天界寺而師實居其首以病不及召對乙卯賜還海雲戊午八月忽示微疾至九月四日索筆書偈而逝壽六十八﨟五十一塔遺骸於海雲以爪髮塔徑山蘇州府萬壽寺行中至仁禪師饒之番易吳氏子自幼識見頴卓出家後遍參諸老及參元叟叟曰仁書記虎而翼者也出世德章遷崇報萬壽等剎辭萬壽歸松林示眾幻軀將逼從心年松下經行石上眠珍重北山龍象眾普通年話幾時圓洪武初詔入京問以鬼神之事師以佛旨為書進上大悅臨終書偈而逝靈隱樸隱元瀞禪師會稽人姓倪初以童子從弘教大師立公祝髮受具後遍游講席尋棄去參玉几石室瑛瑛奇之指參元叟入門叟厲聲一喝師頓脫黏縛遽稽首作禮叟曰汝果何所見耶問答四三轉皆愜叟意叟曰是般若中人也命歸侍司尋掌記久之遍參諸老宿咸推譽之至正十六年出世會稽長慶升天衣上堂即心即佛嘉州牛喫禾非心非佛益州馬腹脹不是心不是佛天下覓醫人炙猪左膊上良久曰啼得血流無用處不如緘口過殘春上堂聲不是聲觀音三昧色不是色文殊法門聲色無碍普賢境界拈拄杖畫一畫曰大鵬展翅葢十洲籬邊之物空啾啾明興詔天下有道沙門建會於鍾山師被召入內庭從容問道賜食而退已而辭歸和塔處洪武九年起住靈隱未幾以無妄之災被謫陝西為民行至寶應夜宿寧國寺端坐而化有三會語樸園集行於世台州國清夢堂曇噩禪師慈谿王氏子也家本宦族洎長窮覧儒籍徹其義髓嘗嘆曰攻書修辭此世間相耳曷若求出世間法乎乃往依長蘆雪庭傳公為僧後參元叟叟風規嚴峻非宿學之士莫敢闞其門師直前咨叩機鋒交觸情想路絕叟頷之至元五年出世保聖再遷開壽三轉國清帝師錫佛真文懿之號洪武二年詔徵有道僧而師與焉既奏對上憫其年耄放令還山一旦無疾謂弟子曰三界空花如風捲煙六塵幻影如湯澆雪亘古亘今惟一性獨存吾將入滅聽吾偈曰吾有一物無頭無尾要得分明涅槃後看言訖危坐而逝世壽八十有九師律身嚴謹體道勤渠日惟一食夜則坐以達旦嘗誡諸徒曰吾與爾等研究空宗當外形骸忘寢食以消累劫宿習然後心地光明耳翰林學士承旨張公翥曰噩師儀觀偉而重戒行嚴而潔文章簡而古禪海尊宿今一人耳師平生製作甚富多為縉紳所推重但悉不存稿晚年重修歷代高僧傳鍥梓行世筆力遒勁識者謂有得於太史遷云杭州府徑山古鼎祖銘禪師四明奉化應氏子依金峨錫公得度竺西坦公辟為內書記後遍參諸老宿屬元叟在靈隱師往從之扣以黃龍見慈明機緣叟詰之曰只如趙州云臺山婆子被我勘破與慈明笑曰是罵耶你且道二老漢為復肝膽相似為復鼻孔不同師曰一對無孔鐵鎚曰黃龍當下悟去又且如何師曰病眼見空花叟曰不是不是師擬進語叟便喝自是廓然無碍命居記室晨夕警發益臻閫奧元絃元年出住昌國之隆教遷補陀中天竺尋主徑山錫號慧性宏覺普濟禪師僧問如何是佛師曰秤錘蘸醋曰如何是佛向上事師曰仰面不見天曰記得僧問雲門如何是佛門曰乾屎橛又作麼生師曰雲門不是好心曰乾屎橛與秤錘蘸醋相去多少師曰鑊湯無冷處僧擬進言師便喝僧問祖意教意是同是別師曰破糞箕生苕僧禮謝師曰昨夜三更失却牛天明起來失却火後因徑山𡨥亂中天竺用貞良公請歸了幻菴尋示疾書偈曰生死純真太虗純滿七十九年搖籃繩斷擲筆而化杭州靈隱竹泉法林禪師台州寧海黃氏子參元叟於中天竺叟問何處來師曰天台叟曰曾見寒山拾得麼師叉手向前曰今日親見和尚叟曰脫空謾語漢參堂去看經次叟曰看經那師曰是叟曰將甚麼看師曰將眼看叟竪起拳曰何不道將者個看師曰放下拳頭將甚麼看叟微笑至元四年主靈隱上堂法是常法道是常道拶破面門點即不到雪峰一千七百人善知識朝夕只輥三個木毬趙州七百甲子老禪和見人只道喫茶去中峰居常見兄弟相訪只是敘通寒溫燒香叉手若是金毛師子子三千里外定誵訛上堂舉趙州布衫話師曰趙州雖則善用太阿截斷者僧舌頭未免自揚家醜靈隱則不然忽有僧問萬法歸一一歸何處只向他道今日熱如昨日至正十五年二月二日示寂書偈曰七十二年虗空釘橛末後一句不說不說遂奄然而化杭州徑山復原福報禪師台之寧海方氏子往投石湖美公薙髮參元叟叟問近離甚處師曰淨慈叟曰來作什麼師曰久慕和尚道風特來禮拜叟曰趙州見南泉作麼生師曰頭頂天脚踏地叟曰見後如何師曰饑來喫飯困來眠叟曰何處學得者虗頭來師曰今日親見和尚叟頷之次日命入侍司明年升掌藏久之出世蘆山遷東山智門上堂舉一不得舉二放過一著落在第二古人恁麼說話正是抱贓呌屈東山即不然舉二不得舉一放過一著落在第七到者裏須知有向上一路始得如何是向上一路良久曰莫守寒巖異草青坐却白雲宗不妙上堂一葉落天下秋一塵起大地收誰謂北鬱單越不是南贍部洲剛自騎牛更覓牛上堂語是謗默是誑還有二俱不涉者麼拍禪牀曰洎合停囚長智洪武初驛召有道沙門師赴京屢入內庭應對稱旨留三年賜還兩住徑山一日得疾甚革侍者請偈師叱曰吾世壽尚有三年已而果然及化之日忽拍手曰呵呵呵大眾是什麼看取竟寂仰山熙禪師法嗣金陵龍翔笑隱大訢禪師南昌陳氏子參晦機機問曰黃龍向泐潭得旨領徒遊方及見慈明氣索汗下過在什麼處師曰千年桃核裏覓甚舊時仁又一日以百丈野狐話詰之且道不落因果便墮野狐身不昧因果便脫野狐身利害在什麼處師擬答機喝一喝師始豁然出世吳興烏回遷鳳山天竺天曆己巳文宗以金陵潛宮為龍翔集慶寺詔師開山上堂釋迦世尊捨金輪而登佛位今上皇帝從佛位而御金輪收攝三千剎海於一印中具足八萬法門於一毫上如華嚴會上菩薩得無盡福德藏解脫門於一器中出生種種美味飲食又於眾會仰觀空中而雨種種珍寶隨眾生心悉令滿足然後得其寶者盡證法門食其味者咸成妙道無一塵而不具足佛事無一法而不圓滿正宗即今崇建寶坊闡揚法施諸天音樂不鼓自鳴梵唄詠歌自然敷奏十方菩薩咸集道場八部天龍同伸慶讚還有不歷化城徑登寶所者麼擊拂子曰四海已歸皇化裏時清休唱太平歌文宗皇帝聖忌滿散藏經上堂尊而無上高超象帝之先貴不可名坐斷毗盧之頂其頂之大則容攝十虗其用之廣則包括萬類如月涵眾水無分淨穢之殊春在百花不見正偏之相妙有不有真空不空所以道無邊剎海自他不隔於毫端十世古今始終不離於當念擲大千於方外納須彌於芥中於斯見得便見文宗皇帝昔從佛地示現王宮撫治家乂安宗社化道已周復歸佛位寂然不動智普應於十方廓爾無私化已周於沙界龍翔與麼贊揚且道還契聖意也無良久曰優鉢天花吹不斷又從兜率下閻浮上堂言發非聲色前不物著甚來由聲色裏睡眠聲色裏坐臥却較些子所以道即此見聞非見聞無餘聲色可呈君個中若了全無事體用何妨分不分驀拈拄杖曰水流黃葉來何處牛帶寒鴉過遠村卓拄杖下座至正甲申五月示寂金陵保寧仲方天倫禪師明之象山張氏子參晦機機問曰湖山藹藹湖水洋洋浸爛你鼻孔塞破你眼睛因甚不知師曰通身無影象步步絕行踪機曰未在更道師拂袖便出遂依座下屢以此事叩問機終不肯乃往吳興桃花塢結茅一日聞雷有省徹見晦機用處出世東泉佛巖保寧臘八上堂昨夜見明星悟道後園風打籬笆倒曉來無跡可追尋雪山依舊生青草上堂初三十一中九下七七九六十三九九八十一朝往西天暮歸唐土一馬生三寅石牛攔古路參上堂修多羅教如標月指昨日有人從西州來接得東州信報道大食國裏人在眼睫上賣香藥喝一喝杭州中天竺一關正逵禪師饒之鄱陽方氏子參晦機機問甚處人師曰鄱陽人機曰鄱陽湖水深多少師曰瞪目不見底機曰恁麼則浸爛衲僧鼻孔也師曰終不借和尚鼻孔出氣機曰畢竟借誰鼻孔出氣師曰恭惟和尚萬福機肯之命充侍司尋往參元叟叟命掌記後出世金陵崇因示眾心不是佛智不是道一念涉思惟全身入荒草所以道目前無法意在目前不是目前法非耳目之所到古今天地古今日月古今山河古今人倫頭頭顯露物物全彰不從千聖借不向萬機求內外絕承當古今無處所恁麼解會猶是錯認驢鞍橋作阿爺下頷雖然既是泗洲大聖因甚在楊州出現良久曰參明州育王石室祖瑛禪師蘇之吳江陳氏子齠年出家即䇿杖遊方初參虗谷陵聞晦機道化亟往投之一見契合遂留掌記出住隆教移萬壽遷雪竇育王師有謝平石砥禪師問疾偈曰是身無我病根深慙愧文殊遠訪臨自有巖花談不二青燈相對笑吟吟後造一木龕日坐其中不涉世事臨終示眾曰五十三年弄巧成拙踏破虗空赤脚行萬象森羅笑不徹遂趺坐而化嘉興府祥符寺梅屋念常禪師世居華亭黃姓年十二依平江圓明院薙髮至大戊申晦機自百丈遷淨慈師往參值機上堂舉太原孚上座聞角聲因緣頌曰琴生入滄海太史遊名山從此楊州城外路令嚴不許早開關有省投丈室呈所解機頷之俾掌記室服勤七年延祐丙辰主祥符著佛祖通載二十二卷行於叢林靈隱誾禪師法嗣江州東林無外宗廓禪師南昌魏氏子初參悅堂堂問溪聲盡是廣長舌因緣機語相契遂承印記初住雲居晚遷東林臨終偈曰吾年七十一世緣今已畢挨倒五須彌夜半日頭出倏然而逝徑山範禪師法嗣袁州仰山雪巖祖欽禪師初在鐵橛遠會下便看狗子無佛性話止坐在澄澄死水中次過淨慈參天目禮堂中勇猛提撕忽有所得但見地不脫礙正知見後在徑山無準會下多年而此病不除一日在天目佛殿上行擡頭見一株古栢礙膺之物撲然而散始見徑山老人立地處初住潭州龍興晚主仰山凡經六剎上堂露地白牛黑黑是處尋他不得山青水綠似有而無眼見耳聞依俙彷彿全不顧時蹄角却在纔動著時踪由已沒月下閒將短笛吹風前休把長繩勒呵呵呵也奇特如今趂亦不去自在東西南北小參濟北之道出乎平常語默動靜脫體全彰三玄三要松直棘曲四賓四主鳧短鶴長所以圓悟於諸佛出身處道熏風自南來殿閣生微凉帶累妙喜打失鼻孔徧界難藏山蒼蒼水茫茫無朕跡絕承當竹籬茅舍江村外遠浦歸帆挂夕陽上堂豆好合醬鹽好煑羹飯能療饑茶能止渴從上以來的的相承逗到理極情忘處無越乎此因甚楊岐老古錐却道弄蹄驢子三隻脚開眼也著合眼也著上堂聲色已盡有未盡者存焉見聞已脫有未脫者在焉直得如木頭照鏡頑石聽鐘猶有木頭頑石在是汝諸人曾到者田地無曾有者時節無若是今日參禪明朝辦道善財手裏一莖草杭州淨慈斷橋妙倫禪師台州黃巖徐氏子十八落髮於永嘉廣慈院見谷源於瑞巖聞麻三斤話疑之忽閱楞伽至蚊蟲螻蟻無有言說而能辦事頓然有省謁無準於雪竇準以狗子因何有業識令師下語凡三十轉不契師曰可無方便乎準以真淨所頌答之即竦然良久忽聞板聲通身汗下於是始脫然矣出世祇園遷瑞巖國清至淨慈上堂荊山有玉獲得者不在荊山赤水有珠拾得者不在赤水衲僧有無位真人證得者出入不在面門驀拈拄杖橫按曰會麼幽州江口石人蹲上堂德山低頭夾山點頭俱胝竪起手指頭玄沙築破脚指頭拈拄杖曰都來不出山僧拄杖頭何以見得卓拄杖曰一葉落天下秋上堂舉達觀頴禪師示眾曰七佛是性隷萬法是心奴且道主人翁在甚麼處自喝曰七佛以下出頭又自諾曰各自祇候師曰喚七佛為性隷指萬法是心奴達觀自謂有出身路及乎自喝自諾又是奴隷邊事主人翁何曾夢見在大眾要見麼以拂一拂曰曉來一陣春風動開遍園林百樣花臨終集眾入室作書辭諸山及魏國公公使人問曰師生天台因什死在淨慈師曰日出東方夜落西書偈而化明州天童西巖惠禪師嘗頌六祖傳衣話曰不作樵夫作碓夫只將脚力驗精粗知他踏著踏不著和米和糠到鉢盂又頌泐潭常興見南泉來便面壁話曰面壁堆危引客過問誰那更問如何道尋常已成多事檢點儂家事更多明州天童別山祖智禪師蜀之順慶楊氏子十四得度聞僧誦六巖語悅之時巖住蘇之穹窿亟往從焉因閱華嚴經彌勒樓閣入已還閉之語恍如夢覺遂頌靈雲見桃花曰萬綠叢中紅一點幾人歡喜幾人嗔巖頷之越二年遍叩諸尊宿最後見無準於雪竇準知是法器待之彌峻時或棒喝交下一語不少貸師擬對輙噤不能發由是知解都喪久之作而言曰吾平生伎倆皆死法今見此翁始行活路既而準移徑山命師分座出世洞庭天王寶祐丙辰天童朝旨以師補之師至一囊一鉢縛茅以居凡三年克復舊觀庚辰九月旦示眾曰雲淡月華新木落山骨露有天有地來幾個眼睛活有省問者師曰不及相見各自努力越十日夜分呼侍者囑後事珍重大眾叉手而寂月坡明禪師嘗頌僧問子湖自古上贒還達真理曰手裏絲綸卷復舒扁舟撩撥洞庭湖忽然惡浪翻空立收拾歸來一伎無環溪一禪師嘗頌即心即佛話曰即心即佛砒霜狼毒起死回生不消一服希叟曇禪師舉僧問南泉師歸丈室將何指南泉曰昨夜三更失却牛天明起來失却火頌曰奴顏婢膝走人間羞見羊裘七里灘文叔雖為天子貴子陵元作故人看杭州靈隱退耕寧禪師上堂目前雨餘山色翠座間風暖鳥聲喧拍禪牀一下曰堪笑老胡無轉智少室峰前坐九年上堂極目千峰鎻翠滿空柳絮飛綿可憐無位真人一向草宿露眠啞今春看又過何日是歸年福州雪峰絕岸可湘禪師台州寧海葛氏子參無準範得旨咸淳八年主雪峰凡十年謝院事退居杭州寶壽寺甞頌僧問歸宗如何是玄旨曰三聲鼎葢普門開苦海勞生喚不回九十春光今又半空飛花片點莓苔又頌楞嚴八還辯見曰還還還後更無還一個閒人天地間昨夜大蟲遭虎咬皮毛落盡體元斑至正二十七年示寂壽八十五歸骨雪峰建塔於西菴靈隱薰禪師法嗣杭州淨慈愚極慧禪師參石田田舉雲門念七話無人下語忽有僧纔跨門田曰雪峰輥毬師在傍驀然領旨衝口說偈曰雲門念七雪峰輥毬白蘋紅蓼明月孤舟田頷之杭州中天竺雪屋珂禪師上堂枯桑知天風海水知天寒且道衲僧知個甚麼知道飯是米做直饒恁麼閻羅老子索飯錢有日在師以宋鼎既遷即謝寺事金山默菴覺禪師雅知師且尊其道行時元兵下江南菴被總兵伯顏脇而置之幕中從至武林默菴言於伯顏請師升住靈隱親持請疏叩師門師抽關露半面問曰汝為誰默菴曰和尚故人某甲也師落關曰我不識你葢師雖處世外而以忠節自持故不屑靈隱之命後斷江恩禪師贊曰雪屋今亡四十年高風凜凜尚依然伯顏丞相拜牀下不肯為渠來冷泉天童禮禪師法嗣明州育王橫川如珙禪師夜參少室無門戶如何便得通夜深寧耐立聽我話西東甞頌躭源問國師百年後有人問極則事作麼生曰正直道流行脚去護身符子不須擔國師實為躭源切不是臨岐作對談杭州淨慈石林行鞏禪師上堂舉僧問古德曰如何是看經眼古德竪起拳頭師曰喚作看經眼又是拳頭喚作拳頭又是看經眼到者裏作麼生緇素召大眾曰背觸難分處機先失照時虗空也穿透何止爛牛皮上堂山靜課花蜂股重林空含籜笋肌明倚欄不覺成痴兀又得黃鸝喚一聲思溪恁麼道好喫拄杖三十何故為他不合隨聲逐色華藏通禪師法嗣杭州徑山虗舟普度禪師維揚江都人史姓出家徧參謁無得得問不與萬法為侶者是甚麼人師曰金香爐下鐵崑崙得曰將謂者矮子有長處見解只如此師曲躬作禮曰謝和尚證明出世金陵半山後歷遷諸剎而至徑山上堂邪人說正法正法悉皆邪正人說邪法邪法悉皆正卓拄杖一下曰邪耶正耶又卓一下曰說耶不說耶向者裏揀辯得出黃金為屋未為貴玉食錦衣何足榮上堂萬法是心光諸緣惟性曉本無迷悟人只貴今日了既無迷悟人了個什麼卓拄杖一下曰千言萬語無人會又逐流鶯過短墻上堂舉臨濟和尚道有一人論劫在途中不離家舍有一人離家舍不在途中那個合受人天供養師曰兔馬有角牛羊無角寸毫尺𨤲天地寥廓潘閬倒騎驢攧殺黃番綽俄示微恙索筆大書曰八十二年駕無底船踏翻歸去明月一天擲筆而逝雪竇謙禪師法嗣平安府承天覺菴真禪師有華嚴講主挾上命將易為講肆師曰汝能說禪吾從汝易吾不能說教汝易吾從於是撾鼓陞堂以一喝入五教顯示吾宗千聖頂𩕳上一著子講主泣下再拜乞懺悔而退道場巖禪師法嗣臨安府徑山虗堂智愚禪師四明人出世嘉禾之興聖後歷主十剎咸淳十年奉詔住徑山上堂言而足終日言而盡道言而不足終日言而盡物且道道與物是一是二若道是一為什麼客山高主山低若道是二為什麼天地一指萬物一馬個裏緇素得出還你草鞋錢不然但願來年蠶麥熟羅睺羅兒與一文師初住淨慈天使傳旨問趙州八十行脚虗堂因甚八十住山師舉趙州行脚到臨濟話頌曰趙州八十方行脚虗堂八十再住山別有一機佛祖九重城裏動龍顏使以頌回奏上大悅特賜米五百石絹一百縑其住育王徑山亦賜賚優渥師室中垂語曰己眼未明底因甚將虗空作布袴著畵地為牢底因什透者個不過入海算沙底因甚向針鋒頭上翹足後示寂塔於徑山直嶺下杭州淨慈石帆衍禪師舉大顛擯首座因緣頌曰一串摩尼覿面當機賺殺首座疑殺昌黎弄盡許多窮伎倆春秋元自不曾知金山開禪師法嗣臨安府徑山石溪心月禪師眉州人僧問如何是佛師曰矮子看戲嘗頌黃山谷在黃龍聞桂香悟道曰渠儂家住白雲鄉南北東西路渺茫幾度欲歸歸未得忽聞叢桂送幽香又頌唐文宗嗜蛤蜊因緣曰一點悲心擘不開鑊湯滾處笑盈顋希奇之事朕難信見與君王說法來徑山冲禪師法嗣杭州淨慈簡翁敬禪師舉溈山問仰山曰終日與子商量成得個什麼邊事仰空中畫一畫溈曰若不是吾終被子惑師頌曰父子雖親共較量胸中爭信有刀鎗當時一畫畫得斷遍界葛藤無復生又頌文殊問菴提遮女生以何為義及死以何為義曰問處分明答處端當機覿面不相謾死生生死元無際月上青山玉一團北山隆禪師頌鳥窠吹布毛曰八十翁翁要力行布毛吹起禍重生殺人流血三千里枯樹枝頭一老僧鼓山凝禪師法嗣蒙山異禪師參皖山於鼓山教看個無字未有省入遂往承天謁孤蟾瑩禪師一日坐次首座入堂燒香打香盒作聲有省頌曰沒興路頭窮踏翻波是水超群老趙州面目只如此次依虗堂堂指瓶梅曰做得頌者歸堂師曰戰退羣陰得意回百花頭上作春魁看他方便為人處放出春風和氣來堂曰歸堂去復參皖山山問光明寂照遍河沙豈不是張拙秀才語師欲開口山便打喝出次年一日上石梯子廓然大悟復上方丈山又問光明寂照遍河沙豈不是張拙秀才語師便掀倒禪床山乃擒住曰那裏是話墮處師以手掩山口山曰誵訛在什麼處師曰再犯不容山曰更頌來師即頌曰雲門捏怪不堪自敗獅子齩人韓獹逐塊山曰拄杖不在別日與汝一頓師曰和尚要用借你山拈起竹篦打三下師便禮三拜退住後示眾蘇州有常州有八角磨盤空裏走日面佛月面佛覿面和盤都托出便與麼掀倒禪牀拂袖散去法門幸甚或有猶豫之者只得把手牽汝歸家聞聲悟道見色明心竪拂子曰見麼見底是色那個是心喝一喝曰聞麼聞底是聲那個是道直下正眼豁開方得入門猶是脫白沙彌要與衲僧齊驅並駕更進竿頭一步師垂三關語以驗學者曰蟭螟蟲吸乾滄海魚龍蝦蠏向何處安身立命又曰水母飛上色究竟天入摩醯眼裏作舞因甚不見又曰蓮湖橋為一切人直指明眼人因什落井慶壽璋禪師法嗣燕京慶壽寺海雲印簡禪師山西寧遠宋氏子生而神悟七歲父授以孝經開宗明義章師曰開者何宗明者何義父驚異於是禮中觀沼為師一日扶觀行觀曰法燈禪師道看他家事忙且道承誰力汝作麼生會師將觀手一掣觀曰者野狐精師曰喏喏觀曰更須別參後䇿杖之燕過松舖值雨宿於巖下因擊火大悟自捫面曰今日始信眉橫鼻直信道天下老和尚不寐語謁中和璋禪師遂承記莂語見中和章辛卯師主慶壽一日於廊下逢數僧師問第一僧曰那裏去曰賞花去師便打問第二僧那裏去曰禮佛去師亦打問第三僧那裏去曰那裏去師亦打問第四僧那裏去僧無語師亦打問第五僧那裏去曰覓和尚去師曰覓他作麼曰待打與一頓師曰將甚麼來打曰不將棒來打師連打四下曰者掠虗漢眾皆走師召曰諸上座眾回首師曰是什麼後歷承寵命大弘濟北之道示寂諡佛日圓明大師
