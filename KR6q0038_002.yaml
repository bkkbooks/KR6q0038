body:
  text: 鼓山嗣祖沙門元賢輯臨濟宗南嶽下十八世鼓山永禪師法嗣臨安府淨慈晦翁悟明禪師福州人上堂舉夾山會下一僧到高亭才禮拜亭便打僧曰特來禮拜何得打某甲僧再禮亭又打趂僧回舉似夾山山曰會麼僧曰不會山曰賴汝不會汝若會即夾山口啞應菴拈曰高亭一期忍俊不禁爭奈拄杖放行太速者僧當時若是個漢莫道高亭夾山便是達磨大師出來也斬為三段何故家肥生孝子國有謀臣師曰高亭夾山門庭施設各得其宜但中間一人較些子應菴與麼道也是鞏縣茶瓶師纂修聯燈會要傳於叢林靈隱善禪師法嗣師嗣育王光會元無出今收入補燈福州雪峰藏叟善珍禪師泉州南安呂氏子謁妙峰於靈隱入室悟旨出世里之光孝升承天雪峰復以朝命遷主育王及徑山上堂盡大地是紫磨金身諸人終日開眼見釋迦老子心肝舉步築著釋迦老子鼻孔説有説無是誑説生説滅是謗説即心非心是妄不誑不謗不妄春風吹落桃李花淡煙疏雨籠青嶂嘗自題其像曰參禪無悟識字有數眼三角似燕山愁胡面百摺如趙婆呷醋一著高出諸方敢道飯是米做除夜小參舉僧問古德年窮歲盡時如何德曰依舊孟春猶寒師曰古德恁麼答話只怕諸人忘却今日忽有人問年窮歲盡時如何拈棒便打待他道因什麼打某甲即向他道更要我道孟春猶寒那上堂春雪寒春宵短古佛心破燈盞正法眼乾紙撚抖搜精神只管看看到北斗西移南斗東轉上元依舊正月半嘉定丁丑示寂吉安府龍濟院友雲宗鍪禪師廬陵王氏子初依妙峰一日峰上堂拈拄杖曰釋迦老子來也諸人還見麼微妙淨法身具相三十二放下拄杖曰你諸人不會入涅槃去也師於言下豁然後登吉水之佛頂峰得修山主古寺以居焉木食澗飲夙夜危坐或雪寒無宿火啖菖獨數寸度日嘗口占以自遣曰山僧有分住煙蘿無米無錢莫管他水似琉璃山似玉眼前儘有許來多妙峰寄法衣竹篦并其肖像以付師峰自題其像曰妙峰孤頂草離離橫按竹篦三尺鐵只許佛頂龍濟知父子不傳真祕訣師嘗書門以示來參曰除却眼耳鼻舌身意那個是你自己若也道得許你親見龍濟來其或未然且居門外雪巖和尚見而問曰曾接得幾人師曰山僧從來不會按牛頭喫草僧問臘月三十日到來時如何師曰門前無索債人忽示疾集衆囑後事復彈指一聲曰只此是別衆語也侍僧請留頌不答至夜分遽索筆書曰一燈在望更無言説大地平沉虗空迸裂遂坐逝杭州淨慈東叟仲頴禪師上堂切忌隨他覓無勞向己求縱橫活潑潑有放還有收是什麼一葉落天下秋嘗頌長慶總似今日老胡有望曰天高鴻雁侵雲舉地肅蛩螿入草鳴渾是一秋風景裏客愁幾逐異鄉情淨慈簡禪師法嗣師嗣育王光會元無出今收入補燈慶元府育王物初大觀禪師明之鄞縣陸氏子初依北澗於南屏一日入室次機語契合遂大發明後出世屢遷名剎晚主育王上堂一冬二冬你儂我儂暗中偷笑當面脫空雖是尋常茶飯誰知米裏有蟲夜來好風吹折門前一枝松上堂用黑豆法換人眼睛如恆河沙會火爐頭話能有幾個九九九三世諸佛不知有翻身踢倒五須彌何用法身藏北斗藏北斗分明向外揚家醜上堂塵劫來事只在今時當斷不斷斗換星移拈拄杖卓一下曰花須連夜發莫待曉風吹上堂舉龐居士問馬大師不與萬法為侶是什麼人大師曰待汝一口吸盡西江水即向汝道師曰大小祖師只知開口易不覺舌頭長當時若問育王但曰若要向汝道直待虗空落地自然出他一頭何故車不橫推理無曲斷上堂達磨正宗衲僧巴鼻充塞虗空無處回避堪笑迷流白日青天開却眼只管瞌睡更有黃面老人不識好惡入泥入水却道我於燃燈佛所無一法可得而為我授記何異好肉剜瘡空花求蒂畢竟如何悉唎悉唎既順世塔於寺之西菴徑山琰禪師法嗣師嗣育王光會元無出今收入補燈臨安府淨慈偃溪廣聞禪師福州侯官林氏子初參浙翁針芥難投復遍參諸方及再參浙翁于徑山翁笑迎曰汝來耶一夕坐簷間聞更三轉入室曳履而蹶如夢忽醒翌朝造室翁舉趙州洗鉢盂話師將啓口翁遽止之平生疑礙氷釋紹定戊子出世小淨慈歷住香山萬壽雪竇育王淨慈靈隱徑山上堂舉趙州示衆曰老僧三十年前在南方火爐頭有個無賓主話直至如今無人舉著師拈曰森羅萬象明暗色空日夜舉揚趙州古佛不是不知只為貪程太速上堂雲門放洞山三頓棒嚼飯餧嬰兒黃檗打臨濟三頓棒按牛頭喫草只今不犯絲毫有個方便良久曰大事為汝不得小事自家擔當上堂十字街頭石幢子無你遮護處一聲江上侍郎來無你回避處衲僧家朝出暮入腳前腳後也須仔細忽然築著磕著淨慈拄杖別有分付上堂繞禪牀一匝擊香案一下轉藏已竟講經已竟若具看經眼目方知落處其或未然依經解義三世佛冤離經一字還同魔説上堂趙州喫茶去金牛喫飯來龍門多上客有人續得末後句許你入阿字法門景定四年六月十四日示寂壽七十五夏五十八臨安府靈隱大川普濟禪師明州奉化人題世尊出山相曰龍章鳳質出王宮肘露衣穿下雪峰智願必空諸有界不知諸有幾時空師纂修五燈會元二十卷行世臨安府徑山淮海原肇禪師楊之通州潘氏子參浙翁翁問何處人師曰淮人曰泗州大聖為什麼在楊州出現師曰今日又在杭州撞著曰且得沒交涉師曰自遠趨風翁以師警敏欲大激發未容其參堂才見便曰下一轉語來師擬開口翁即喝師以頌呈末句有曰空教回首望長安翁曰者裏是什麼所在師曰謝和尚挂搭始就入室之列已而命掌記翁既寂師出世通之光孝後歷主雙塔清涼萬壽萬年江心以朝命遷杭之淨慈靈隱徑山其住徑山逋券山積僧殘屋老未幾樓閣矗霄雲衲踵至不減浙翁全盛時嘗頌達磨渡江曰踏翻地軸與天關合國人追不再還去去一身輕似葉長江千古浪如山六月初十日書偈而逝婺州雙林介石朋禪師因見郁山主畫像傍僧索讚師信手書曰拾得驪珠笑眼開為言塵盡轉生埃若無直下承當者孤負闍黎一撲來嘗頌明招謙一日天寒上堂曰風頭稍硬不是汝安身立命處曰稍硬風頭早已乖更將暖處自沉埋反令千古成蹤迹枉喫羅山白米來東山源禪師頌蜆子和尚曰紙錢堆裏可憐生臭口才開便葛藤蕩盡鬼家窮活計至今古廟絶人行又頌葉縣省為僧説柏樹子話曰簷頭滴滴分明歷歷碧眼黃頭二俱不識識不識普天匝地成狼藉辨山阡禪師頌李翱參藥山因緣曰貴耳而賤目背手抽金鏃仰面看青天箭過新羅國育王瑞禪師法嗣師嗣育王光會元無出今收入補燈慶元府瑞巖無量崇壽禪師因僧問世尊覩明星悟道此意如何師答以偈曰明星一見眼皮穿漢語胡言萬萬千暴富乞兒休説夢誰家竈裏火無煙乾元頴禪師法嗣鼓山檜堂祖鑒禪師懷安徐氏子禮建康鐘山真禪師剃度往依瞎堂遠禪師服勤五載及歸閩參乾元頴禪師始得大事了畢出世滁之琅琊無何徙真之北山復主資福泉守程公延致承天遷光孝慶元己未帥府葉公請住鼓山凡七載開禧乙丑謝事明年五月示疾革侍者請偈師説偈曰平生患語多臨終更何説盡力舉似人紅爐一片雪遂寂塔於山之西師諱祖鑒續傳燈誤作宗鑒天童傑禪師法嗣夔州臥龍山破菴祖先禪師廣安州王氏子初參密菴聞上堂語有省後菴住靈隱命師分座有道者請益曰胡孫子捉不住時如何師曰用捉他作什麼如風吹水自然成紋住後上堂不是心不是佛不是物忍俊不禁為諸人作個撇脫拈拄杖卓一下曰流水暗消溪畔石勸人除却是非難臨安府靈隱松源崇嶽禪師處州龍泉吳氏子早歲慕出世法見大慧於徑山慧升座稱應菴為人徑捷師聞之不待旦而行既至朝夕咨請應菴舉世尊有密語迦葉不覆藏師曰鈍置和尚菴震威一喝師有省菴大喜以為法器隆興初師始得度入閩見木菴菴舉有句無句如藤倚樹師曰裂破菴曰琅琊道好一堆爛柴聻師曰矢上加尖如是應酬數反菴曰吾兄下語老僧不能過其如未在他日拂柄在手為人不得驗人不得師曰為人者使博地凡夫一超入聖域固難矣驗人者打向面前過不待開口已知渠骨髓何難之有菴舉手曰明明向汝道開口不在舌頭上後當自知逾年見密菴於西山隨問即答菴微笑而已師切於究竟至忘寢食會密菴入室次問僧不是心不是佛不是物話師侍側豁然大悟乃曰今日方會木菴道開口不在舌頭上自此機辨縱橫旋出世於平江澄照徙光孝冶父薦福香山虎丘慶元三年被旨補靈隱上堂大凡扶竪宗乘須具頂門正眼懸肘後靈符只如寶壽開堂三聖推出一僧寶壽便打三聖道與麼為人瞎却鎮州一城人眼去在寶壽擲下拄杖便歸方丈二尊宿等間一挨一拶便乃發明臨濟心髓只是不知性命總在者僧手裏還有檢點得出者麼昔年覓火和煙得今日擔泉帶月歸示衆古者道拈起也天回地轉放下也草偃風行冶父則不然拈起也乾坤黯黑放下也瓦礫生光忽有一個半個驀然𭣟瞎頂門達磨一宗未至寂寥在示衆舉臨濟如蒿枝拂相似公案雪竇曰臨濟放處太危收來太速師拈拄杖曰臨濟據令而行不知孤負黃檗雪竇盡力擔荷也只見得一邊且道薦福節文在什麼處擲下拄杖示衆舉汾陽曰識得拄杖子行腳事畢師曰汾陽雖是開口見膽未免落在第二頭驀拈拄杖曰者個不得喚作拄杖子漆桶參室中垂語曰是風動是幡動僧擬議師便打出又曰不是風動不是幡動僧擬議師亦打出又曰有力量人因甚擡腳不起又曰開口不在舌頭上又曰明眼衲僧因什打失鼻孔有賊無贓僧問如何是一同一質師曰裂破曰如何是二同大事師曰一毛頭上定乾坤曰如何是三總同參師曰蝦蟆蚯蚓跛鱉盲龜曰如何是四同真智師曰一不成二不是曰如何是五同遍普師曰大地撮來無寸土曰如何是六同具足師曰猶欠一著曰如何是七同得失師曰入泥入水曰如何是八同生殺師曰自救不了曰如何是九同音吼師曰八角磨盤空裏走曰如何是十同得入師曰寒山逢拾得曰與什麼人同得入師曰胡張三黑李四曰與誰同音吼師曰狸奴白牯曰作麼生同生殺師曰德山棒臨濟喝曰什麼物同得失師曰草裏輥曰阿那個同具足師曰信手拈來著著親曰是什麼同遍普師曰針鋒影裏騎大鵬等間挨落天邊月曰何人同真智師曰黑山鬼窟曰孰與總同參師曰燈籠入露柱曰那個同大事師曰嘉州大象陝府鐵牛曰何物同一質師曰碗脫丘師退居東菴俄屬微疾因書偈曰來無所來去無所去瞥轉玄關佛祖罔措跏趺而寂塔全身於北高峰之原慶元府天童枯禪自鏡禪師長溪高氏子受業泉州法石後遍參諸方得旨於密菴出世寧德鳳山嘉定癸未移鼓山鑄洪鐘有挂鐘偈曰一模脫就轉風流平地教他不肻休要得洪音喧宇宙直須更上一層樓頌鵝湖因唐憲宗詔問如何是佛性曰因地而倒因地起離地求起無是理不離所問語雖親認著依前還不是紹定己丑移真州北山後移天童甫至而寂建塔天童饒州薦福曹原生禪師南劒人嘗詠靈雲石曰雲去復來非有意雲來復去亦無心有無截斷靈何在突兀一峰青到今頌長沙與仰山玩月曰浮雲散盡月當空兔子懷胎産大蟲跳出風前弄牙爪至今撼動廣寒宮頌僧問古德生死以何為舟航曰年盡不燒錢鼠穴被蛇穿直饒玄會得對面隔西天太平府隱靜萬菴致柔禪師潮州陳氏子上堂舉天衣懷禪師雁過長空影沉寒水話頌曰長空孤雁一聲秋獻寶波斯鼻似鈎風捲白雲歸別嶂黃昏月挂柳絲頭又頌倩女離魂曰憶昔春風上苑行爛窺紅紫厭平生如今再到曾行處寂寂無人草自生頌南泉與歸宗麻谷同去參禮南陽國師曰金針繡出玉鴛鴦石女擎來不覆藏剛被木人偷眼至今兩兩不成雙臨安府淨慈潛菴慧光禪師有化鹽偈曰合水和泥一處烹水乾泥盡雪花生乘時索起捺天價公驗分明孰敢爭頌楞嚴經佛謂阿難見見之時見非是見曰雨洗淡紅桃蕚嫩風搖殘碧柳絲輕白雲影裏怪石露緑水光中古木清侍郎張鎡居士號約齋字功甫忠烈王諸孫官直祕閣學士造密菴籌室蒙菴垂示因舉狗子話忽聞鐘聲悟入偈曰鐘一撞耳根塞赤肉團邊去個賊有人問我解何宗舜若多神面門黑以書告其悟由菴肯之尋掃軌休間徜徉南湖之小園或幅巾曳杖嘯歌往來淡然忘歸嘗曰昔賢有云不為俗情所染方能説法度人蓋光明藏中孰非遊戲若心常清淨離諸取著於有差別境中能常入無差別定則淫房酒肆遍歷道場鼓樂音聲皆談般若倘知因物隔境逐情移如鳥粘黐動傷軀命又烏知所謂説法度人者哉後捨宅建慧雲寺請密菴開山天童觀禪師法嗣師嗣淨慈一會元無出今收入補燈平江府虎丘堂善濟禪師讚魚籃觀音像曰雲鬢濃粧苦強顏為他間事入塵寰擕來活底無人買祇作尋常死貨看天童頴禪師法嗣師嗣焦山體會元無出今收入補燈臨安府靈隱荊叟如珏禪師婺州人初參癡鈍於鍾山嘗呈偈曰鍾山白刃赤身挨幾度曾經被活埋一自人亡家破後了知無位可安排鈍肯之住後上堂新歲擊新鼓普施新法雨萬物盡從新一一就規矩普賢大士欣歡乘時打開門戶放出白象王遍地無尋處拈拄杖曰惟有者個不屬故新等間開口吞却法身擲下曰是什麼千年桃核裏元是舊時仁端平春自育王升徑山小參我此一宗正令全提如暴風卒雨鼓蕩無前石火電光追奔不及舉意即迷源擡頭已蹉過不是目前法莫生種種心縱汝三種互修尅期取證第一頭第三首萬拄千撑轉見氣急殊不知髑髏未具己眼先明呱地一聲千了百當然雖如是親證者萬中無一二錯會者數有恆河沙僧問如何是佛師曰爛冬瓜復成頌曰如何是佛爛冬瓜咬著冰霜透齒牙根蒂雖然無窖子一年一度一開花佛成道日頌曰六年雪嶺方成道打失從前鬼眼睛滿面慚惶無著處至今生怕是明星萬壽觀禪師法嗣師嗣大洪證會元無出今收入補燈杭州黃龍無門慧開禪師杭州梁氏子參月林看無字話六年無省乃奮志尅責誓曰若去睡眠爛却我身一日在法座邊立忽聞齋鼓聲有省偈曰青天白日一聲雷大地羣生眼豁開萬象森羅齊叩首須彌𨁝跳舞三臺次日入室欲通所得林遽曰何處見神見鬼了也師便喝林亦喝師又喝自此機語吻合淳祐六年奉旨開山護國仁王寺上堂是非長短耳邊風切莫於中覓異同要得八風吹不動放教心地等虗空慈雲老人只解順水張帆不能逆風把柁黃龍又且不然是非都去了是非裏薦取何故聻幾度黑風翻大浪未曾聞道釣舟傾屬歲大旱宋理宗召師祈雨還而默坐帝遣內侍問之師曰寂然不動感而遂通既而大雨賜號佛眼禪師潭州石霜竹巖妙印禪師對月看經偈曰未動舌頭文彩露五千餘卷一時周若言待月重開卷敢保驢年未徹頭南嶽下十九世雪峰珍禪師法嗣杭州徑山元叟行端禪師台之臨海何氏子初參藏叟於徑山叟問你是什處人師曰台州叟便喝師展坐具叟又喝師收坐具叟曰放汝三十棒參堂去師於言下豁然頓悟一日侍次叟曰我泉南無僧師曰和尚聻叟便棒師接住曰莫道無僧好叟頷之即延入侍司及叟告寂即至淨慈依石林鞏禪師林處以記室復參雪巖巖問何處來師曰兩浙巖曰因甚語音不同師曰合取臭口巖曰獺徑橋高集雲峰峻未識書記在師拍手曰鴨吞螺螄眼睛突出巖笑顧謂侍者曰點好茶來師曰也不消得遂送師居蒙堂大德四年庚子出世湖之資福學徒奔輳名聞京國特旨賜慧文正辨禪師次主中天竺皇慶壬子遷靈隱有旨設水陸大會於金山命師升座説法加賜佛日普照至治壬戌補徑山泰定甲子上為降璽書作大護持仍賜金襴袈裟師至是三被金襴之賜僧問三聖和尚道我逢人則出出則不為人興化和尚道我逢人則不出出則便為人意旨如何師曰雞銜燈盞走鱉咬釣魚竿僧曰為人不為人則且止如何是逢人出底句師曰知僧曰逢人出不出則且止如何是為人底句師曰切問如何是正法眼藏師曰十字街頭石敢當曰莫只者便是麼師曰月似彎弓少雨多風僧參師問曰何方聖者甚處靈祇曰臨朕砧師曰杜撰禪和如麻似粟參堂去又勘一僧曰棋盤石斫破你腦門鉢盂池浸爛你腳板僧擬答師便喝又勘一僧曰劈開華嶽連天秀放出黃河徹底清即且置平實地上道將一句來僧擬開口師便打上堂即心即佛蜜果換苦葫蘆非心非佛寶器貯於不淨不是心不是佛不是物鄭州出曹門且喜沒交涉拈拄杖曰拄杖子鑽過北鬱單越走向西瞿耶尼今向翔鳳山中興雲吐霧去也卓一卓曰大洋海底火發燒却嘉州大像頷下眉毛復卓一卓下座上堂三世諸佛拈向一邊六代祖師置之一壁十二時中且要識得自家主人翁隨處作主立處皆真五欲八風搖撼不動四生九有籠不住方有少分相應我且問你著衣喫飯屙屎送溺行住坐臥見聞覺知且阿那個是你主人翁有般漢便向第八識裏妄生卜度便道呼之有聲不見其形只今言談抵對歷歷孤明豈不是我自家主人翁錯了也此是無量劫來生死根本無始劫來業識癡團便得你七顛八倒役得你萬苦千辛豈可認以為實降此之外畢竟阿那個是你主人翁復高聲喚曰主人翁惺惺著上堂古戌朝鳴角空山夜答鐘時人皆共聽何處不圓通元宵上堂并謝監收浴主維那千粒萬粒從一粒生只者一粒從甚麼處生千燈萬燈從一燈起只者一燈從甚麼處起識得一燈千燈萬燈燈燈不疑識得一粒千粒萬粒粒粒無礙三腳驢子弄蹄行踏破無邊香水海拈拄杖卓一卓曰頂門上也少者一槌不得至正辛巳八月四日書偈訣衆曰本無生滅焉有去來冰河發焰鐵樹花開投筆垂一足而化奉全身窆於寂照塔院淨慈頴禪師法嗣溫州江心一山了萬禪師撫州臨川金氏子年十五業程文有聲然出家素志莫能奪去從金溪常樂院祝髮東叟領南屏擇師掌記師偶經神祠見紙灰隨風旋起脫然忘所證亟以白叟叟詰之終無疑滯遂蒙印可後遊天台衆請開法寒巖遷紫籜疏山開先升住江心少不適意輒棄去會廬山月澗明禪師遣舟迎歸東溪及明沒開先之衆復請乃回開先皇慶元年冬遘疾書訣坐逝明州嶽林栯堂益禪師溫州人上堂古者道我者裏無法與人只是據欵結案彰聖者裏亦無法與人亦不據欵結案拈拄杖曰如何是佛赤腳踏蓮花如何是佛向上事雕梁畫棟擲下拄杖便歸方丈二月十五日上堂擊拂一下曰彰聖今日將三十年前冷灰中𪹼出黑豆換老胡眼睛去也喝一喝曰設有一法過於涅槃我此一喝不作一喝用育王觀禪師法嗣洪州仰山晦機元熙禪師南昌唐氏子與兄元齡俱習進士業元齡既登第師遂祝髮聞物初闡化玉几往依之初與語大驚異之留侍左右朝夕咨叩盡發其祕後謁東叟穎公於南屏穎命掌記元貞二年出世百丈遷淨慈上堂雲門道個普字盡大地人不奈何殊不知雲門四稜塌地當時若與震威一喝待此老惡發徐徐打個問訊道莫怪觸忤好非徒救取此老亦能振起雲門綱宗雖然口是禍門上堂三界無法何處求心白雲為蓋流泉作琴古今無間誰是知音擊拂子曰一曲兩曲無人會雨過夜塘秋水深上堂獨坐大雄峰寒灰撥不紅一星熒火出孤鶴過遼東遷徑山閲三月師杖策歸南山之下復起之不往也江西學者聞師退間咸傾誠法味以致百丈大仰之徒爭來請師師辭不獲已遂還仰山居三年將示寂作偈示衆擲筆化去大仰山之下有金雞石者應馬大師懸讖故葬焉淨慈聞禪師法嗣杭州徑山雲峰妙高禪師福寧州人受具後往參癡絶次見無準皆器之及參偃溪一日溪舉譬如牛過窗櫺頭角四蹄都過了因甚尾巴過不得師劃然有省乃曰鯨吞海水盡露出珊瑚枝溪曰也只道得一半後出世大蘆遷勸忠何山復奉朝命住蔣山至元庚辰遷徑山上堂世界未形乾坤泰定生佛未具覿體全真無端鏡容大士鷹巢躍出𠢐破面皮早是遭人描邈那更缺齒老胡不依本分遙望東震旦有大乘根器迢迢十萬里來意在攙行奪市直得鳳堂鼓響阿閣鐘鳴轉喉觸諱插腳無門合國難追重遭訐露斯徑山道不得已跨他船舷入他界分新官不理舊事畢竟如何拍禪牀曰戍樓靜貯千峰月塞草間鋪萬里秋上堂五峰峭峙到者須是其人一鏡當空無物不蒙其照祖師基業依然猶在衲僧活計何曾變遷著手不得處正要提撕措足無門時方可履踐直待山雲淡濘澗水潺湲一曲無私萬樂業正恁麼時功歸何所車書自古同文軌四海如今共一家示衆言前辨旨句下明宗東計山熾然説法湛瀆水轉為流通者裏搆得未免相鈍置若尚存觀聽擾擾匇匇晨雞暮鐘時有讚毀禪宗者師嘆曰此宗門大事吾當忍死爭之遂趨京有旨集諸宗徒廷辨上問禪以何為宗師奏曰淨智妙圓體自空寂非見聞覺知思慮分別所能到上宣問再三師歷舉西天東土諸祖以至德山臨濟棒喝因緣大抵言禪是正法眼藏涅槃妙心趨最上乘孰有過於禪詞旨明顯餘二千言又宣進榻前同百法論師仙林賜坐使各持論林曰始從鹿野苑終至跋提河於是二中間未嘗説一字五千餘卷自何而來師曰一代時教如標月指了知所標畢竟非月林曰如何是禪師以手打一圓相林曰何得動手動腳師曰只者一圈尚透不得説甚千經萬論林無語上大悅賜食陛辭南歸示寂塔於寺之西麓明州天童止泓鑒禪師頌大陽無相道場話曰真空無相絶名模立底精兮畫底麁道即不難辭上紙西天鬍子絶髭鬚雙林朋禪師法嗣杭州靈隱悅堂祖誾禪師南康周氏子一日閲華嚴至惟一堅密身一切塵中現忽有省往見別山山問近離什處師曰江西山曰馬大師安樂否師叉手曰起居和尚參斷橋問臨濟三遭黃檗痛棒是否師曰是曰因甚大愚肋下築三拳師曰得人一牛還人一馬橋頷之橋逝而介石補其處一日室中舉柏樹子話師擬議石抗聲曰何不道黃鶴樓前鸚鵡洲師於言下頓悟久之歸廬山出世西林大德九年住靈隱嘗勘一僧曰微塵諸佛在汝舌上三藏聖教在汝腳底何不瞥地僧罔措師便喝又勘一僧曰釋迦彌勒是他奴他是阿誰僧擬對師便打一僧新到師問何處來曰閩中師曰彼處佛法如何住持曰飢則吃飯困則打眠師曰錯曰未審和尚此間如何住持師拂袖歸方丈居四歲訣衆偈曰緣會而來緣散而去撞倒須彌虗空獨露遂逝靈隱濟禪師法嗣慶元府雪竇野翁炳同禪師新昌張氏子首從癡絶於天童次造大川之室川舉臘月火燒山話師擬對川拈竹篦遽拄之有省隱迹仗錫閉戶書法華經有老來非厭客靜裏欲書經之句時雪竇虗席衆堅請師往赴至壬寅八月十五日升座語衆勸勵極切蓋示別也衆請留偈笑而不應至夕而逝薦福璨禪師法嗣福寧州支提山愚叟澄鑑禪師本州寧德張氏子依政和龍山剃落參無文璨禪師遂入其室初住白雲至元二十年世祖敕賜住持支提賜號通悟明印大師後示寂書偈曰八十二年落賺世緣躍翻筋斗應迹西乾沐浴更衣趺坐而逝臥龍先禪師法嗣臨安府徑山無準師範禪師劒州梓潼雍氏子九歲出家請益老宿坐禪之法宿曰禪是何物坐底是誰師晝夜體究一日如廁提前話有省謁育王佛照照問何處人師曰劒州照曰帶得劒來麼師隨聲便喝照笑曰者烏頭子也亂做至靈隱時破菴為第一座同遊石筍菴有道者請益胡孫子話師於侍傍大悟初住明州清涼遷焦山雪竇育王後受詔主徑山上堂靈山指月曹溪話月代相傳證龜成鱉範上座尋常有一張口挂在壁上未曾動著今日無端入者行戶事到如今只得東簸西簸未免拈起多年曆日於中點出些子誤賺處説似諸人且要郭大李二鄧四張三知得江南兩浙春寒秋熱雖然如是黃河三千年一度清上堂若是個事直是省要易會多是諸人自作艱難自作障礙所以有時東廊西廊見諸人問訊和南山僧便乃低頭相接其實無他只要諸人識得長老是西川隆慶府人氏若識得去便與諸人打些鄉談説些鄉話如今且未説你識得長老且各自知得自家鄉貫也得還知麼明州六縣奉化八鄉上堂名不得狀不得取不得捨不得只恁麼得且道得個什麼三人證龜成鱉理宗召入修政殿奏對詳明賜金襴僧伽衣又宣詔慈明升座説法帝垂簾而聽賜號佛鑑淳祐己酉三月旦日疾作遂升座謂衆曰山僧既老且病無力與諸人東語西話今勉強出來將從前説不到底盡情向諸人抖搜去也遂起身抖衣曰是多少便歸方丈十五日集衆遺囑至十八日黎明書偈曰來時空索索去也赤條條更要問端的天台有石橋移頃而逝塔全身於圓照菴臨安府靈隱石田法薰禪師眉山彭氏子初遊石霜禮雷遷塗述偈曰一念慈容元不隔何須特地肆乖張平高就下婆心切惱得雷公一夜忙師名因是大著聞穹窿破菴道望遂往依焉菴室中舉世尊拈花迦葉微笑師曰焦磚打著連底凍赤眼撞著火柴頭菴陰奇之初住蘇之高峰遷楓橋鍾山淨慈靈隱示衆但得本莫愁末喚什麼作本喚什麼作末松柏千年青不入時人意牡丹一日紅滿城公子醉山僧恁麼道若有不肯的是我同參弟子師俊繪師像求讚有曰末後一句分付厨山衆頗訝之明日忽示疾退歸寶壽趣辦終焉計辦畢即趨寂窆全身於院之後山南康府雲居即菴慈覺禪師蜀人舉僧問葉縣如何是學人密用心處縣曰閙市輥毬子曰意旨如何縣曰普請衆人看師頌曰輥毬閙市衆人看一陳清風吹面寒定亂不須雙刃劒活人何必九還丹師始登雲居時先一夕宿瑤田莊夢伽藍安樂公謂曰汝與此山祇有一粥緣明日午後至寺晚參罷會同袍二僧鬬狠聞於寺司凡新到例遭斥逐師深切疑訝後數年蜀士有宦達於朝者與師親故以雲居虗席請師補其處師欣然承命將復徵往夢竟至瑤田莊而寂靈隱嶽禪師法嗣慶元府天童滅翁文禮禪師杭之臨安阮氏子家天目山之麓師生六歲携籃隨母採桑俄而寤念携籃者誰耶遂懷出家志十六得度參混源源舉現成公案放汝三十棒話不契謁佛照照問恁麼來者那個是你主人翁師豁然領旨他日照問是風動是幡動者僧如何師曰物見主眼卓竪又問不是風動不是幡動甚處見祖師師曰揭却腦蓋照喜其俊邁俾掌書記久之聞松源唱道饒之薦福室中問僧不是風動不是幡動僧擬議即棒出師聞之頓忘知解往參蒙印可嘉定五年開法臨安之慧雲遷能仁淨慈室中每舉南山筀笋東海烏鰂話學者擬議師輒督牙三下莫有湊泊之者厥後遷居福泉升住天童開堂日僧問和尚見佛照時如何師曰石中有玉曰見松源後如何師曰沙裏無油問觀方知彼去去者不至方意旨如何師曰前不遘村後不迭店有來上座者直入方丈曰某甲有狀告投和尚師曰對頭在那裏曰和尚便是師曰老僧與你有什冤讐來無語師捉住曰冤家冤家虎維那參師問汝名什麼曰智虎師退身作怕勢虎擬議師便歸方丈上堂衆生本不曾迷夜闌雞向五更啼諸佛本不曾悟清秋鴈度長空去拍膝一下曰西窗昨夜月華明涼飈已到梧桐樹上堂法不孤起仗境方生境既不存法從何立龍湫瀉千尺瀑且不是境雁峰聳萬丈高寒且不是法明眼衲僧到者裏合作麼生直饒倜儻分明山僧棒折也未放在何故殺人刀活人劒上堂事事無礙青山掩映斜陽外法法無差櫩前古木閙羣鴉君不見太原孚上座走天涯楊州五更聞畫角吹斷落梅花直至如今未到家聖節上堂坐琉璃殿垂夜明簾混然一體以難該冥應衆緣而無忒從上以來推尊此位且全身奉重一句如何舉唱妙叶羣機齊入貢從教諸道自分權宏智禪師忌日上堂夜明簾外寶鑑臺前元無兼帶豈有偏圓正恁麼時畢竟誰居正位古渡無人霜月冷蘆花風靜鷺鷥眠上堂萬松關逈九隴煙橫谷風傳響澗水流聲若以眼觀耳聽舌犁耕不以眼觀耳聽舌犁耕且利害在什麼處若不同牀睡焉知被底穿師退院逍遙於梁渚之上羣衲聚叩與住院無異將入寂謂侍者曰誰與我造無縫塔侍者曰請師塔樣師曰盡力畫不出怡然脫去常州華藏無得覺通禪師青苗會上堂破一微塵出大經鳶飛魚躍更分明不將眼看將心看已是重敲火裏冰淹黑豆昧平生直到却外話豐登繅成白雪桑重緑割盡黃雲稻正青慶元府雪竇大歇仲謙禪師金華義烏應氏子幼見傅大士心王銘乃誓出家始見息菴菴器之而抑其鋭曰汝儒家習氣不除何能到大休大歇田地宜如土木人去師朝暮研究有省因以大歇自名既見松源一日聞舉祕魔擎杈話俄失聲曰爭奈有人不甘源提竹篦曰打你不甘師擬進語而篦輒至茫未有措源震聲喝師即豁然安吉州道場山運菴普巖禪師讚趙州曰無端提起七斤衫多少禪人著意參盡向青州做窠窟不知春色在江南鎮江府金山掩室善開禪師頌僧問雲門法身曰六不收一不立清淨法身何處覓夜來一陳吹葉風掃盡浮雲月照壁又頌淨慈肯堂示衆觀方知彼去曰孰謂觀方不在方才開臭口便乖張行人要覓長安路不覺全身在帝鄉溫州鳳翔石巖希璉禪師潮陽馬氏子僧問昔日佛照光禪師因孝宗皇帝宣問釋迦入山六年所成何事照曰將謂陛下忘却意旨如何師答以頌曰大根大器大熏修瞥轉機輪向上頭萬億斯年惟一佛雪山元不隔龍樓台州瑞巖少室光睦禪師贊四祖曰破頭峰頂紫雲飛三却天書老翠微滯貨雖然無用處不應分付小孩兒頌靈雲見桃花曰一見桃花便垛跟鐵圍生陷出無門倚墻傍壁知多少一度春風一斷魂北海心禪師嘗頌唐太宗蛤蜊因緣曰合水和泥底事忙被渠點破太乖張雖然默契君王意已是全身入鑊湯頌雪峰拓開門放身是什麼曰同條生兮不同死弟既耳聾兄目瞽家門蕩盡徹骨窮却把黃金如糞士末後句休莾鹵甜者甜兮苦者苦諾菴肇禪師嘗頌南泉鐫佛因緣曰兩手持來難蓋覆依前兩手還分付一枕清風眠正濃鳥銜花落巖前路又頌松源示衆明眼衲僧因甚打失鼻孔曰殺人一萬損三千獨弄單提機不全萬頃滄波明月夜一聲短笛釣魚船臨安府淨慈谷源道禪師嘗頌石頭剗草話曰石頭剗草驗英豪懵懂丹霞眼不高若解轉身行活路至今應不纍兒曹天童鏡禪師法嗣福州鼓山愚谷元智禪師長溪薛氏子年十八受業於本縣湛然本禪師時枯禪主鳳山師往從之叩請甚勤禪已奇之出嶺謁浙翁琰於雙徑次參少林嵩於北山留掌記有聲少林移徑山枯禪嗣其席師喜曰青鳳山前事未竟今竟矣禪至仍掌記俄而機契遂蒙印可嘉熙己亥出住平江薦福遷洞庭翠峰宜興芙蓉退居靈隱後起住泉之法石未幾遷福州怡山舉其廢癸亥秋移鼓山甫一夏以病告退老東菴咸淳丙寅正月十七日趺坐書偈而化壽七十一臘五十八塔全身於鼓山南院杭州淨慈清溪沅禪師上堂達磨西來一坐具地被他神光禮了三拜一時占却致令後代兒孫各自分疆列界衲僧家撥草瞻風朝吳暮越南天台北五臺拄杖頭草鞋底還曾踏著也未良久曰切忌踏著薦福生禪師法嗣臨安府徑山癡絶道沖禪師武信荀氏子資性絶人長應進士不第受業於梓州妙音院紹熙三年出峽時曹源出世妙果師往謁聽其人門語有省俾侍左右三年以偈辭遊浙有尚餘一雙窮相手要向諸方癢處爬之句參松源於靈隱源門庭峻絶笠棲八月不獲入室或以失士告源曰我已八字打開挂搭渠自是渠當面蹉過耳師聞其語口耳俱喪徹見曹源於妙果龜峰時嘻笑怒罵皆為人善巧方便自是不疑天下老和尚舌頭初住嘉興天寧移雪峰方半載詔移天童育王虗席兼攝住持上堂天童用底來育王用不著育王用底來天童用不著雖然如是用不著不著處用有餘一箭雙雕隨手落上堂圓覺伽藍塵塵有路坐斷去來頓空今古那裏十三者邊十五後先不差毫髮可笑黃面瞿曇至今不知落處上堂有一人一念頓證墮在佛數有一人纍劫闡提不願成佛且道那個合受人天供養良久曰蝶穿芳徑雙眉濕蜂掠殘花兩股肥上堂僧問心佛及衆生是三無差別如何是過去心師曰放待冷來看曰如何是現在心師曰你問我答曰如何是未來心師曰後次上堂向汝道曰如何是過去佛師曰去年梅曰如何是現在佛師曰今歲柳曰如何是未來佛師曰顏色馨香依舊曰如何是過去差別智師以拂子擊禪牀左邊曰如何是現在差別智師以拂子擊禪牀右邊曰如何是未來差別智師以拂子中間點一點僧曰心佛衆生無向背十方剎海一毫收便禮拜師乃曰過去心不可得現在心不可得未來心不可得三心既不可得喚什麼作差別智若人見得徹去三世諸佛無一時不在諸人頂𩕳上轉大法輪更來者裏挨肩並足討什麼碗以拄杖一時趕散未幾被旨遷徑山將示寂謂衆曰無準忌在三月十八吾以十五日行不能辦香修供矣至十四日上堂辭衆舉世尊臨入涅槃告衆曰汝等善觀吾紫磨金色之身膽仰取足毋令後悔今日即有明日即無師曰世尊平生用盡伎倆臨死之際求生不得生求死不得死山僧則不然要行便行要去便去八臂那吒攔不住下座至夜分起坐移頃而逝壽八十二﨟六十一茶毗舍利五色者無數靈骨分一半建塔金陵王山菴一半建塔菖蒲田玉芝菴隱靜柔禪師法嗣雙杉元禪師嘗頌太宗勸發菩提心話曰萬里謳歌聖化成條風塊雨樂樵耕不因嵩嶽三呼後無象誰知真太平又頌應菴問密菴正法眼話曰五陵公子少年時得意春風躍馬蹄不惜黃金為彈子海棠花下打黃鸝華藏淨禪師法嗣慶元府天童西江謀禪師江南老宿不被黃敕者四十年末路受理宗寵命三錫示衆春日晴黃鸝鳴最親切誰解聽一日將入寂顧侍僧索筆書偈曰一笑翻身日面月面閣筆而逝立塔天童靈隱珏禪師法嗣杭州中天竺空巖有禪師室中垂語曰黃金鑄就鐵真人東海湧頌曰錦衣公子醉田家熟睡柴牀日未斜熱渴呼漿無所得便將玉帶換甌茶黃龍開禪師法嗣杭州護國臭菴宗禪師上堂舉嶽林振禪師示衆曰布袋口開還有買的麼僧曰有林曰不作貴不作賤作麼生買僧無語林曰老僧失利師曰嶽林説個問端也甚奇特及至被人道個有字直得東遮西掩囊藏不迭護國今日布袋口開還有買的麼良久曰欄干雖共倚山色不同觀溫州瞎驢無見禪師嘗頌興化打克賓曰興化打克賓言親語不親棒頭如雨點敲出玉麒麟放牛余居士古杭人淳祐間參無門凡問被門劈面截住曰不是不是及見臭菴問曰吾師甚麼見解敢對人天顛倒是非菴曰我在無門座下無法可得無道可傳只得兩個字士曰兩字如何説菴曰不是不是士言下始知無門為人處嘗述是非關其言曰直指人心見性成佛回光返照逈絶遮攔才擬思量白雲萬里逢人品藻遇物雌黃重古輕今貴耳賤目任伊卜度沉吟未夢見是非關在安吉州沈道婆問是非關有幾句士曰有四句婆曰四句作麼舉士曰第一句有是有非則不可第二句無是無非又不可第三句是是非非也不可第四句非是是非亦不可若離得此四句始見本地風光曰我離得否士曰汝離不得曰人人有分我何離不得士曰嫁雞逐雞飛嫁狗逐狗走曰如何是本地風光士曰月子彎彎照幾州幾人歡喜幾人愁曰不問言個風光士曰問那個本地風光曰無男女相底士曰既無男女相問甚是非關曰別有向上事也無士曰有曰如何是向上事士曰馬蝗釘住鷺鷥腳你上天時我上天孤峰秀禪師法嗣福州鼓山皖山正凝禪師舒州太湖李氏子受業於黃州雙泉嘉熙初入閩謁孤峰秀禪師於莆之囊山執侍五載盡得其奧旨知藏鼓山分座雪峰寶祐間出世本州釣龍臺遷萬歲己巳十月移鼓山嘗頌世尊臨入滅以手摩胸話曰潦倒瞿曇不識羞臨行猶自逞風流摩胸示衆歸何處啼鳥一聲山更幽又頌金峰枕子話曰天作孽猶可違自作孽不可逭又頌德山參龍潭曰潭不見龍不現全身已在空王殿夢回忽聽曉鶯啼春風吹落桃花片咸淳甲戌臘月八日示寂闍維數珠不壞獲舍利於齒中乃別建塔師入閩三十餘年道俗敬慕如覩生佛凡得嚫利悉作方便事更無儲蓄壽八十四臘四十五婺州雙林一衲介禪師嘗頌傅大士披衲頂冠因緣曰非儒非道亦非禪杜撰修行忒可憐擔閣一身三不了至今八百有餘年容菴海禪師法嗣師嗣竹林安安嗣竹林寶寶嗣懶牛和和嗣天目齊齊嗣五祖演自齊以下會元俱無出燕京慶壽中和璋禪師一夕夢異僧䇿杖徑趨方丈踞師子座天明謂知客曰今日但有旦過當令來見老僧及晚海雲至師笑曰此衲子乃夜來所夢者雲曰某不來而來作麼生相見師曰參須實參悟須實悟莫打野榸雲曰某甲因擊火迸散乃知眉橫鼻直師曰吾此處別雲曰如何表信師曰牙是一具骨耳是兩片皮雲曰將謂別有師曰錯雲喝曰草賊大敗師休去次日師舉臨濟兩堂首座齊下喝僧問還有賓主也無濟曰賓主歷然汝作麼生會雲曰打破秦時鏡磨尖上古錐龍飛霄漢外何勞更下槌師曰你只得其機不得其用雲便掀倒禪牀師曰路途之樂終未到家雲與一掌曰精靈千載野狐魅看破如今不直錢師打一拂子曰汝只得其用不得其體雲進前曰青山聳寒色月照一溪雲師曰汝只得其體不得其智雲曰流水自西東落花無向背師曰汝雖善語言三昧要且沒交涉雲竪起拳復拍一拍當時丈室震動師曰如是如是雲拂袖便出明日命掌記復以向上鉗錘勘驗應答皆契一日謂曰汝今已到大安樂地宜善護持吾有如來正法眼藏涅槃妙心密付於汝毋令湮沒雲掩耳而出即授以偈曰天地同根無異殊家山何處不逢渠吾今付汝空王印萬法光輝總一如
