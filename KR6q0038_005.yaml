body:
  text: 鼓山嗣祖沙門元贒輯臨濟宗南嶽下二十二世雙林誾禪師法嗣杭州徑山月江宗淨禪師金華蘭溪倪氏子髫齡從邑之正覺院文譯祝髮受具因誦楞嚴經至如標月指處豁然有省往參雙林正菴誾誾問黃檗打臨濟你作麼生會師曰按牛頭喫草誾奇之留領維那後出世歷遷至徑山臨寂書偈曰祖師門下客開口論無生老我百不會日午打三更遂逝茶毗舌根不壞建塔于圓照菴天界曇禪師法嗣南京靈谷定巖淨戒禪師參覺原原舉桶篐𪹼因緣問之師擬議未即答原厲聲曰早遲八刻了也師於言下大悟師續刻頌古聯珠行於叢林高峰妙禪師法嗣杭州天目中峰明本禪師杭之錢塘孫氏子母夢無門開禪師持燈籠至家遂生神儀挺秀具大人相離襁褓便趺坐能言便歌讚梵唄參高峯於死關晝夜精勤困則以頭觸柱一日誦金剛經至荷擔如來處恍然開解遂從高峰薙落時年二十有四也未幾觀流泉有省即詣峰求證峰打趂出既而民間訛傳官選童男女師問忽有人來問和尚討童男女時如何峰曰我但度竹篦子與他師言下洞然徹法源底于是高峰書真贊付師曰我相不思議佛祖莫能視獨許不肖兒得見半邊鼻有問峰諸弟子優劣峰曰如義首座固是一根老竹其如七曲八曲唯本維那却是一竿上林新篁他日成林未易量也師居無定所或船或菴榜以幻住僧俗爭相瞻禮皆手加額曰江南古佛延祐戊午仁宗皇帝聞而聘之不至製金襴袈裟賜之號曰佛慈圓炤廣慧禪師院曰正宗英宗皇帝亦封御香製衣即所居而脩敬焉先是駙馬太尉瀋王王璋常使人從師問法意以為未足請於上親往見之請師陞座為眾普說曰大道無為大功不宰大善無跡大位不居一切處海印發光千萬古金枝挺秀訪圓通大士於潮音洞裡買石得雲饒修如意輪期于明慶寺中移花兼蝶至香風奏四天之樂梵音轟大地之雷二千載已現國王五百劫常為世主一大藏教隨機運轉百千妙行任意發揮祝萬歲于九重保三韓於上國此是太尉瀋王海印居士尋常行履處只如今日偕行宣政院使平章相國王子從官高登天目下視人寰且佛法相應一句如何指陳匝天匝地祥雲起無古無今瑞氣騰小參大道在目前山是山水是水玄機超物表聖非聖凡非凡一念洞然萬緣廓爾水晶宮秋容淡淡森羅萬象吞吐明月珠松雪齋灝氣沉沉屏几六窓交徹寶絲網無一物不彰至化無一事不演真乘莊周雖蝶夢枕邊敢保其當機罔措子韶雖蛙聞月下未許其覿面施呈者一著子名不得狀不得即其知處已陷情圍事亦然理亦然與麼會時早沉識海所以道神光獨耀萬古徽猷入此門來莫存知解且不存知解底句如何指陳玉宇秋高無限界金園春事政敷腴示眾慧劒單提日用中天然元不犯磨礱神號鬼哭喪魂膽遍野橫尸不露鋒古人與麼說話已是自傷己命了也殊不知我王庫內無如是刀佛成道日示眾玄玄絕待妙妙無依獨露真常全彰至體名不得狀不得雪老氷枯理無礙事無礙天荒地迥萬里雲收午夜四方星燦長空揭開威音那畔腦門圓陀陀光爍爍擉瞎髑髏背後眼光淨躶躶赤條條勒回三萬劫風飛雷厲之神機突出五千軸海湧雲屯之𥧌語大眾釋迦老子來也即今在諸人眼睛裏仰見明星頂𩕳上成等正覺你諸人還覺眉毛動也無如其未委各請歸堂至治癸亥八月十四早書偈辭眾曰我有一句分付大眾更問如何無本可據置筆安坐而逝後七年天曆己巳春文宗皇帝賜諡智覺禪師塔曰法雲元統二年賜廣錄三十卷入藏號普應國師杭州天目正宗寺斷崖了義禪師湖之德清湯氏子年十七有禪者誦高峰上堂語曰欲窮千里目更上一層樓師曰此大善知識必能為人抽釘楔遂往見聞峰舉牛過窓櫺師疑甚他日過鉢盂塘見松上雪墜有省即呈頌曰不問南北與東西大地山河一片雪聲未絕峰痛棒不覺隕身崖下及出廼自誓七日取證遂端直堅竪忘廢𥨊食夜則攀樹露立達旦未至所期豁然大悟馳至死關呼曰老和尚今日瞞我不得也呈頌曰大地山河一片雪大陽一炤更無蹤自此不疑諸佛祖更無南北與西東峰上堂曰二十餘年布個漫天網子打鳳羅龍竟不曾遇著一個蝦蠏今日不期有個蟭螟蟲撞入網中固是不堪上眼三十年後向孤峰絕頂揚聲大呌且道呌個什麼大地山河一片雪師即奪拂子為眾舉揚呵勵同學辭不少巽復曰盡大地有一人發真歸元某甲皆知之有僧參峰次峰令見師師曰驀直去師從此剃落所至歸重泰定三年師狥眾請坐正宗寺一載示眾若要超凡入聖永脫塵勞直須去皮換骨絕後更甦如寒灰發焰枯木成榮豈可作容易想我在老和尚處多年每被大棒打痛徹骨髓不曾有一念遠離心直至今日纔觸著痛處不覺涕流豈似你等歡喜踴躍齩著些子苦味便乃掉頭弗顧殊不知苦味能除百病大凡工夫若到省力時如順水流舟只要梢公牢牢把舵纔有絲毫異念生管取喪身失命若到純一處不可起一念精進心不可起一念懈怠心不可起一念求悟心不可起一念得失心纔有念生即被一切邪魔入你心胕使爾顛狂胡說亂道永作魔家眷屬佛也難救你戒之戒之元統元年除日謂從者曰有一件事天來大你還委悉麼良久曰明日是年朝正月六日詣法雲塔西指空地曰更好立個無縫塔其晚與禪者談笑至夜分乃曰老僧明日天台去也者曰某甲隨師去師曰你走馬也趂我不及翌午跏趺而化壽七十二臘四十九初中峰示寂會塟齋次師笑謂眾曰後十二年更為老僧一會至是十二年矣賜佛慧圓明正覺普度大師弟子輩遂從師所指之處建塔焉杭州天目山大覺寺布衲祖雍禪師明州寧海人得旨於高峰躬執樵㸑貌甚黧瘠戇而少文甞和永明山居偈曰我要心灰即便灰何須更去覔良媒千差路口齊關斷萬別機頭盡截摧就樹縛茅成屋住拾荊編戶傍溪開是他嬾瓚無靈驗惹得天書三度來又曰尋常冷解自知非退步沉蹤住翠微掃蕩百年榮辱夢倒回多劫本根機蟻因覔穴沿堦走蝶為尋花遍圃飛須信先天并後地洞然物物有真歸初鶴沙瞿公霆為高峰建寺于蓮花峰下請名大覺峰命師攝管及峰沒乃任住持後遷中竺甞有念珠一串被鴉啣去次日復啣來還眾莫不異之一日無恙書偈辭眾安坐而逝處州白雲空中以假禪師得法高峰後棲白雲山四方禪侶聞風來赴履滿戶外至元丙子夏一日援筆書偈曰地水火風先佛記掘地深埋第一義一免檀那幾片柴二免人言無舍利趺坐而寂靈雲定禪師法嗣洪州般若絕學世誠禪師示眾兄弟家三年五年做工夫無個入處將從前話頭拋却不知行到中途而廢可惜前來許多心機有志之士看眾中柴乾水便僧堂溫煖發願三年不出門決定有個受用有等纔做工夫心地清淨但見境物現前便成四句將謂是大了當人口快舌便悞了一生三寸氣消將何保任佛子若欲出離參須實參悟須實悟徑山陵禪師法嗣金葉府雲黃山寶林桐江紹大禪師世居嚴之桐江姓吳氏幼入鳳山寺為沙彌及受具後首上雙徑謁虗谷得其單傳之旨久之辭去歷參名宿乃曰吾今而後知法之無異味也復歸徑山時東嶼海唱道淨慈請師主藏每夜敷席于地映佛前燈閱大藏至三過遂盡通其旨至順壬申出世嚴之烏龍後遷智者寶林至己亥八月七日集眾訣別眾請書偈師接筆擲地曰縱書到彌勒下生寧復離此耶遂翛然而化茶毗舍利如紺珠色齒牙數珠不壞杭州徑山竺遠正源禪師南康歐陽氏子年二十七始受具首謁虗谷谷以龍潭滅紙燭話問之師曰焦石可破層氷谷曰破後奚為師曰探索乃知谷曰所知者何事師擬對谷便打師悚然默喻後五主巨剎其住靈隱時厄于回祿而師所居獨存似有神相之者住徑山日賜號佛慧慈炤普應禪師至元十二年六月將寂預告日期書偈而化塔全身於徑山弟子剪爪髮分瘞諸處皆有舍利叢生其靈異願著如此道場信禪師法嗣嘉興府福源寺石屋清珙禪師蘇之常熟溫氏子依本州興教崇福寺出家二十祝髮具戒後首參高峰授以萬法歸一話服勤三年次住建陽西峰參及菴菴問何處來師曰天目菴曰有何指示師曰萬法歸一菴曰汝作麼生會師無語菴曰此是死句甚麼害熱病底教汝與麼師拜求指的菴曰有佛處不得住無佛處急走過意旨如何師答不契菴曰者個亦是死句師不覺汗下遂求依止後入室菴再理前話詰之師曰上馬見路菴呵曰在此六年猶作者個見解師發憤棄去途中忽舉首見楓亭豁然有省回語菴曰有佛處不得住也是死句無佛處急走過也是死句某甲今日會得活句了也菴曰汝作麼生會師曰清明時節雨初晴黃鸝枝上分明語菴頷之久之辭去菴門送之曰他日與子同龕未幾及菴住湖之道場師再參命典藏後卓菴于天湖元統辛未住當湖福源上堂把住也鋒芒不露放行也十字縱橫水雲深處相逢却在千峰頂上千峰頂上相逢却在水雲深處今朝福源寺裏開堂演法昨日天湖菴畔墾土畊烟所以道法無定相遇緣即宗可傳真寂之風仰助無為之化正與麼時如何卓拄杖曰九萬里鵬纔展翼一千年鶴更翱翔歲朝上堂鏡清道新年頭佛法有明教道新年頭佛法無道是有也未必有道是無也未必無張公喫酒李公醉趙州東壁挂葫蘆上堂吃飯要止饑飲水要止渴著衣要免寒歸鄉要到家學道要到三世諸佛開口不得處參禪要到天下祖師插脚不入處若不如此倚他門戶傍他墻壁聽人指揮喫人涕唾總不丈夫福源與麼說話良藥苦口忠言逆耳解制上堂有佛處不得住樓臺月色雲收去無佛處急走過池塘荷葉風吹破三千里外逢人不得錯舉朗州山澧州水四海五湖皇化裏腰包頂笠萬千千問著盡言山與水忽有不甘底出來道山但言山水但言水有甚麼過良久云未可全拋一片心逢人且說三分話居七年退歸霞霧之天湖至正間朝廷聞師名降香幣以旌異皇后賜金襴衣壬辰秋七月二十四日示寂與眾訣侍僧問後事如何遂書偈曰青山不著臭尸骸死了何須掘地埋顧我也無三昧火光前絕後一堆柴擲筆而逝闍維舍利五色燦然不知其數塔於天湖之原配及菴塔示不忘同龕之記也有弟子愚太古者高麗人親得師旨甞蒙說偈印可有金鱗上直鈎之句其王尊之為國師聞師已逝表奏朝廷詔諡佛慈慧炤禪師仍入山分其舍利歸國建塔焉匡山源禪師法嗣嘉興府海門天真惟則禪師湖州費氏子母夢異僧分衛覺而有娠及旦異香襲人髫年出家徧參楚石千巖一十八位尊宿皆機緣不契後聞匡廬無極源禪師徑往叩之源亦無啟發後值源於廁上乃趨問曰如何是祖師西來意源擒住曰道道師於言下釋然頓悟但搖手而已源曰子有所得耶師曰何得之有曰子作道理會耶師拂袖而出遂服勤月餘日益玄奧適平山林公招主藏鑰師往赴之後眾請開法海門上堂僧問如何是向上事師曰向下薦取曰作麼生向下薦取師曰切莫動著曰動著後如何師曰與汝三十棒乃曰向上事向下事截斷兩頭休執滯驀然放出鱉鼻蛇齩殺方知難躲避吽吽吽海門今日忍俊不禁越例為諸人通個消息汝等還委悉麼以拂子點一點曰等閑拋下活人丹浩浩清風動天地上堂三三三九九九海門潮音似雷吼香浮菊圃獻金錢靈感𣏌堤呈玉狗你也有我也有捩轉南辰看北斗正恁麼時高登海門峰頂衝開碧落喝散白雲現大人相顯大神通底句子又作麼生道忽作脩羅擎日月相曰吞吐虗空擎日月十方法界即全身花朝上堂花期月夕蕋珠宮裏降神仙柳約春風綿繡叢中行綵女閙閧閧處顯示舍那性海靜悄悄處埋沒普贒行門正恁麼時且道閙中活計是靜中活計是海門則不然良久彈指曰兜率天宮彈寶几閻浮世界響金鐘洪武初甞預廣薦法會以足疾賜歸癸酉仲春示微疾一日侵晨告眾曰吾去矣侍者請偈師厲聲曰平常說底不是耶即瞑目而逝茶毗獲舍利無筭頂骨牙齒舌根不壞建塔于福祐禪院瑞巖寶禪師法嗣天台華頂無見先覩禪師台之仙居葉氏子資性秀頴嗜讀書過目成誦從古田垕薙髮參方山寶一日作務次渙然氷釋山以偈印之曰此心極廣大虗空比不得此道只如此受持休外覔師受命築室華頂一坐四十年足未甞輒越戶限高峰日禪師法嗣日本國兜率院夢窓疎石國師姓源氏勢州人宇多天王九世孫母禱觀音夢吞金色光而孕暨長繪死屍九變之相獨坐觀想知色身不異空花慨然有求道之意十八為僧夢遊中國疎山石頭二剎一龐眉僧持達磨像授之既窹曰洞明吾本心者其唯禪觀乎初謁無隱範次謁一山寧山曰我宗無語句亦無一法與人師曰願和尚慈悲方便開示山曰本來廓然清淨雖慈悲方便亦無師疑悶無聊見佛國高峰日公叩請如前峰曰一山云何師述其問答峰厲聲喝曰汝何不道和尚漏逗不少師於言下有省辭歸舊隱常牧山一夕坐久偶倚壁忽然仆去豁然大悟有等閑擊碎虗空骨之句求峰印可峰曰西來密意汝今已得善自護持卓菴濃州國王命師領南禪天龍等處王妃延入宮中執弟子禮問道賜號正覺又加號心宗普濟且遺以手書其略曰道振三朝名飛四海主天龍席再轉法輪秉佛祖權摧魔軍壘師以年高隱退尋示寂開元祖禪師法嗣開元佛果如炤禪師晉江蔡氏子從本寺道符出家開元合一妙恩為第一世師左右恩恩甚器之既而徧參天慧內發深有所悟復歸開元恩益禮之及恩遷化契祖嗣位命師知藏大德八年領後堂十年移前堂及祖沒宣政院命師補其席嗣祖法佛成道上堂雪滿于山星回于天一見便見更待六年瞿曇瞿曇無端引得眾生起顛倒東土望西天又曰雪窖生埋幸可憐六年曾不動機緘眼皮𪹼綻三更後明破星兒即不堪上聞賜佛果弘覺之號至順二年無疾溘化紫籜道禪師法嗣台州瑞巖恕中無慍禪師台之臨海陳氏子七歲入鄉校讀書不煩再授年未冠白父母依徑山寂照禪師剃落謁竺元以狗子無佛性話未破疑問纔開口被元一喝遂大悟呈偈曰狗子佛性無春色滿皇都趙州東院裏壁上挂葫蘆元乃發笑曰恁麼會又爭得師拂袖而出初住明之靈巖遷瑞巖上堂有問有答日下挑燈無問無答兔頭截角別資一路萬里崖州直下承當且緩緩地拈拄杖畫一畫云天傾東南地傾西北臨濟小廝兒只具一隻眼卓拄杖喝一喝上堂祖師意無別法下地走穿却鞋上床眠脫却襪只恁麼太誵訛不恁麼無合殺溈山水牛百丈野鴨帶水拖泥不足觀腦後圓光最輝赫喝一喝上堂舉黃龍心禪師與夏公立劇談肇論論萬物為自己情與無情共一體時有狗子臥香桌下龍拈壓尺擊狗子又擊香桌云狗子有情即去香桌無情自住情與無情如何得成一體公立不能加對龍曰纔涉思惟便成剩法何曾會萬物為自己哉黃龍老漢傷慈不少夏公立如入寶山空手而回諸人要會萬物為自己情與無情共一體麼搥殺有情狗子碎却無情香桌盡情收拾將來與他一團束縛拋向東洋大海自然洒洒落落雖然更須知有頂門一竅始得拈拄杖擊香臺云阿剌剌阿剌剌登山脚膝酸啜茶舌頭滑十字街頭石敢當對月臨風吹尺八至節小參古佛心只如今明月炤幽谷寒濤助夜砧先德與麼吐露可謂千鈞之弩要待勍敵發機萬斛之舟不為㘭堂剏設若是滄溟上客閫外將軍捩轉船頭踏飜射垛自然中的於機先豈用瞻風於五兩所以道譬如師子王哮吼師子兒聞之皆增勇徤不見洞山問興平云如何是古佛心平云汝心便是洞山云雖然如是猶是某甲疑處平云恁麼即問取木人去大眾者些子見不破踏不著饒伊辯如滿慈智如鶖子未免癡狂外邊走今夜正當群陰剝盡一陽來復之時聊與諸人聚話片時敢問諸人洞山與麼問興平與麼答莫是將錯就錯借路經過麼莫是真實相為拳踢相赴麼如斯品論鄭州出曹門只如興平末後云恁麼即問取木人去此一轉語太殺慈悲多少人向者裡錯會有能於此撥開胸襟伸得口氣何止醍醐灌頂苟或未然陋巷不騎金色馬回來却著破襴衫後謝事入松巖寄書退院眾固請師堅拒不允洪武七年夏日本國主遣使入貢就奏請師化其國上召師至闕下師以老病辭上憫而不遣遂住鄞之翠山一日忽遘微疾索筆書偈曰七十八年無法可說末後一句露柱饒舌咄端坐而逝慶元府天童了堂一禪師至正二年住台之紫籜遷天寧天童僧問昔日寶壽開堂三聖橫身相為臨濟住院普化盡力扶持畢竟明甚麼邊事師曰兩頭俱坐斷一劒倚天寒曰與麼則五位君臣齊裂下三玄戈甲一時收師曰錯下名言僧一喝師曰亂統禪和如麻似粟上堂拈一莖草作丈六金身將丈六金身作一莖草好大眾不是苦心人不知便下座上堂最初一句末後一機直下搆得燈籠露柱動地放光其或未然竺山今日失利示眾樵歌來叠嶂帆影落汀洲胡孫戴紙帽直上樹梢頭七星劒五雲樓毬打人兮人打毬萬事難把玩魚吞水面漚住天童上堂長觜鳥芳樹不棲摩斯迦滄溟不入龍泉與刀斧同鐵利鈍懸殊良驥與駑駘同途遲速有異以拂子畫一畫曰華須連夜發莫待曉風吹小參靈光不昧萬古徽猷智鑑洞明十虗普應時臨亞歲節屆書雲擊動法鼓大眾雲集一一天真一一明妙更待說個甚麼若說有法又被有礙若說無法又被無礙若說不有不無法又被不有不無礙若說不不有不不無法又被不不有不不無礙雲從龍風從虎聖人作而萬物覩日可冷月可熱眾魔不能壞真說以拂子畫一畫曰黃檗樹頭懸蜜果無言童子唱巴歌問文殊與普賢萬法悉同源如何是同源底法師曰胡張三黑李四曰一毛吞巨海于中更何言師曰不勞懸石鏡天曉自鷄鳴曰是非不到處還有句也無師曰誠知你亂會問名假法假人空法空請師直指師曰曾問幾人來曰無根樹子向甚麼處栽師曰更深猶自可午後更愁人曰只在目前為甚麼再三不覩師曰千年常住一朝僧保寧茂禪師法嗣嘉興府本覺南堂清欲禪師台之臨海朱氏子元曆二年出世集慶之開福上堂拈拄杖曰與麼來者彩鳳舞丹霄不與麼來者鐵蛇橫古路直饒與麼不與麼去來道絕也是稱錘蘸醋卓拄杖上堂摩尼珠人不識如來藏裡親收得萬象森羅影現中一顆圓光色非色永嘉大似乞兒暴富開福道摩尼珠誰不識擊碎分文也不直拋向虗空更那邊免使時人挂胸臆然則雲開日出職到威成撞著本色道流恰似泗洲人見大聖元統元年住本覺上堂顧視大眾曰者裏莫有作家戰將麼時有僧出眾曰盡大地是個問頭和尚作麼生答師曰遍虗空是個答語你作麼生領曰萬福師曰拄杖不在苕帚柄與你三十曰諸方有明眼人在師曰你莫是患盲麼僧無語師喝曰將謂是收燕破趙之才元來做未得行間小卒出去乃曰若論戰也個個力在轉處到者裏直須通方上士本色英流寸刃不施全鋒敵勝其或未然擬議不來髑髏粉碎卓拄杖喝一喝下座舟中值冬至小參一道虗明總是自家田地初爻既兆全彰劫外乾坤無去來動靜之殊無取捨是非之異可以騎聲葢色可以隨流入流可以泛華亭半葉之舟可以盡澤國烟波之勝不舉任公之釣非同濠上之遊擊拂子曰劈口一橈已傷鹽醋離鈎三寸休更回頭拍膝曰永夜月明天在水雁聲飛過白蘋州問仲冬嚴寒年年事晷運推移事若何師曰昨夜日輪飄桂花今朝月窟生芝草問單傳直指已涉離微坐斷千差請師答話師曰破鏡不重照落花難上枝曰便恁麼去時如何師曰烏龜鑽敗壁問說法不應機總是非時語作麼生得應機去師曰夜半起來失却牛天明起來失却火問心不是佛智不是道還端的也無師曰喫飯止饑飲水止渴曰智不到處切忌道著又作麼生師曰塞却耳根分明聽取癸卯八月示寂明州瑞雲清凉寺實菴茂禪師郡之奉化鄭氏子幼齡中夜坐禪母惡之推使仆輙達旦不瞑後出家參南㵎泉禪師一夕松月下聞流水聲有省往白泉泉俾詣古林林問汝來何為師曰正為生死事大求出離耳林曰子明知四大五蘊是生死根本為何入此革囊師擬議林以錫杖擊之豁然悟入至正壬午住長明之瑞雲山有僧問答未竟以手拍地而笑師曰滯貨何須拈出耶僧噓一聲師便喝僧有省退隱東堂影不出山元明師猶子也迎歸天童之此軒未幾示疾眾請書偈師曰我此中廓然也何偈之為即端坐憑几握右手為拳以額枕之而逝號佛光普照大禪師靈隱海禪師法嗣徑山悅堂顏禪師明州人受度于婺之寶林寺徧參諸宿卒為東嶼海之正嫡初住崑山之東禪轉吳門之萬壽升虎林之南屏遂陟雙徑竪大法幢名聞京國緇素雲臻如流赴壑朝廷再降璽書護教并賜金襴法衣師歷主四大剎有四會語錄金華宋公濂為之序稱其隨機接引霑被為多所謂施善巧釋結習假言辭窮實際者乎建寧府斗峰大圭正璋禪師福州福清人禮湖南絕聽祝髮參東嶼海令看趙州狗子話工夫無間只是不知落處一日聞海頌俱胝竪指話言下頓悟遂上方丈呈所得海曰作麼師曰古今現成事何必涉思惟海曰既不涉思惟汝來作麼師曰請和尚證明海曰證個什麼師便喝海曰汝什處見趙州師曰錯海曰向汝道什麼師曰須彌𨁝跳海曰趙州即今在什處師曰無海曰趙州鼻孔因什在老僧手裡曰謝和尚證明海曰放汝三十棒還我無字偈來師頌曰狗子佛性無著眼睛枯瞥爾飜身轉唵㗭哩蘇嚧海撫而印之後結茅斗峯漸成叢席上堂良久曰黃金雖貴入眼成塵便下座上堂玉宇霜清瓊林落葉一向全提萬機𥨊削作者好求無病藥上堂舉青州布衫話師曰昨夜三更裏雨打虗空濕狸奴知不知倒上樹梢立上堂元正啟祚萬物咸亨喚作新年頭佛法瞎却你眼不喚作新年頭佛法折却我舌畢竟作麼生便下座臨終偈曰生本不生滅亦無滅幻化去來何用分別大眾珍重不在言說便合掌入滅明州育王大千慧炤禪師永嘉麻氏子年十五依瑞光院出家受具後便發足參方首謁晦機次謁東嶼嶼問東奔西走將欲何為師曰特來參禮爾嶼曰天無四壁地絕八荒汝於何地措足耶師抵掌於几而退嶼知其有所悟乃復召至反覆勘辨嶼嘉之遂留執侍尋主藏于萬壽嶼遷淨慈邀師分座天曆戊辰出世樂清之明慶示眾佛法欲得現前莫存知解縛禪看教未免皆為障碍何如一物不立而起居自在乎所以德山棒臨濟喝亦有甚不得已爾至正乙未遷補陀未幾署育王甞垂三關語以示學者曰山中猛虎以肉為命何故不食其子虗空無向背何緣有東西南北飲乳等四大海水積骨如毗富羅山何者是汝最初父母居九年退居妙喜泉上築室曰夢菴掩關獨處凝塵滿席不顧也洪武六年十月朔召弟子曰吾將西歸汝輩在外者可速還越七日沐浴更衣怡然入寂育王雪窓悟光禪師字公實成都之新都人姓楊氏初說法于白馬寺遷開元已而升育王會天童虗席命師兼之有四會錄宋公濂序之其言曰四會之語屹立不遷如真正幢涉險度危如大法船至于垂三語以來學如臨萬仞懸崖撒手而立虞文靖公謂為佛果一枝鳳毛麟角其言信不誣也天寧曇禪師法嗣三空居士女中之善倫也秉烈丈夫之志不為世氛所染參竺雲單持無字如是三十六年忽一日問曰生死到來時如何雲曰生是誰耶死是誰耶居士低頭問訊雲疑其異常遂再叩之曰是誰生是誰死士復低頭問訊雲曰切忌死在者裡士提起念珠曰數珠一百八未幾示微疾說偈而化火後得舍利甚眾玉山珍禪師法嗣金陵龍翔曇芳忠禪師南康人甞繼端公之後住徑山後移蔣山升龍翔一夕寺災明日梁王詣寺問曰興復若何師曰賴有大檀越在王曰寺既矣佛依何住師曰古佛過去今佛再來王曰衲子所謂蔣薄粥者何也師曰將謂殿下忘却王曰衲子所謂三隻襪者何也師曰國內山川都踏遍今朝親到帝王前王大悅賜號廣慧圓悟大禪師師再造龍翔工方竣而示寂徑山伏禪師法嗣杭州徑山南楚悅禪師隆興人也上堂聞聲悟道見色明心驀拈拄杖曰者個是色卓一下曰者個是聲諸人總見總聞且那個是明底心那個是悟底道喝一喝曰貪他一粒米失却半年糧諡佛慈法喜禪師天童坦禪師法嗣南京天界孚中懷信禪師明之奉化姜氏子年十五往法華院出家已而祝髮受具習教學三觀之旨後參竹西西知是法器厲色待之不與交一言師疑益熾一日西上堂舉興化打克賓話問師師曰俊哉師子兒西頷之師乃依止焉歷職至典藏泰定丙寅出住明之觀音遷洛迦山賜廣慧妙悟智寶弘教禪師之號法衣一襲至正壬午升中竺乙酉升天童冬十月移主龍翔會明兵下金陵寺僧散去師獨趺坐執兵者滿前無不投杖而拜高皇帝甞幸其寺聽師說法嘉師言行純慤特改龍翔為大天界寵賚尤加一日謂左右曰吾將歸矣汝等當以荷法自期勵精進行可也言畢而瞑侍者請留偈遂握筆書曰平生為人戾契七十八年漏洩今朝撒手便行萬里晴空片雪書畢復瞑停龕七日顏面如生其示寂前一日上方督師江陰夢師入謁上問曰師來何為師曰將西歸來告別耳及駕還金陵聞師訃正與夢符上驚異詔出內帑以助喪事舉龕之夕上親致奠送出都門之外茶毗於聚寶山前舍利如麻如菽五色燦爛烟所及處亦累累然生門弟子卜於牛首山之東麓建塔焉大慈成禪師法嗣衢州烏石山傑峰世愚禪師郡之西安余氏子入蘭溪顯教為僧得戒後徧參知識未有所入後參止巖令看不是心不是佛不是物一夕坐至夜分聞隣僧舉證道歌曰不除妄想不求真豁然如釋重負偈曰時時覿面不相逢喫盡娘生氣力窮夜半忽然忘月指虗空迸出日輪紅往見巖巖曰那裏見神見鬼來師曰捉得賊了也巖曰贓在甚麼處師一喝巖曰開口合口都不是向上道將一句來師曰遍界明明不覆藏巖舉竹篦曰喚作竹篦則觸不喚作竹篦則背你喚作甚麼師便掀倒禪床巖打竹篦三下曰瞎漢敢來者裏捋虎鬚師便禮拜往見元翁問甚處來曰大慈來翁曰大慈鼻孔深多少師卓拄杖一下翁曰拗折拄杖把什麼卓師便禮拜曰今朝親見老師翁翁曰念汝師孫放汝三十棒歸大慈執侍三載一日巖謂師曰古人尋師擇友不可蕩喪光陰子雖得佛祖應化之道未能向上飜身因舉汾陽見首山曰萬古碧潭空界月再三撈摝始應知師始得大徹歸西安烏石山結茅以居漸成叢席眾至三千指至正六年住石溪僧問遠離烏石嶺來住石溪山開示人天路如何透祖關師曰龍生金鳳子衝破碧瑠璃曰與麼則覿面不相識千里可同風師曰重疊關山路曰達磨西來不立文字直指人心見性成佛既不立文字何得流傳至今師曰官不容針私通車馬曰直指人心指出那個心師曰開口不在舌頭上曰見性成佛性在什麼處師曰太湖三萬六千頃夜夜波心月色明問黃梅碓𭪿花開日夜半傳衣過嶺南此事還端的也無師曰一物本來無兩肩擔不起曰不是風動不是幡動仁者心動又作麼生師曰知燈元是火信水不離波曰和尚為人一句又且如何師曰攔顋一掌腦後一搥曰恁麼則老婆心切師曰不從巨浪拋香餌爭得金鱗上釣船上堂萬仞峰頭打一搥粉身碎首絕疑猜忽然絕後重甦起萬象森羅笑眼開且道笑個什麼者回識得來時路更不將身入母胎喝一喝大都安講主來參師問講主講什麼經曰金剛經曾於無所從來亦無所去處得箇省處師曰既是無來無去因什得到者裏曰便是無來無去底師曰即今在什麼處主一喝師曰下喝行拳都且止四大分散時向何處安身立命曰盡大地那裏不是自己師曰忽遇劫火洞然大千俱壞時如何曰我到者裏却不會師曰六祖不會破柴踏碓達磨不識九年面壁你不會見個什麼曰我只是不會師曰瞎漢請坐喫茶洪武三年十二月示微疾書偈曰生本不生滅本不滅撒手便行一天明月擲筆而逝弟子奉全身藏于慈雲塔院天寶樞禪師法嗣福州雪峰逆川智順禪師溫州瑞安陳氏子七歲出家及受具遂入閩參鐵關關授以心要踰月因如廁覩園中瓠瓜有省舉所悟求證關曰此第入門耳最上一乘大遠在乃囑曰汝可悉棄前解專於參提上致力則將自入閫奧矣一日值關將晚參擬離榻忽豁然謂關曰南泉敗闕今已見矣關曰不是心不是佛不是物是個什麼師曰地上磚鋪屋上瓦覆關曰即今南泉在何處師曰子過新羅關曰錯師亦曰錯關曰錯錯師觸禮一拜關集眾勘師笑曰未吐辭前已不相涉和尚眼在什麼處又為此一場戲劇耶關曰也要大家知遂將宗門要語一一訊師師皆具答關然之乃命掌藏鑰尋令分座及關遷化眾請嗣位繼主報恩遷歸原朝廷賜法衣及佛性圓辯之號久之悉散其衣鉢所蓄退居一室掘地為爐折竹為箸淡如也平章燕只不花出鎮閩省請師住東禪不一載革故鼎新有同神造升雪峰亦立起其敝洪武初詔有道僧十人於鍾山建無遮法會師奉旨陞座說法大駕幸臨慰問備至南還住淨慈適朝旨徵有道沙門入京以備顧問眾咸推師至京四閱月一日索浴書偈而化茶毗獲舍利無筭持歸建塔焉鐵山瓊禪師法嗣汝州香山無聞聰禪師香山人初參獨翁令參三不是話未有省發一日敬上座謂曰要知端的意北斗面南看疑之一夕有省遂尋敬敬問來者何人師曰非人非我曰既非人非我畢竟是什麼師曰饑來吃飯困來眠敬不能決適鐵山從高麗歸在石霜乃往見之山聞師有發明處乃問仙府何處師曰汝州曰風穴祖師面目如何師曰和尚且止須臾之間將二十年工夫說一遍鐵山把住噤喉問如何是無字義師曰近從潭州來不得湖北信山曰未是再道曰和尚幾時離高麗曰未是更道師喝一聲拂袖便出山曰者兄弟都好只一件大病道發明了師感激承鐵山開示細大法門後隱光州獨行獨坐一十七年方得頴脫普說曰法無定相遇緣即宗秉金剛劒吞栗棘蓬截斷衲僧舌頭坐却毗盧正頂竪一莖草作丈六金身將丈六金身作一莖草不是禾山鼓响且非教外別傳直教寸絲不挂月冷秋空寒灰發焰到者裏喚作佛法墮地獄如箭射不喚作佛法亦墮地獄如箭射諸仁者畢竟作麼生會開口喪身失命不開口爛却舌根豈不見船子曰吾於藥山二十年藏身處沒踪跡沒踪跡處莫藏身雖然恁麼舉唱開佛知見立大圓鏡竪涅槃幢舉揚般若敲唱雙舉兼帶挾通炤用同時正眼觀來盡是閑家具與我衲僧分上撩掉沒交涉竪拂子曰會麼縉雲真禪師法嗣代州五臺靈鷲碧峰寶金禪師乾州永壽人姓石氏父母俱崇善時有沙門以觀音像授其母囑曰謹事之當生智慧之男未幾果生師白光燁燁照室六歲禮雲寂溫法師為童子及受大僧戒遂徧詣講肆窮性相之旨久之曰是可以了生死耶乃棄去時如海真禪師開法於縉雲師往謁示以道要師大起疑情偶擕筐隨海擷蔬於園忽凝然不動歷三時方窹海曰作定耶師曰動定不關海曰動定不關是什麼人師舉筐海不肯師置筐于地叉手而立海亦不肯師一喝海奮前揕胸曰速道師築海胸仆之海笑曰塵勞暫息定力未能深也必使心路絕祖關透然後大法可明耳後憩錫峨眉日啖松柏脇不沾席者三年一日聞伐木聲大悟往見海海于地上𦘕一圓相師以袖拂去之海後𦘕一圓相師于中增一畫又拂去之海再畫如前師又增一畫成十字又拂去之海復畫如前師於十字加四隅成卍字又拂去之海乃總畫三十圓相師一一具答海曰汝今方知佛法宏勝如是宜往朔方其道大行先是師在定中見一山甚秀麗重樓傑閣金碧絢爛諸佛五十二菩薩行道其中有招師謂曰此五臺秘魔巖也汝前身脩道其中靈骨猶在何乃忘之既窹遂遊五臺山道逢蓬首女子身被五綵敝衣赤足徐行一黑獒隨其後師問曰子何之曰入山中爾師曰將何為曰一切不為良久乃沒叩之同行者皆莫之見或謂文殊化身云師乃就山結靈鷲菴以居聲光日露四方聞之不遠千里負餱糧來獻者日繽紛也至正戊子順帝遣使詔至京甚敬之命住海印寺力以疾辭賜寂照圓明之號太祖高皇帝即位詔師至南京見上于內殿問佛法大意上設普濟會于鍾山選高行僧十人蒞其事師與焉蒙寵賚甚渥親御翰墨賜詩十二韻未幾示微疾弟子請留末後句師曰三藏法寶尚為故紙吾言欲何為怡然而逝壽六十五臘五十九茶毗獲五色舍利齒舌數珠皆不壞南嶽下二十三世淨慈聯禪師法嗣杭州慈光寺立中成禪師錢塘孫氏子首謁祖芳聯公請益次聯舉臘月火燒山話師頌曰白雲迷却舊行踪臘月燒山火正紅再得慈風來扇發冷氷氷處煖烘烘聯深器之中峰本禪師法嗣婺州伏龍山千巖元長禪師越之蕭山董氏子家世宗儒九歲就外傅諸書經目成誦十九薙髮於武林靈芝寺會行丞相府飯僧師隨眾應供適中峰在座即呼曰汝日用何如師曰念佛峰曰佛今何在師擬議峰厲聲叱之師遂跪求法要峰授以趙州無話令參於是縛茆靈隱山中未幾復以他務移動隨順世緣倐忽十載復還靈隱脇不沾席者三年因往望亭聞鵲聲有省亟見峯具呈悟因峯又斥之師憤然來歸夜將寂忽鼠食猫飯墮其器有聲恍然開悟復往質於峰峯問曰趙州何故言無師曰鼠食猫飯峯曰未在師曰飯器破矣師曰破後如何師曰築碎方甓峰乃微笑後隱居伏龍漸成叢席始開法示眾龍門水急一句截流茅屋風高千山起浪三世諸佛望風結舌六代祖師斫額有分天下老和尚仰羨仰羨是汝諸人既到者裏作麼生與山僧相見驀拈拄杖曰與麼與麼人境俱奪不與麼不與麼炤用同時卓一下曰龍生金鳳子衝破碧琉璃上堂僧問如何是第一句師曰有口如啞曰如何是第二句師曰有眼如盲曰如何是第三句師曰棒折也未放你在師乃擲拂子曰此是老僧第二句如何是第一句便下座上堂轉山河國土歸自己則易轉自己歸山河國土則難拈了也父母未生前道將一句來示眾一喝分賓主照用一時行要會個中意日午打三更諸禪德臨濟大師四稜塌地了也乃喝一喝且道那個是賓那個是主那個是炤那個是用又喝只者是賓只者是主只者是炤只者是用又喝且不是賓且不是主且不是炤且不是用是個什麼又喝云進前求解會特也斬精靈上堂僧問達磨面壁意旨如何師曰有口開不得曰人天交接兩得相見如何是相見底事師曰烟熏黑漆桶曰浩浩塵中如何辯主師舉拳示之曰辯後如何師曰你主在什麼處僧禮拜師乃曰秋風凉秋夜長未歸客思故鄉大眾如何是你故鄉喝幸然家裏坐不用苦思量至正丁酉六月十四日示微疾集眾書偈曰平生饒舌今日敗闕一句轟天正法眼滅投筆而逝諡佛慧圓鑒禪師蘇州獅子林天如惟則禪師吉安永新譚氏子幼歲入禾山祝髮後往天目依中峰每見峰曰老幻一生參禪不得開悟心竊有所疑後深得其旨遂往蘇州卓菴以居名獅子林四方請益者日眾乃開法示眾執法修行如牛拽磨關西沒頭腦漢盡力道得一半不執修行如磨拽牛山僧忍俊不禁也只道得一半休休以何法證以何法修隨流認得性無喜亦無憂不風流處也風流驀拈拄杖曰叵耐雲門大師又道觀世音將錢買胡餅放下却是饅頭卓拄杖曰不因夜來鴈爭見海門秋示眾有時伸出佛手有時放出驢脚錯有時拍禪床有時擊香桌錯有時舌生毛唇生醭拄杖長年靠壁角臨濟德山鼻孔一時穿却錯諸禪德向者三箇錯處認得老僧請你喫無麵䬪飥示眾言無展事句不投機承言者喪滯句者迷擬心即差動念即乖不擬不動立地死漢故我祖師門下驀劄相逢無你轉身處據令而行無你開口處跨一步去鐵壁銀山眨得眼來電光石火三世諸佛也只得望崖而退若是個生鐵鑄就底漢等閑一擲抹過太虗直得南山鱉鼻咬殺東海鯉魚陝府銕牛撞倒嘉州大像三界拘繫不得千聖羅籠不住從前萬別千差當下七通八達一一現成一一圓妙方信道達磨元是老臊胡臨濟喚作白拈賊雖然恁麼到獅林門下更須朝打三千暮打八百何故如此卓拄杖曰華嶽連天秀黃河徹底清木龕成示眾生死與涅槃六六三十六無常等不來我且先瞑目諸禪德且道天如即今是死是活死却活天如活却天如死佛佛受輪迴只為者些子示寂塔于水西原日本國相州建長禪寺古先印原禪師世居相州姓藤氏為國中貴族十三剃髮徧歷戶庭咸無所證遂入中夏參無見於華頂見指參中峰師屢呈見解峰呵之師𥨊食俱廢峯憐其誠乃曰此心包羅萬象迷則生死悟則涅槃生死之迷固是未易驅斥涅槃之悟猶是入眼金塵當知般若如大火聚近之則焦首爛額惟存不退轉一念生與同生死與同死自然與道相符脫使未悟之際千釋迦萬彌勒傾出四大海水入汝耳根總是虗妄塵勞皆非究竟事也師聞之不覺汗下一日有省告峯曰原已撞入銀山鐵壁去也峰曰既入銀山鐵壁來此何為師超然領解後辭去參古林東嶼諸大老會清拙澄公將入日本拉師同行遂出世甲州之慧林遷萬壽淨智長壽諸剎一日微疾謂侍者曰時至矣可持觚翰來乃曰吾墖已成唯未書額耳大書心印二字遂逝初門人欲𦘕師像預索贊語師作一圓相題其上曰妙相圓明如如不動觸處相逢是何面孔般若誠禪師法嗣建寧府高仰山古梅正友禪師廣信貴溪丁氏子自幼出家禮末山本公為師往江淮南浙徧參知識一日因小便觸地得個入處往見絕學學問曾見什麼人來師曰見海印和尚教提無字學曰無字作麼生提師曰未提已前早自分曉學曰靈雲見桃花悟道玄沙云諦當甚諦當敢保老兄未徹在且道是許他不許他師曰言下許學大笑曰不是再來看次早上方丈學曰夜來事作麼生師曰靈雲捉得賊玄沙不放贓即今贓賊一時斷還和尚把坐具便打學曰黃檗打臨濟六十棒意作麼生師便喝學曰因甚又去打大愚再來掌黃檗師纔開口學曰不是師曰畢竟那個是學便攔頭打曰且去再來看次早上方丈學曰抽袈裟師擬議學便打三下師便喝學又打六下師便休去後上方丈求住學曰你去見無用中峰斷崖三人了却來與我同住後到雲巖見法昌語錄曰驅耕夫牛奪饑人食忽有徹處不覺汗下便頌公案數則寄呈學學看畢對眾曰此人得我第三番竹篦上氣力但是尚欠脫殻在越三年因過堂打動鉢盂忽大悟出住天心繼住高仰上堂慧劒單提明行正令擬議不來喪身失命還有當鋒底麼良久曰正好一帆風過海個中不遇駕濤人小參月落山頭慘雲橫谷口陰欲明生死事直指本來心還有會得本來心底麼夜靜不勞重借月玉蟾常挂太虗中至正壬辰五月初三日跏趺示寂全身塔于鳳山智者義禪師法嗣杭州淨慈德隱普仁禪師婺之蘭溪趙氏子十歲依演法院出家及受大僧戒遂走參了然義公機緣相契命為侍者後遍遊名剎靡不改容禮之東陽輝公留掌記而徑山悅公尋延師分座至正乙未出住金華西峯太祖高皇帝取婺州幸智者寺詔師主之晚蒞南屏忽示微疾屈指計曰今夏五月矣左右曰然師曰此八月八日最良吾將逝矣至期整衣端坐而寂海門則禪師法嗣湖州弁山白蓮寺懶雲智安禪師嘉興沈氏子依海昌淨妙寺出家首謁天真發明別傳之旨自此韜光有司屢起以名剎不就後恪遵竹杖禪師遺命住白蓮寺示眾萬法歸一無孔鐵槌當面擲一歸何處抹過西天并此土青州布衫重七斤寒巖古木璚花春仁者殷勤問端的娘生鼻孔從來直倘於言下解知歸九九方明八十一晚歸淨慈久之託疾告終塔于蒼弁之南阡華頂覩禪師法嗣處州福林院白雲智度禪師處之麗水吳氏子從空中假禪師祝髮受具深習禪定者四年出遊閩中還乃築福林院以居日取楞嚴圓覺閱之久之復出遍參謁無見問西來密意未審何如見曰待娑羅峰點頭却向汝道師以手搖曳欲答見遽喝師曰娑羅峯頂白浪滔天花開芒種後葉落立秋前見曰我家無殘羹剩飯也師曰此非殘羹剩飯而何見頷之乃服勤數載及辭歸見祝之曰心法相投豈在多言勿掉三寸舌誑人須真正見解著于行履可也師佩服之至正甲申眾迎師歸福林甲辰中丞章公延居龍泉之普慈僧徒雲集至八百人丙午遷武峯洪武己酉應召入京未幾回浙明年二月示疾還福林五日索浴更衣書偈曰無世可辭有眾可別太虗空中何必釘橛擲筆而逝茶毗得舍利五色齒牙數珠不壞墖于院西開元炤禪師法嗣泉州開元夢觀大圭禪師晉江廖氏子初習儒學既成父詔之曰吾為佛不成吾以汝許佛汝其毋違師乃往開元禮廣漩為師得度後侍佛果凡三歷職而至分座書記秉拂一元未判至理全彰三畫纔分彝倫攸敘鷲嶺拈花微笑大似上古結繩少林立雪安心何異肇興書契自此淳漓朴散接響承虗說黑說黃指曲指直總是土圭測景尺箠量空衲僧家須向卦爻未兆點畫未分已前一印印定俾從上千聖窺無門歷代祖師難尋朕迹說甚麼東來意西來意佛法短佛法長只如今日紫雲影裏華屋斬新玲瓏八面峭峻一方作佛法商量即是作世諦流布即是以拂子畫一畫曰未明三八九難達古皇道後堂秉拂無言無說處顯示泥團土塊一機一境上提撕平地骨堆洞山果桌浩老布裩一奢一儉慈明揭牓仰山叉手一儉一奢從上古德與麼激揚致使末代葛藤不少上方主丈子聽得出來道一切諸法如夢如化今夜第二座又向夢中說夢輙莫瞞人好秉拂上座直得緘默而已何也鐵牛對對黃金角木馬雙雙白玉蹄後宣政院檄師主承天堅謝不起築室于寺西額曰夢觀日以詩文自娛其文似柳其詩似陶𠃔登作者之壇學者俱宗之示寂建墖于西山所著有夢觀集紫雲開士傳行世別源源禪師法嗣明州天童元明原良禪師寧海周氏子初住台之瑞巖後主天童其侑宏智禪師詞曰嗚呼山不讓塵故能成其高海不讓流故能就其深師非宿備六度萬行之願輪則曷由樹斯大法之功於今古聖人出興作百世師千載一時惟師得之巍巍窣堵鎮茲東谷洞上一宗真規復復昭告非詞深勒崖谷願師再來為物作則天童一禪師法嗣撫州雲居呆菴普莊禪師台之仙居袁氏子母夢梵僧入室而生晬歲岐嶷頴異負笈入鄉校授書成誦長依天童左菴薙髮受具抵郡之天寧參了堂堂曰何來師曰天童堂曰冐雨衝寒著甚死急師曰正為生死事急堂曰如何是生死事師以坐具作摵勢堂曰敢來者裡捋虎鬚參堂去一日堂室中舉庭前柏樹子話師擬開口堂劈口掌之豁然有省由是朝夕咨決聿臻閫奧洪武己未出世撫州北禪示眾昨日開荒地請諸人剗却荊棘除去瓦礫本來基址已見分明只有中間樹子無人拔得山僧今日未免別行方便利刀剪盡繁枝葉鈍钁深鋤邪見根實地工夫成一片住山鈯斧了無痕師凡見僧便曰近奉公文務要打點上座僧曰某甲不是奸細師曰也要勘過始得曰和尚莫得倚勢欺人師展手曰把將公驗來僧擬議師便掌鏟草次僧問者片田地幾時鏟得乾淨師竪起鋤頭曰不得喚作鋤頭未審上座喚作什麼僧無語師拋下鋤頭曰者片田地幾時鏟得乾淨問騎虎頭撩虎尾中間事作麼生師曰渠儂得自由曰只如古人道我也弄不出意且如何師曰入水見長人僧請益師曰汝自己分上少個什麼却來請益僧擬對師曰只知貪程不覺差路次遷雲居僧問如何是雲居境師曰路轉溪回空院靜曰如何是境中人師曰太平時代自由身曰人境已蒙師指示願聞一句接初機師曰無毛子拍天飛問路逢達道人不將語默對時如何師曰達道者方知曰和尚何得干戈相待師曰捉賊不如嚇賊曰明眼人瞞他一點也不得師曰情知汝不是好心上堂老僧開荒時於法堂基上掘得一個鈯斧子久聚兄弟若有用得著者兩手分付若是負荷不起老僧收得來著甚死急不如颺向垃圾堆頭從他日炙風吹去也驀拈拄杖卓一下曰鞭起鐵牛耕大地誰能井底種林檎洪武二十六年春詔徵天下高行沙門師與舉首對揚稱旨秋函命祭廬山禮成復命賜衣一襲是冬得旨升住徑山上堂自有生佛以來說法如雲如雨者不可勝紀徑山今日權借虗空為口須彌為舌宣說真俗不二法門十方世界情與無情一時異口同音讚言善哉善哉希有希有眾中莫有旁不甘底麼出來與拄杖子相見拈拄杖卓一下曰諦觀法王法法王法如是上堂人從廬嶽來接得華頂信報道南山白額虎却在龍淵裏藏牙伏爪東海赤梢鯉直上鷲峰頭躍浪衝波好大眾一大藏教何曾說到者裡雖然徑山拄杖子未肯放過在拈拄杖畫一畫曰仙人張果老不愛藥葫蘆靠拄杖下座忽于十月二十三日謂眾曰難難二八嬌娘上高山老僧扶不得言竟遂寂徑山悅禪師法嗣杭州靈隱見心來復禪師南昌豐城王氏子祝髮於邑之西方寺誓屏諸緣直明涅槃妙旨久之全體無礙謁南楚楚然之留司內記初住越之定水作室東㵎名曰蒲菴示睦州思親之意掩關示眾槁木形骸百念灰溪猿野鶴苦相猜柴門獨掩青松雨笑口逢人亦懶開甞賦白牛偈曰耕雲不住海門東収放楞枷小朵峰露地已忘調伏力雪山誰識去來蹤放歸祇樹隨羊鹿種就曇花伴象龍一色天闌頭角別水精池沼玉芙蓉洪武元年冬以高行召說法鍾山賜食內庭師有能文聲上詔侍臣取而覧之褒美弗置時蜀王椿為太祖所鍾愛命儒臣李時荊蘇伯衡等與師論道無虗日蜀王遇師甚恭命撰坐心觀道崇本敬賢四箴牓於宮以自警二十四年山西捕獲胡黨舉師等往來胡府坐罪入滅靈隱明禪師法嗣杭州淨慈無旨可授禪師台之臨海李氏子年十二入石門寺為驅烏十九得度為大僧已而嘆曰所貴為比丘者務欲究明心宗爾苟纏蔽文字相中何時能脫離耶遂杖筞遍歷諸方因緣俱弗契久之參普覺明公于靈隱問答之頃疑情頓釋覺可之命充堂司尋反石門白巖真公延居上座至元六年出世台之大雄遷隆恩補白巖明年遷龍華一坐十五秋百廢俱修乃作休菴于西塢日修淨土業且曰此即禪功也惡可強明同異哉洪武六年杭之中竺以府侯之命起師主其席師勉強應之行至江濵淨慈諸勤舊帥眾邀于道擁入居其位師却之不得色頹然不怡居二載手撾鼓而退歸臥竹院俄示疾端坐西向謂左右曰吾將逝矣眾請偈師曰吾宗本無言說乃合爪稱佛號至聲漸微而寂茶毗牙齒貫珠不壞舍利色如金銀水精者遍地藏于龍墖烏石愚禪師法嗣南京靈谷寺無涯非幻禪師衢之西安人從傑峰為僧峯問何處來師曰虗空無向背峰指寺鐘俾作頌師曰百煉爐中滾出來虗空元不惹塵埃如今挂在人頭上撞著洪音遍九垓時年十二峰器之即令祝髮永樂丁亥太宗文皇帝有事于長陵徵師入對稱旨大嘉賞賚命住靈谷庚子春上建法會師若不經意其徒問之師笑曰自家有一大事甚緊何暇他及乃書偈曰生死悠悠絕世緣蒙恩永樂太平年者回撒手空歸去雪霽雲消月正圓遂逝羅陽三峰寺太初啟原禪師日本國人年十九參上國四十五員知識末於傑峰得法後住三峰一日書偈曰生也鐵面皮死也鐵面皮一椎百雜碎白日繞鐵圍擲筆而逝塔于院南
