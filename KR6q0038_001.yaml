body:
  text: 鼓山嗣祖沙門元賢輯曹洞宗青原下十六世雪竇鑑禪師法嗣明州天童長翁如淨禪師生而岐嶷不䫫常童長學出世法參足菴於雪竇看庭前柏樹子話有省呈頌曰西來祖意庭前柏鼻孔寥寥對眼睛落地枯枝才𨁝跳松蘿亮鬲笑掀騰菴頷之出世屢遷名剎後主淨慈升天童開爐上堂召大衆打圓相云個是天童火爐近前則燒殺退後則凍殺忽有個漢出來道合作麼生㘞火爐動也上堂霜風號肅殺霜葉墜蕭𮨱舉拂子曰看唯有玲瓏崔嵬望轉高所謂天童滯貨今朝短販一遭莫有酬價底麼下座巡堂上堂外不放入內不放出痛下一槌萬事了畢且道如何太白峰前令斬新內外紀綱俱委悉上堂天童鐵臭老拳頭打殺江湖水牯牛夜深忽然生個卵天明推出大日頭且道如何晒㫰諸人蒸濕處免教行步滑如油上堂靈雲見處桃花開天童見處桃花落桃花開春風催桃花落春風惡靈雲且置莫有與天童相見底麼春風惡桃花躍浪生頭角新起妙嚴慶懺上堂推倒多生老鼠窠掃空平地笑呵呵從空架起生頭角蓋覆驢牛不厭多今朝成就大緣千古發揮大事且道如何斫額任他門外客到家還我個中人復舉文殊問無著近離甚麼處著云南方殊云南方佛法如何住持著云末法比丘少奉戒律殊云多少衆著云或三百或五百師云春風勾引鷓鴣啼著問文殊此間佛法如何住持殊云凡聖同居龍蛇混雜著云多少衆殊云前三三與後三三師曰平地波瀾鈎鐵船這兩轉語要與諸方眉毛撕結更有兩轉語要與諸方點眼或三百或五百銅錢鐵錢省數足陌前三三與後三三蘿蔔芋嬭淺貯滿擔諸方忽然眼開決定拍手大笑笑個甚麼不笑巴叉便笑杜撰雖然笑者還稀忽有人問天童多少衆便向他道新起妙嚴誇第一一齊都在𦘕圖中師六坐道場未說稟承衆有是請師曰我待涅槃堂裏拈出果臨終拈香曰如淨行腳四十餘年首到乳峰失腳墮於陷穽此香今不免拈鈍置我住雪竇足菴大和尚并書辭世頌曰六十六年罪犯彌天打個𨁝跳活陷黃泉咦從來生死不相干擲筆而逝塔全身于本山華藏詐禪師法嗣師嗣淨慈暉會元無出今收入補燈東谷光禪師上堂藏身處沒踪跡無影樹頭靈鳥宅沒踪跡處莫藏身不萌枝上花開坼有來繇誰辨的天晚西風拂拂吹松叉一徑爭拋擲嘗頌僧問曹山不挂靈衣曰曹山酒顛有誰諳醉語狂言不自慚夜半日頭當午照騎牛背面著靴衫又頌韶國師問龍牙天不能蓋地不能載曰大海心中泛鐵船隨波逐浪浪滔天順風到岸無人識江北從來使鐵錢青原下十七世天童淨禪師法嗣襄州鹿門覺禪師參長翁值翁上堂舉靈雲悟道因緣頌曰一個烏梅似本形蜘蛛結網打蜻蜓蜻蜓落了兩片翼堪笑烏梅咬鐵釘師不覺失笑曰早知燈是火飯熟幾多時後承印記出住鹿門示衆曰盡大地是學人一卷經盡乾坤是學人一隻眼以這個眼讀如是經千萬億劫常無間斷諸人還看讀得麼如看讀得老僧請他喫個無米油糍雪菴從瑾禪師僧請益倩女離魂話師示以頌曰南枝向暖北枝寒何事春風有兩般憑仗高樓莫吹笛大家留取倚闌看日本永平道元禪師姓源氏本國村上天皇九世之裔骨相奇秀七處平滿目有重瞳七歲讀毛詩左傳及諸經史不由師訓自然通曉時以神童稱之居母喪每觀香煙繚繞念念散滅悟世無常遂投舅氏台山良顯法師出家時年一十四矣尋稟具戒究大小乘諸經論聞大宋有老宿傳佛心印乃特附船舶航海入宋抵明州當寧宗嘉定十六年也首登天童見無際派和尚既而遊雙徑禮浙翁琰又謁宗月月堂無象諸大老莫不機契將理歸楫有耆德勉之曰當今宗門具大眼目者莫如長翁淨和尚現應詔住天童子盍往見之師如教即造天童一見歡若平昔師乃啓曰道元自幼在本國發菩提心參諸知識翻閲經論徒滯名相不明大法後入大宋見諸尊宿獲聞臨濟之宗今得造法席誠多生之幸願和尚慈悲聽道元不時入室咨問法要蓋生死事大時不待人也淨憐其誠欣然許之師於是晝夜精勤脅不沾席者將及兩載一夜淨巡堂見僧打睡責之曰參禪要身心脫落何得只管打睡師從旁聞之當下身心脫落廓然契悟天明入方丈燒香淨曰子作麼生師曰身心脫落淨曰身心脫落脫落身心師曰這個是暫時岐路和尚莫亂印某甲淨曰我不亂印師曰如何是和尚不亂印底淨曰脫落身心師於言下釋然得大無礙由是服勤四載盡得洞上之道於是告歸淨付以伽黎頂相囑其弘揚師既歸首住興聖寶林禪寺德風遠播萬指圍繞其禪林軌則一取法於天童上堂山僧歷盡叢林只是等閒最後見天童先師當下認得眼橫鼻直不被人瞞便乃空手還鄉總無一毫佛法只是任運過時日日日東出夜夜月沈西畢竟如何良久云三年逢一閏雞向五更啼上堂身心脫落聲色俱非箇中無悟何處著迷座中誰是江南客聽取鷓鴣聲外詞上堂興聖久不為衆說話佛殿僧堂溪聲樹影總為諸人說了也諸人聞得也未若道聞得說個甚麼若道不聞辜負自己雲州太守義重公創永平道場請師居之當開堂日有山神出現因號其山曰吉祥副元帥時賴平公從師受菩薩大戒執弟子禮甚恭緇素弟子得戒者遍於東國後嵯峩帝賜以椹服徽號師奉之高閣未嘗掛體一日示微疾辭衆書偈坐化荼維獲舍利無算即塔於永平閲世五十有四坐四十一夏所著有正法眼藏叢林清規學道用心集並語録共若干卷流行於世景定間無外遠和尚嘗為序其語録靈隱退耕寧淨慈虗堂愚二老俱為題跋嗣法弟子慧弉僧海詮慧凡三人師在日國為洞宗始祖今三十六州界內禪剎凡稱洞下雲仍者莫不事其香火禮其靈塔猗歟盛哉道元禪師得法天童淨祖為日國洞宗始祖續傳燈失載近有逆流禪德是其宗裔特作書以師道行文附商舶寄示所載悟由法語甚詳書中又引宋文憲護法録贈日本範堂儀公藏主文中覺阿之嗣佛海遠道元之承天童淨二語為證余於是知古今得道散處於此界他方或出或處名德不表彰於世如道元禪師者何限余於是重有感焉乃特採文立傳列於先師繼燈録天童淨祖嗣下庶不沒古德幽光亦使讀者有所考鏡云住福州鼓山涌泉禪寺道霈謹識青原下十八世鹿門覺禪師法嗣青州普照寺一辨禪師精究內典貫通旨趣及參鹿門得言外旨出住青州普照遷東都萬壽當是時燕秦齊晉之間入是宗者皆其後學室中設百問以勘驗學者嘗作四賓主頌賓中賓曰天涯奔走幾經春負學論功日轉貧行海淵深須遍涉義天空闊不容塵賓中主曰衣穿瘦骨露無餘獨鎮寰區暉太初三尺匣中誅劒百囊篋裡薦賢書主中賓曰丹墀鞭靜六宮開萬里江山絶點埃脫却襴衫戴席帽聲聲只道那邊來主中主曰重巖幽𨗉鎖烟岑古洞龍吟霧氣深石女唱歸紅𦦨裡木人運步絶知音直翁舉禪師法嗣明州天童雲外岫禪師郡之昌國衛人逸其氏依直翁得度究明曹洞宗旨盡法源底初住慈溪之石門已而繼竺西坦席遷天童上堂閙市紅塵裡有閙市紅塵裡佛法深山巖崖中有深山巖崖中佛法山僧昨日出城門閙市紅塵裡佛法一時忘却了也行到二十里松雲滿目便見深山巖崖中佛法大衆且道如何是深山巖崖中佛法良久曰白雲淡濘出沒太虗之中青蘿夤緣直上寒松之頂上堂以拂子打圓相曰摩訶衍法離四句絶百非又打一圓相曰禮之用和為貴先王之道斯為美又打一圓相曰摩尼珠人不識如來藏裡親收得諸人還見麼所見不同互有得失天童這裡毋固毋必師一日問無印曰天童今日大死去也汝作麼生救印曰請和尚喫飯師曰天童今日大死去也汝不要相救印曰救他作麼師又曰天童今日大死去也阿誰與我同行印曰和尚先行某甲隨後師呵呵大笑自此師資唱和不爽毫髮若溈山之與寂子也後示寂塔于本山青原下十九世普照辨禪師法嗣磁州大明寶禪師僧問如何是轉功就位師曰用盡钁頭力放下臥清風曰如何是轉位就功師曰不居無影谷曳杖入烟村曰如何是功位齊彰師曰掌上擎日月運照自無私曰如何是功位俱隱師曰石人同木女相邀入海中曰此是今時事如何是那邊事師曰待汝盡却今時即向汝道示衆若論此事如人用針線幸然針針相似忽見人來不覺失却針祇見線這邊尋也不見那邊尋也不見却自曰近處尚不見遠處郍裡得來多時尋不得心煩不好昏悶打睡拽衣就枕方就枕時驀然一劄曰原來祇在這裡唐慈雲十身寺覺禪師普照室中稱為上首普照垂百問以驗學者往來憧憧鮮有契其機者惟師所答有同水乳略舉七則以見其槩問曰聲前薦得落在今時句後承當迷頭認影作麼生是空劫已前自己師曰夜半石人無影像縱橫誰辨往來源問不見一法猶是半提作麼生是全提底道理師曰石馬驟千山問喫飯忘其饑力充忘其飽作麼生是力充底人師曰巨靈擡手無多子分破華山千萬重問直得不恁麼來者猶是兒孫事如何是向上人師曰半夜烏雞雪裡啼問行玄體妙落在今時究理窮源關山萬里祇如未知有底人如何趨向師曰牀窄先臥問迷時千卷少悟後一言多且道悟了底人如何履踐師曰出不由戶坐不當堂問岸如欲止先停棹車若不行須打牛如今打牛也車行也未師曰下載清風付與誰天童岫禪師法嗣明州雪竇無印大證禪師饒州鄱陽史氏子幼頴異依州之昌國寺剃落受具出遊謁荊石琰於圓通機語不契時思菴睿居閒房師日親煅煉聞雲外唱道天童師往依之一日入室機語相契遂蒙付囑語見雲外章至正九年主雪竇上堂千說萬說不若覿面一見昨日二十九今朝七月一報你參玄人光陰如箭疾娘生兩隻眼個個黑如漆急急急回頭看取天真佛良久曰是何面目下座巡堂喫茶上堂妙不妙衲僧鼻孔多無竅玄不玄剎竿頭上無青天志士寧容袖手良馬豈待揮鞭全超棒喝不落蹄筌百鳥不來春又過巖房贏得日高眠居四年退居定水之圓明菴明年示寂闍維建塔于菴後青原下二十世大明寶禪師法嗣太原府王山體禪師侍大明戮力十年躬為侍者祕重深嚴不見參學一日抽單罔不疑怪或問大明侍者何往明曰諸方來諸方去何介意哉又問參學何似明曰道有參學栽他頭角道無參學減他威光衆方知已蒙印記久隱西山太原府府運兩衙請住王山創建禪席師嘗發明洞上宗旨曰既有尊貴之位須明尊貴底人須知尊貴底人不處尊貴之位方明尊貴不落階級五位頌曰正中偏夜深古殿鎖輕烟寂寂苔封臣不立密密光輝未兆前偏中正玉人不覩臨臺鏡子夜星河霧氣濃依舊青山不露頂正中來木人擕杖火中回趂起泥牛耕練色放教石馬步蒼苔偏中至轉側相逢全意氣交揮終不犯鋒鋩大用縱橫無變異兼中到明暗盡時光不照石女有智妙難窮解栽絶頂無根草五位中第四位古來俱用兼中至後洪覺範不達此旨謬改為偏中至然洞下實未有依之者如天童覺淨慈暉等皆用兼中至載之會元及諸書者可見逮宋末天童淨公一生不說稟承至臨終始拈香嗣雪竇考其說法雖有悟門但任意發揮而宗旨全失矣故鹿門嗣天童作五位頌始用偏中至此後相承五代各有頌惟王山所作為當然仍用偏中至則是襲鹿門之誤而不能知者也仁山恆禪師久侍大明遂升堂奧明付以衣法師曰某甲不是恁麼人明曰不是恁麼人自不殃及伊師以法乳情深俯仰而受明囑曰汝既如是第一不得容易出世若躁進輕脫中間必有坎坷青原下二十一世王山體禪師法嗣磁州大明雪巖滿禪師初參普照照曰兄弟年俊正宜勉力叩參老僧當年念念常以佛法為事師避席進曰和尚而今如何也照曰如生冤家相似師曰若不得此語幾乎枉行千里照下禪床握師手曰作家那師與勝默同參嘗跪受呵斥或問其故師曰今諸方或有師資法屬諍訟招譏師子身中蟲自食其肉不可不重誡也後參王山發明心印接踵住持上堂舉洞山曰秋初夏末兄弟或東去西去直須向萬里無寸草處去良久曰祇如萬里無寸草處又作麼生去石霜曰出門便是草太陽曰直饒不出門亦是草漫漫地師曰三個老漢雖然異口同音未免撞頭磕額何也一人大開口了合不得一人高擡腳了放不下一人緊閉門了出不去王山即不然遍十方界非外全在一微塵一微塵非內全遍十方界祇這一微塵許也須及盡不可得向那裏安門甚處入草還會麼休侵洞嶺初秋草請看疏山臘月蓮勝默光禪師嘗頌九峰不肯首座曰元座徒亡一炷烟九峰不是抑高賢若將一色為承紹辜負先師不借緣示衆舉麻谷振錫話師曰是無可是非無真非是非無主萬善同歸梟雞晝夜徒自支離我無三寸鱉得喚龜迦葉不肯一任攢眉青原下二十二世雪巖滿禪師法嗣燕京報恩寺萬松行秀禪師河內之解人姓蔡氏出家於邢州淨土寺禮贇公為師後受具戒挑囊距燕歷潭過慶壽參勝默老人教看長沙轉自己歸山河大地話半載全無由入默曰我只願你遲會一日有省復看玄沙未徹語請益雪巖於磁之大明才草七日不覺伎倆已盡留入記室語言相契徑付衣偈尋歸淨土搆萬松軒以自適寺內尊宿敦請住持次住中都萬壽寺小參昔有跨驢人問衆僧何𨓏僧曰道場去人曰何處不是道場僧以拳歐之曰這漢沒道理向道場裏跨驢不下其人無語師曰人人盡道這漢有頭無尾殊不知却是這僧前言不副後語汝既知舉足下足皆是道場何不悟跨驢跨馬無非佛事金章宗皇帝明昌四年即南宋光宗紹熙四年也詔師於禁庭升座帝親迎禮聞未聞法開悟感慨親奉錦綺大僧伽衣內宮貴戚羅拜拱跪各施珍愛承安二年丁巳詔師住大都之仰山棲隱禪寺上堂說偈曰蓮宮特作梵宮修聖境還須聖駕遊雨過水澄禽泛子霞明山靜錦蒙頭成湯也展天網呂望稀埀浸月鈎試問風光甚時節黃金世界桂花秋師問僧洞山道龍吟枯木異響難聞如何是異響曰不會師曰善解龍吟問諸佛不出世為甚麼却向王宮生師曰青天常舉足曰亦無有涅槃為甚麼却向雙林滅師曰白日不移輪問撒手那邊底人為甚麼不居正位師曰大功不宰曰回頭這畔底人為甚麼不墮偏方師曰至化無為問向道莫去歸來背父如何得不背父去師曰切忌回頭問心心放下難如何是放下底人師曰擔取去問是處是慈氏無門無善財為甚麼道琉璃殿上無知識師曰拆殿了來相見遷住報恩晚退居從容菴示衆機輪轉處智眼猶迷寶鏡開時纖塵不度開拳不落地應物善知時兩刃相逢時如何回互示衆去即留住住即遣去不去不住渠無國土何處逢渠在在處處且道是甚麼物得恁麼奇特示衆動則埋身千丈不動則當處生苗直須兩頭撒開中間放下更買草鞋行腳始得示衆踢翻滄海大地塵飛喝散白雲虗空粉碎嚴提正令猶是半提大用全彰如何施設示衆向上一機鶴冲霄漢當陽一路鷂過新羅直饒眼似流星未免口如匾擔且道是何宗旨嘗發明洞上宗旨曰睦州云裂開也在我揑聚也在我問裂開便提起一絡索問揑聚便斂手而坐雖然收放自如大似被他使喚洞山斥為話作兩橛缺針斷線不見道恁麼道則易相續也大難直須當存而正泯在卷而彌舒鈎鎖連環謂之血脈不斷又曰藥山一宗實難紹舉雲巖掃地塵埃亘天洛浦服膺稱冤不已好在無舌人解語無手人行棒直饒棒喝交馳只得傍提一半師於周孔老莊百家之學無不博通三閲藏教恆業華嚴得法者一百二十人壽八十一塔在燕京城內乾西橋北青原下二十三世報恩秀禪師法嗣西京少室雪庭福裕禪師太原文水張氏子師五齡解語日了千言鄉里有聖小兒之稱未幾適遭世難喪失天倫㷀然無依道逢一老比丘誘師出家學佛曰汝能誦得一卷法華經則一生事畢師曰佛法止此而休莫亦更有向上底在否比丘異之遂偕謁休林古佛於仙巖曰此子龍象種也得奉巾瓶於左右他日必成大器古佛欣納之乃為祝髮受具遂與雙溪廣公同執務者七年時萬松住燕之報恩師不通介紹輒獨掉臂以往松一見便奇之親炙十年深得其髓自是名益著從之者日益廣值壬辰之變少林祖剎荒蕪上以師補之尋承萬松海雲重以尺牘見招遂應少林之命世祖潛邸命師作大資戒會戊申詔住和林興國未期月憲宗召詣帳殿奏對稱旨俾總領釋教復僧尼廢寺計二百三十有六區庚申世祖即祚因論辨僞經馳驛以聞火其書仍賜光宗正辨之號命即故里創建精舍曰報恩給田若物以飯僧時萬壽祖席無可當之者衆復請師主之僧問如何是向上尊貴一路師曰漁歌驚起沙汀鷺飛出蘆花不見踪問遍界不曾藏雪峰答何處不是石霜因甚不契師曰從來孝子諱爺名僧參師問甚處人曰青州師曰識得趙州布衫否曰趙州布衫近被人裂破了也師曰因甚裂破曰風流不在著衣多師便打曰因甚打某甲師曰咄風流在甚麼處師問僧道源不遠性海非遙且道在甚麼處僧擬議師便喝後師既老倦於接納歸棲嵩陽乙亥秋七月二十日示微疾書偈告終俗壽七十三臘五十二塔于寺之西隅燕京報恩林泉從倫禪師初住萬壽上堂禪禪非正非偏無意路有玄淵超今邁古絶後光先但能忘影迹何必守蹄筌直指人心見性須憑祖意通玄九年面壁真消息端的其中有祕傳元世祖皇帝至元九年詔入內殿從容問辨抵暮而退帝大悅示衆北斗似杓南斗似瓢任伊酙酌暖日凉飈冬至寒食一百五須知節氣不相饒到此莫有解吞吐者麼僧問法眼道我二十年只作境話會既不作境會合作麼生會師曰猿抱子歸青嶂後鳥銜花落碧岩前示衆若論此事如丹鳳衝霄不留其跡其由性空寥廓慧日精明照五蘊之皆空使萬緣之俱泯直得星攢碧落月侵丹墀翡翠簾垂燭香人靜當此之際那容喘息寧許窺窬密室不通風玄門難措足雖然如是一點靈明通宇宙那拘西竺與曹溪至元十八年十月二十日聖旨就大都憫忠寺焚燒道藏僞經除道德經外盡行燒命師下火師升座云憶昔當年明帝時曾憑烈焰辨妍𡟎大元天子續洪範顯正摧邪誰不知嗟彼道教陰蠧佛書自古至今造訛捏僞益竊釋經言句圖謀貝葉題名謗毀如來贓誣先聖無蒂狂談實難遍舉始自張陵杜撰不遵老氏玄言謬作醮書兼集靈寶詐道從空而得妄言太上親傳用三張鬼法以誑惑愚夫設五運神符而魘奸匹婦葛孝先徒搜要妙陶洪景謾述浮辭杜光庭白拈丐偷劫賊無異陸修靜外好裡惡說客何殊寇謙之口舌瀾翻損他利己林靈素機謀諂詐敗國亡家嗚呼悲法琳不遇而遭貶嗟道世雖再而難為致令釋子傷心幸得皇天開眼恭惟我大元皇帝陛下闢邪歸正去僞存真恐衆生永墮迷津令萬姓咸登覺路遂以火炬打一圓相曰諸仁者只如三洞靈文還能證此火光三昧也無若也於斯會得家有北斗經枉教人口不安寧其或未然從此灰飛烟滅後任伊到處覔天尊急著眼看從寬禪師臨終問其次兄曰佛祖父母我今一箭射殺二哥以為何如隨整襟坐脫上都華嚴寺全一至溫禪師邢州郝氏子幼聰敏異常兒六歲祝髮參萬松博記多聞論辨無礙松命為侍者凡松偈頌法語一聞輒了遂得法焉常以侍者代應對機鋒不可犯太保劉秉忠薦師大可用世祖召見與語大悅留王庭多有贊益居三歲放還錫號佛國普安大禪師至元丁卯五月示疾右脅而逝異香三日茶毗舍利無數丞相移剌真卿居士字楚材本姓耶律及金滅遼公歸金改姓移剌初公在京師見禪伯甚多唯獨重聖安澄和尚常訪以祖道屢以古昔尊宿語録中所得者叩之聖安間有許可公自以為得及遭憂患以來功名之心束於高閣求祖道愈急遂再以前事訪諸聖安聖安翻案不然所見公甚惑焉聖安從容謂曰昔公居要地又儒者多不諦信佛書惟搜摘語緣以資談柄故豫不敢苦口鉗錘耳今揣公之心果為本分事以問豫豫豈得猶襲前𠎝不為苦口乎豫老矣有萬松老人者儒釋兼備宗說俱通辨才無礙公可見之既參萬松杜絶人跡屏斥家務雖祁寒溽暑無日不參焚膏繼晷廢𥨊忘餐者幾三年乃獲印證號湛然居士其序評古略曰佛祖諸師埋根千丈機緣百則見世生苗天童不合抽枝萬松那堪引蔓湛然向枝蔓上更添芒索穿過尋香逐氣者鼻孔絆倒行玄體妙的腳跟向去若要腳跟點地鼻孔撩天也須向這葛藤裏穿過始得先是元世主將西征有司奏五臺等處僧徒有能呪術武略及有膂力者可為部兵扈從西征公止之曰釋氏之高行者必守不殺戒奉慈忍行故有危身不證鵝珠守死不拔生草者法王法令拳拳奉行雖死不犯用之從兵豈其宜哉其不循法律者必無志行在彼既違佛旨在此豈忠王事故皆不可以從王師也帝從之太宗十六年公卒壽五十五即南宋淳祐三年也青原下二十四世少室裕禪師法嗣西京少室靈隱文泰禪師里族未詳師頴悟過人篤好宗乘從少室遊未幾即悟心要故當時稱二泰一肅為雪庭之高弟者師其一也上堂塵劫來事只在于今河沙妙德總在心源試教伊覿面相呈便不解當風拈出且道過在甚麼處卓拄杖曰祇為分明極翻令所得遲太原府報恩寺中林智泰禪師汾陽魚城溫氏子剷髮於華嚴喟然嘆曰大丈夫當體究大事焉能區區於此耶時雪庭主萬壽師往依數載契悟超絶朝廷嚮師之名宣住報恩僧問如何是萬里無寸草處師曰不是闍黎踐履之境曰如何是出門便是草師曰才動即乖曰如何是不出門亦是草漫漫地師曰住著即錯曰如何得不涉動靜去師曰遍界絶紅塵通身無影像一日示疾集衆告誡書偈而逝泰安州靈巖足菴淨肅禪師保定金臺永平人族張氏禮香山壽聖為師參請一十餘年所遇知識十有餘輩最後參雪庭于萬壽淘汰有年付以衣偈初主萬壽次少室靈巖上堂白露橫江黃花滿圃砧聲敲夜月蛩語泣秋風蟬噪岸邊之樹葉辭檻外之柯色色現海印三昧聲聲轉根本法輪諸人若能于斯會得則如面對鏡眉目分明方可喚作半個衲僧猶有俗氣未除若能打破鏡來便好與你相見祇如相見後又作麼生更有三十棒且待別時來後退居香山一日集衆告辭右脅而化青原下二十五世少室泰禪師法嗣西京寶應還源福遇禪師霍州靈石王氏子依邑之兜率剃落遍遊講肆雄辨如流景聆靈隱禪師道眼圓明投誠參究一日聞隱上堂舉切忌從他覔迢迢與我疏語師頓領悟即承印可初住天慶次寶應僧問如何是祖師西來的的大意師曰風送泉聲來枕畔月移花影到窗前問如何是誕生王子師曰雖有尊貴分不是尊貴人曰如何是朝生王子師曰雖登金榜貴終是老朝臣曰如何是末生王子師曰歷盡艱辛後方得覲堯天曰如何是化生王子師曰與父無異體權操閫外機曰如何是內生王子師曰長在深宮內咫尺近龍顏曰向上一路請師指示師曰無絃琴有韻人天那得聞皇慶癸丑十月終壽六十九臘四十九靈巖肅禪師法嗣西京寶應月岩永達禪師汾陽劉氏子下髮於本州天寧寺每以生死自䇿勵南詢聞靈岩法雷遠震遙餐風德趼足往參一見器之親炙積久遂入閫奧乃曰發證由師行之在己遂之安泰州閉關久之道俗堅請住寶應不得已而起上堂鹿門老人道盡大地是學人一卷經盡乾坤是學人一隻眼以如是眼看如是經千萬億劫無有間斷後萬松老人直得計窮力盡道個看讀不易諸人還看讀得麼須知這一卷經阿誰不具這一隻眼誰人不圓要長則千萬億劫難盡要短則一剎那頃便周寶應今日不惜眉毛為諸人指出乃彈指一下曰看讀了也諸人切莫錯過良久擊拂子曰自是不歸歸便得五湖煙景有誰爭一日示疾泊然而逝封龍山古巖普就禪師生滹陽劉氏族十五往禪慶出家參靈巖巖以本分鉗錘重加煆煉疑情𪹼然頓落大德六年月菴海禪師退席本寺具疏請師開堂朝旨賜妙嚴弘法大禪師俄封龍堅請師勉受之僧問如何是䫫墮師曰不是披毛戴角底曰如何是隨墮師曰不是聞聲見色底曰如何是尊貴墮師曰不是斷聲色底曰恁麼則如何有墮名師曰雁過長空影沉寒水曰古人道三墮是了事人病既是了事人如何有病師曰祇為了事所以病生曰此病何時得愈師曰直待無身此病即除因示頌曰金鎖重重早豁開三處悠然獨往來雁過長空無繫著影沉寒水任渠猜後歸隱靈栖未幾示寂世壽七十有七青原下二十六世寶應遇禪師法嗣鄧州香嚴淳拙文才禪師平陽臨汾姚氏子生有異質見僧則合掌作禮不䫫常兒長依絳明福嚴普公出家嘗讀證道歌至幻化空身即法身之句欣然契悟乃謁還源禪師呈所解源可之閲藏於龍門山三載泰定甲子住少室尋隱香嚴詮釋般若心經并華嚴法界觀僧問如何是理法界師曰虗空撲落地粉碎不成文曰如何是事法界師曰到來家蕩盡免作屋中愚曰如何是事理無礙法界師曰三冬枯木秀九夏雪花飛曰如何是事事無礙法界師曰清風伴明月野老笑相親至正壬辰五月十七日沐浴更衣呼門徒申教誡且曰吾死無事虗費火已揚灰可也翌日吉祥而逝葬全身於雪庭塔右春秋八十靈巖潔禪師法嗣金陵天界寺雪軒道成禪師雲州趙大王之遠孫父徙居保定遂家焉年十五出家郡之興國寺師廣顙平額氣象雄偉有大志受具已結三人為侶在青州土窟中密究單傳之旨忽有老人貌甚奇古謂曰汝三人忘苦辛甘淡泊究明向上大事他日必作法門棟梁去也師叱之曰既作棟梁居土窟之中老人曰未有常行而不住未有常住而不行言訖而隱師益自勵密聞秋江潔公大弘曹洞之旨於靈巖遂往禮謁潔問何處來師曰青州來潔曰帶得青州布衫來麼師曰呈似和尚了也潔曰參堂去久之平昔疑情一旦氷釋徑造丈室潔曰金鎖玄關打開也未師曰千年桃核裏覔甚舊時仁潔頷之囑曰是汝本有之事善自護持他日能弘吾道者必汝也師回青州衆請住東萊大澤山次住普照洪武十五年天下郡縣開立僧司統領釋教師應選道契親王殿下睿眷尤隆三十年秋八月上召師至殿命住天界師奏不會佛法上製詩一首鐫於金榜懸諸法堂曰不答來辭許默然西歸隻履舊單傳鼓鐘朔望空王殿示座從前數歲年上堂白雲萬頃卷舒露劫外真機紅葉千峰燦爛顯個中妙旨亙古今而不昧經塵劫以常存鳥道虗通運步玄關綿密獅絃錯落按指古韻鏗鏘直得石女點頭木人拍手拈起金針玉線穿過機先截來兔角龜毛發明向上正偏獨露隱顯全該所以物物頭頭塵塵剎剎未有一絲毫缺少大衆還會麼夜來木馬雲中過驚起南辰北斗藏是年十月勑就寺建普度大齊三晝夜上躬率百僚行祭獻禮已幸丈室從容顧問賜寶鈔若干錠上堂陰極陽回化日長梅花處處噴清香個中消息無多子遍界何曾有覆藏如是明明兼帶百草頭邊相逢密密宣揚萬象光中獨露利名場上薦取無位真人人我山中顯示本來面目影含宗鑑心生則種種法生身是道場心滅則種種法滅石女高提寶印文彩全彰木人暗度金梭絲毫不昧牽動劫外機輪烜赫寰中日月潛通遐邇直得枯木生花該括古今解使寒灰發焰雲籠古路依依野色還迷月滿寒巖皎皎神光遍照六門機息何須宛轉旁參一色功圓切忌當頭印破白牛運步已蒙建化之緣玉馬嘶風總是利生邊事且道如何是向上事咄兔角杖挑潭底月龜毛拂挂嶺頭雲上堂三陽交泰萬物咸新顯一真之妙用總造化之淵源塵塵合道處處通津法筵大啓覺苑弘開國運與佛運齊興皇風與宗風並扇只如道舊歲已去新歲到來未審去從向去來自何來如斯評論轉見誵訛敢問大衆衲衣下一著子還有增添去來也無於斯會得便見臘盡陽和無影樹春回花發不萌枝上堂五月榴花照眼明薰風啼鳥遍巖扃機先一著無玄妙切忌當人認色聲記得夾山會禪師示衆曰目前無法意在目前不是目前法非耳目之所到天童覺曰夾山老子解開布袋將差珍異寶撒向諸人面前了也正當恁麼時又作麼生路不拾遺君子稱美大衆據此夾山天童二老師見處一一檢點將來總成漏逗鳳山分上則不然若是色見聲求即非家珍了知目前無一法頭頭物物總相應其或未然更聽末後一句道泰不傳天子令時清休唱太平歌三十五年七月太宗文皇帝嗣登寶位奉使日本國往宣聖化二年回與同使官僚備奏皇情大悅恩寵之隆有加四年以僚佐譖繫於囹圄百餘日師坦然無慮上知其非罪宥之六年春奉旨就鍾山建普度大齊命師說法聽者數萬人十一年赴北京朝賀奉旨於慶壽建齊賜賚尤加宣德三年師年七十六表辭歸山宣宗章皇帝憫其誠遣內官護送南還天界寺西菴養老七年臘月八日示微疾辭衆說偈趺坐而逝上遣官致祭有文春秋八十一僧臘六十有五闍維之日烟焰五色仙鶴翔空異香縹眇官貴四衆萬餘人咸歎希有火後收舍利圓紅者無算建塔于應天府安德門外勑賜塔所為鷲峰禪寺封龍就禪師法嗣西京天慶寺息菴義讓禪師真定李氏子丱歲剃落通參宗匠末後往封龍山扣古巖之室巖深器之至治二年開堂天慶次遷熊耳之通相泰山之靈巖洛之嵩少僧問無功之功還有偏正否師曰偏正歷然曰如何是無功底偏正師曰石牛吐出三春霧靈鳥不棲無影林問如何是直指人心師曰舌在口裏曰如何是見性成佛師曰金屑雖貴落眼成塵曰如何是莫向言中取則師曰道火何曾燒著口曰如何是句外明宗師便打曰因甚便打某甲師曰你要我句內明宗麼庚辰夏遘疾乃命門人曰斯疾不可起也吾往必矣至五月十一日付後事書偈曰來時本靜去亦圓周虗空作舞任意優遊右脅而化青原下二十七世少室才禪師法嗣南陽府萬安寺松庭子嚴禪師河南之古緱氏縣樊姓幼多疾病父母憐之許以從釋禮齊雲於少林十八受具師聰敏過人博通內外典凡詩文之類不學而能援筆立就碩師巨儒無不以法器期之初參江月照次參息菴讓蒙示禪要有所警發後參淳拙禪師拙以寶鏡三昧反覆徵辨大豁疑礙拙曰荷擔大法盡在子躬遂付以衣法有五乳峯頭獅子子光前耀後自超群之句時南陽府萬安虗席延師主之明洪武二年己酉主少林力田給衆偈曰亂後歸來自耨耘生涯辛苦與誰論晝拈塊石驅山鳥夜坐巢菴逐野豚腸斷秋風頻擊柝目窺夜月暗銷魂近來始識農夫苦一飯仍思施主恩僧問地藏栽禾博飯與和尚是同是別師曰欄干雖共倚山色不同觀曰百丈開田說義但展兩手意旨如何師曰雖然無語其聲如雷曰和尚又作麼生師曰晝拈塊土驅山鳥夜坐巢菴逐野豚問巖頭參洞山不肯洞山嗣德山不肯德山巖頭有甚長處師曰若肯二師則孤負二師去也曰他道洞山古佛只是無光是若何師曰渠却有光不是古佛問和尚升座秦封槐因甚不來聽法師曰疑情早已斷何須更見人十三年冬周王殿下敬為國母慈孝皇后資悼冥福命師升座說法賜僧伽黎以旌異之後退老閒居示寂未詳靈谷謙禪師法嗣祖派圖以師嗣清遠渭者非是蓋錯以報國謙為靈谷謙也南京靈谷潔菴正映禪師撫州金溪洪氏子幼入安仁三峰為沙彌洪武十九年試經得度謁靈谷巽中謙禪師方入門懷中香忽墮地遂有省謙命領維那謙沒往天界參雪軒軒命典藏會有旨云泉州開元寺僧臨難選的當人住持乃鬮選而出及引見帝曰著你去做住持如今做住持難善則欺侮你惡則毀謗你但清心潔己長久欽此師奉勑來院洪武三十一年六月開堂僧問法筵肇啓四衆具瞻皇恩佛恩如何普報師曰甘露泉開流大地曰報恩一句蒙師指西來祖意若為宣師曰庭前石塔聳寒空曰遍界不曾藏師曰汝見個甚麼曰某甲終不敢自瞞師曰切莫眼花又僧問如何是和尚為人一句師曰兔角杖挑天上月龜毛拂散海濵雲曰恁麼則龍天胥慶僧俗歸仁去也師曰且合取口僧禮拜師乃曰山僧蒙恩點住此剎親蒙天語丁寧付以清心潔己四字此是傳佛心印亦是鎮海明珠山僧既已頂戴南來亦要普施大衆大衆須知世法佛法落霞與孤鶩齊飛古佛今佛秋水共長天一色天心罔測山益高而海益深聖語難窮天普蓋而地普載大衆作麼生會聖意去莫是不染世塵麼莫是不貪法味麼莫是不飲無為酒不坐涅槃床麼若恁麼會非則不非是則未是山僧今日不敢久祕未免當堂指出去也木人舞出法堂前一任炎天飛白雪師居數載百廢俱修永樂元年朝京回福州諸山舉住雪峰雪峰屋老敝已甚不堪仍舊師一舉而新之人咸以為應雪峰再來之讖洪熙元年得旨住持靈谷宣德元年擢僧録司左講經卒于靈谷有語録名古鏡三昧行于世天慶讓禪師法嗣陝州熊耳山嵩溪子定禪師偃師馬氏子七歲禮古巖祝髮逮巖遷化往參息菴菴命主藏因白事次言下豁然大悟出世熊耳山小參宗門中事號曰單傳一心之外更無餘法只為此土衆生好在言句中著到甘在道理中埋殺于一心之法轉增迷悶所以初祖西來打破舊日窠臼闢開別樣乾坤非是好奇立異祇是見病與藥非為得已如初祖一到少林三緘其口九年面壁坐斷一切枝葉單提向上巴鼻任你窺伺無門鑽研不入者裏不可以有言會不可以無言會不可向格內通不可向格外通直須忘情泯見方可得其心髓既得其心髓則諸佛之法印列祖之命脉無出于此按一指而地轉天旋行一令而山崩海竭又安用割截虗空巧立門庭隨波逐浪別生枝節哉今日許多禪和不知務本只尋枝摘葉過日不知有甚用處如洞山玉線金針大似花前弄影臨濟三玄三要無非醉後添杯諸人還看得破麼良久曰夜靜水寒魚不食滿船空載月明歸一日示疾謂門弟子曰吾世緣已畢順化時至矣末後一句聽吾分付遂默然入寂青原下二十八世萬安嚴禪師法嗣嵩山少室凝然了改禪師鍾秀於嵩陽金店之茂族自齠齓年繫念空宗知有己躬下事遂依止少林二十始納僧服初參月印於香山涉歷寒暑鮮克契入會松庭禪師住天慶師往依之每以己事咨叩一日庭上堂曰一言逈脫獨拔當時師當下釋然舉似庭庭印之歸隱二祖菴洪武二十三年請主少室上堂祖師心印不是有言不是無言不是有知不是無知豈可向言句下研窮意識中揣度哉昔日祖師初來販得久遠滯貨無人承當只得九年面壁後來二祖却似癡猿捉月來問安心這老漢也是憐兒不覺醜向他道將心來與汝安二祖便爾承虗接響喚作得髓看來也好與三十棒何故才動唇吻便隔千山諸人還會麼咄山僧今日恁麼道也好與三十棒永樂十九年無恙忽召衆敘別說偈而逝青原下二十九世少室改禪師法嗣嵩山少室俱空契斌禪師平陽坦曲人參凝然求示心要朝夕咨扣一日覩秦封槐豁然契悟徑回侍次然一見謂曰契斌參得禪也師便喝然曰喝作麼師曰和尚何得以贓誣人然曰趙州勘破婆子婆子敗缺在甚麼處師曰一對無孔鐵鎚然曰如何是趙州意師曰荊棘林中重加陷穽然曰石頭書亦不通信亦不達是何意旨師曰千里同風然曰青原垂足又作麼生師曰禍事禍事然曰洞上一宗密在爾躬矣景泰四年主少室僧問如何是空劫已前事師曰烏龜向火問如何是正中偏師曰夜半烏雞帶雪眠曰如何是偏中正師曰老翁抱著石烏龜曰如何是正中來師曰出匣吹毛寒逼天曰如何是兼中至師曰公孫舞劒難思議曰如何是兼中到師曰黑狗銀蹄無處討曰五位既蒙師指示少林直指事如何師曰沙裏無油麥中是麵
