body:
  text: 鼓山嗣祖沙門元贒輯臨濟宗南嶽下二十一世萬壽仁禪師法嗣杭州徑山南石文琇禪師蘇之崑山李氏子出家邑之紹隆院甞問法要於虎丘行中禪師得言外旨洪武五年住蘇州普門開堂日僧問世尊出世天雨四花和尚出世有何祥瑞師曰一牛飲水五馬不嘶曰恁麼則熈怡的旨傳千古寂照宗風播四方師曰好事不如無遷靈巖上堂正法眼藏亘古亘今般若真燈照天照地當陽無向背直下絕承當靈然獨露透色透聲廓爾現前絕聞絕見常在一切處不為一切處所拘非離一切時不為一切時所攝者裡見得無迷無悟非後非先百千法門無量妙義不假思惟悉皆具足建化法中斯為可矣若是衲僧門下直須向百尺竿頭濶步蟭螟裏裏藏身娑婆擲去他方妙喜拈來此土不知承甚麼恩力得恁麼奇特良久曰慣從五鳳樓前過手握金鞭賀太平未幾退隱吳松之上永樂初詔天下儒釋道流之深通文義者纂脩永樂大典師應詔而起留京三載七年夏住徑山上堂森羅及萬象一法之所印前面是鉢盂峯中間是佛殿喚甚麼作一法良久曰國一祖師元是崑山人越四載師以老病退歸於蘇之北山松院一日無疾而逝徑山銘禪師法嗣嘉興府天寧西白力金禪師吳都姚氏子幼依寶積院祝髮初謁古鼎鼎示以德山見龍潭話從而有契俾掌記室未幾命首眾分座說法至正丁酉出住瑞光會天寧寺災師為起廢帝師授以圓通普濟之號師自幼喪父惟有母存乃去城東一舍築孤雲菴以奉養焉或譏之師呵曰你不見編蒲陳尊宿乎何言之易易也洪武初遷淨慈四年春詔住天界見皇上于外朝慰勞再三恩意優渥即令內官送入院繼復召入內庭奏對稱旨上大悅是春詔建廣薦法會于鍾山命師總持齋事五年復建大會大駕幸臨命師闡揚第一義諦自公侯以下環而聽之靡不悅服一日忽示弟子曰吾有宿因未了必當酬之汝等勿以世相逼我未幾示微疾委順而化茶毗舍利無數塔于嘉興城西環翠蘭若龍翔訢禪師法嗣南京天界覺原慧曇禪師天台楊氏子母夢吞明珠而娠及生容貌嶷然幼不與群童狎長依越之法果寺出家尋受具戒初習教華嚴止觀無不貫練尋棄去入禪時笑隱唱道於中天竺師往造焉隱問何處來師曰遊山來隱曰笠子下拶破洛浦遍參底作麼生師曰未入門時呈似了也隱曰即今因甚不拈出師擬議隱便喝師當下脫然有省他日隱展兩手示師曰八字打開了也因甚不肎承當師曰休來鈍置隱曰近前來為汝說師即掩耳而出隱頷之命侍香尋掌藏于龍翔至順二年初住牛首之祖堂遷石城清凉保寧蔣山勅改龍翔為天界詔師住持特授演梵善世利國崇教大禪師上堂一句子黑漆黑無把柄有準則良久曰會麼碓搗東南磨推西北上堂少室峰前曹溪門下燈燈相繼的的相傳自古自今絲毫不易且以何為驗樓臺上下火照火車馬往來人看人上堂長者長法身短者短法身即今現前一眾坐立儼然有長有短諸人盡知盡見畢竟阿那個是法身若也會得捧鉢盂向香積世界喫飯若也不會長連床且喫粥喫飯上堂經有經師論有論師龍河放一線道分科列段去也拈拄杖卓一下曰且道是何章句上堂只個現成公案眾中領解者極多錯會者不少所以金鍮不辨玉石不分龍河這裏直要分辨去也張上座李上座一個手臂長一個眼睛大總似今日達磨一宗教甚麼人擔荷噓一聲下座上堂威音王已前彌勒佛已後有個現成公案未敢與汝說破何故心不負人面無慚色示眾春風浩浩春日遲遲黃鸝啼在百花枝個中無限意消息有誰知語未畢有僧出問曰心意識遏捺不住時如何師厲聲曰是誰遏捺室中謂僧曰二六時無汝㗖分無你趣向分會麼僧罔措師曰未明三八九難免自沉吟洪武三年奉使西域至僧伽羅國其王事師於佛山精舍明年九月示寂祔葬辟支佛塔先是彼佛懸記今之開祔適符其言尚書回奏上勅賜遺衣塟於雨花臺之左南京天界寺季潭宗泐禪師台之臨海周氏子始生坐即跏趺人異之八歲從笑隱學佛經書過目成誦十四薙落二十受具一日隱問國師三喚侍者三應於意云何師曰何得刲肉作瘡隱曰將謂汝奇特今故無所得也師一喝隱擬拈棒師拂袖而出元末隱徑山洪武元年出世中竺上堂金剛王劒橫揮千妖屏跡爍迦羅眼洞照萬物潛形到此卷舒在己殺活臨時直得千歲巖申夭𨁝跳錢塘水東流西流諸人還知有也無遂竪拂子曰庭前石笋抽條也會見高枝宿鳳凰洪武四年遷徑山詔致天下高僧有學行者師首應詔至奏對稱旨命住天界五年上建廣薦會于蔣山親行三獻之禮命師撰樂章召集諸幽爽命師為陞座說法十年冬詔師箋釋心經金剛楞伽三經丁巳奉使西域十五年還朝授右街善世復命育髮授以儒職師姑奉命至髮長上召而官之師再辭上乃從之賜師免官說後以胡黨獲譴著住鳳陽槎枒峰十九年取歸越五年以老賜歸渡江至江浦之石佛寺示疾喚侍者曰者個聻者茫然師曰苦遂寂塔于天界訢公之後九江府圓通約之崇裕禪師毗陵陳氏子年十六從壽昌院東林曉公為沙彌具戒後首參元叟端次謁斷崖義皆未有所證入乃往見笑隱隱舉臨濟無位真人話詰之曰你還知麼師不覺下拜隱曰你何所見而作禮師曰拜者非是他人隱曰從門入者不是家珍師曰和尚慎毋欺人隱首肎之留笑隱者十餘年初住南禪次住圓通師重新之不日而成適符旻古佛三百年後大興佛法之讖又遷育王亦起其廢洪武五年秋上建法會于鍾山師應召至便殿問以佛法大意師以偈獻上大悅賜食上前師或假寐鼻息微有聲鄰坐引裾覺之上笑曰此老人無機心誠善知識也後示寂塔于石耳峰笑隱甞稱其戒律嚴潔言行不相背馳惟崇裕一人而已杭州靈隱用貞輔良禪師蘇州吳縣人范文正公十葉孫十五從迎禪院薙髮受具乃曰學佛將以明心心非師無以示肯綮去從北禪澤法師學台教充然若有所契會士瞻杓公勉其更衣入禪指參笑隱隱一見噐之問答之際棒喝兼施剎那之頃凡情頓喪他日隱再有所問師發言愈厲隱笑曰得則得矣終居第二義也久之乃契心宗尋往四明育王參石室瑛縱橫叩擊石室極推譽之出世嘉興之資聖遷越之天章移杭之中竺升靈隱示眾達磨一宗陵夷殆盡汝等用力如救頭然可也然百千法門無量妙義於一毫端可以周知如知之變大地為黃金受之當無所讓否則貽素飡之媿矣歲月流電向上之事汝等急自進修洪武四年正月十有五日手疏衣貲入公帑散交遊及治喪之事顧謂左右曰吾望日巳時逝矣及時索浴端坐入寂杭州靈隱寺清遠懷渭禪師南昌魏氏子笑隱之甥也生而靈芝產於庭槐已而英發誦書不待師授時隱住龍翔聞而喜曰此吾宗千里駒也挽致座下龍翔為東南都會四方名紳俱與隱遊或發天人性命之秘文辭開閤之法師得與聞之學問大進爭歆慕之曰此文中虎也師曰公等謂吾專攻是業耶佛法與世法不相違背故以餘力及之將光潤其宗教爾苟用此相誇豈知我哉一日隱警勵諸徒眾未有對師直前肆言隱振威一喝師氣不少沮往返詰難隱笑曰汝可入吾室矣命為記室隱瀕沒召師曰吾據師位四十餘年接人非不夥能弘大慧之道使不墜者惟汝與宗泐耳汝其懋哉後主會稽之寶相杭之報國湖之道場洪武初年主淨慈應詔入京回退居錢塘之梁渚八年十二月召門弟子囑後事怡然而寂是月之十六日也茶毗有不壞者三曰齒牙曰鉢塞莫曰室利羅塔于梁渚竺田霖禪師法嗣安吉州道場孤峯明德禪師姓朱氏家世明之昌國父與普陀玠公交玠聞鷄聲入道凡說法必鼓翅為鷄號玠亡已久母夢玠來託宿覺而有娠十四月始生在童幼好趺坐問將何求師曰欲學坐禪求作佛爾年十二入金鵞院為僧越五年受具戒慨然有求道之志首謁竺西西問汝從何方來師曰金鵞來西曰金鵞山高多少師曰不見頂西斥之一日西舉世尊拈花因緣師忽若有解造偈以呈西肯之復如淨慈見晦機機問甚麼人恁麼來師曰胡張三黑李四機曰汝從朝至暮著衣喫飯還認得自己否師曰胡張三黑李四機拈棒師拂袖而出往見明極俊公機語契合命入侍司尋主藏會明極往日本師乃抵雪竇值竺田上堂舉隱山泥牛入海話師於是群疑頓釋以所見呈田田曰人天眼目儼然有在後住松江之東禪再遷保寧居一十五載三遷道場升淨慈洪武初謝歸道場竹林菴五年二月示微恙至二十七日入滅仰山欽禪師法嗣杭州西天目高峰原妙禪師蘇之吳江徐氏子十五出家於秀水密印寺初參斷橋次謁雪巖於北㵎懷香請益纔問訊即打出後凡入門便問誰與汝拖者死屍來聲未絕便打出一日覩五祖演和尚真贊曰百年三萬六千日反覆元來是者漢驀然打破拖死屍之疑值雪巖住南明師即往省巖問阿誰與汝拖個死屍到者裏師便喝巖拈棒師把住曰今日打某甲不得巖曰為什打不得師拂袖便出一日巖問日間浩浩時作得主麼師曰作得主曰睡夢中作得主麼師曰作得主曰正睡著時無夢無想無見無聞主在甚麼處師無語巖囑曰從今日去也不要汝學佛學法也不要汝窮古窮今但祗饑來吃飯困來打眠纔眠覺來抖搜精神看我者一覺主人翁畢竟在什處安身立命師遂奮志入龍鬚越五年因僧推枕子墮地作聲廓然大徹次遷雙髻德祐己卯春入西天目之獅子巖即石洞營小室丈許榜曰死關洞非梯莫登撤梯斷緣雖弟子罕得瞻視乃垂三關語以驗學者曰大徹底人本脫生死因甚命根不斷佛祖公案只是一個道理因甚有明與不明大脩行人當遵佛行因甚不守毗尼下語不契遂閉門弗接至元丁未雪巖寄竹篦拂子法語來授由是懷中片香始為拈出上堂拈拄杖召大眾曰還見麼人人眼裏有睛不是瞎漢決定是見以拄杖卓一下曰還聞麼個個耳裏有竅不是死漢決定是聞既見既聞是個什麼以拄杖曰見聞即且置只如六根未具之前聲色未彰之際未聞之聞未見之見正恁麼時畢竟以何為驗以拄杖曰吾今與汝保任斯事終不虗也以拄杖曰三十年後切忌妄通消息靠拄杖下座上堂意句不到宗說不通盲龜跛鱉意句俱到宗說俱通盲龜跛鱉西峯恁麼告報莫有離此之外別有生涯底麼盲龜跛鱉上堂大海無魚大地無草大富無粮大悟無道若人透此四重關非特親見高峯眉毛長短鼻孔淺深猶如赫日當空萬別千差無不照雖然喚作拂子則觸不喚作拂子則背畢竟喚作什麼上堂海底泥牛啣月走岩前石虎抱兒眠鐵蛇鑽入金剛眼崑崙騎象鷺鷥牽此四句內有一句能殺能活能縱能奪若檢點得出許汝一生參學事畢辭眾西峰三十年妄談般若罪犯彌天末後有一句子不敢累及乎人自領去也大眾還知落處麼良久曰毫𨤲有差天地懸隔書偈曰來不入死關去不出死關鐵蛇鑽入海撞倒須彌山泊然而逝塔全身于死關壽五十八臘四十三衡州靈雲鐵牛持定禪師吉安泰和王氏子年三十一歲謁肯菴勤禪師剪髮尋依雪巖居槽廠習杜多行巖示眾曰兄弟做工夫若也七日夜一念無間眼不交睫無個入處斫取老僧頭作舀屎杓師默有所領未幾有痢疾乃持一觸桶就屏處危坐其上單持正念目不交睫經七日夜將半忽覺山河大地草木叢林徧界如雪天明月下堂堂一身乾坤包不得久之如聞擊木聲驚省遍體汗流其病亦愈踊躍自慶不已早詣方丈舉似巖巖舉公案詰之酬答無滯復作偈曰昭昭靈靈是什麼眨得眼來已蹉過廁邊籌子放光明直下元來只是我至元戊寅命為僧又脇不沾席者六年一日巖上堂舉亡僧死了燒了向什麼處去自代曰山河及大地全露法王身師即詣方丈曰適來和尚舉揚般若驚得法堂前石獅子笑舞不已巖曰試道看師曰劫外春風萬物枯山河大地一塵無法身超出如何舉笑倒西天碧眼胡巖敲面前卓子曰山河大地一塵無者個是什麼師作掀倒勢巖笑曰一彩兩賽及入室問曰親切處道將一句來師曰不道巖曰為什麼不道師拈起手中香盒子曰者個得來不直半文錢巖曰多口漢巡堂次師以楮被裹身而睡巖召至方丈厲聲曰我巡堂你打睡若道得即放過汝若道不得趂汝下山師隨口答曰鐵牛無力懶耕田帶索和泥就雪眠大地白雲都葢覆德山無處下金鞭巖曰好個鐵牛也因以為號後住靈雲唱雪巖之道大德壬寅冬書長偈示眾其末曰塵世非久日消月磨桃源一脉三十年後流出一枝無孔笛吹起太平歌明春將示寂侍僧求別眾語師曰吾別久矣恬然坐逝徑山虗谷希陵禪師字西白義烏何氏子家貧而苦學寒暑如一早歲夢入淨慈羅漢堂至東南隅忽一尊者指楣梁間詩示師曰一室寥寥絕頂開數峰如𦘕碧於苔等閒翻罷貝多葉百衲袈裟自剪裁由是有出俗志年十九落髮東陽資壽依東叟頴于淨慈掌內記侍石林鞏兼外記參雪巖欽于仰山掌藏鑰後依徑山雲峰高亦掌藏鑰尋命分座說法出世歷遷至仰山元世祖召見說法稱旨賜號佛鑑成宗加號大圓詔住徑山仁宗又加號慧炤至正壬戌四月十二日手書付囑說偈而逝諡大辯塔曰寶華有瀑巖集及語錄行世淨慈倫禪師法嗣絕象鑑禪師甞頌洞山不安因緣曰洞山有路透雲巖絕處教通到者難拄杖頭邊開活路方知不隔一毫端又頌晏國師赴大王請雪峯門送話曰洞天無壁月無遮朝斗先生扣齒牙風撼古壇松子落打翻頭上楮冠斜又頌泐潭法會問馬祖西來意曰鷄聲茅店月華明客夢沉迷尚未醒開得眼來天大曉髼頭垢面便奔程竹屋簡禪師頌鼓山聖箭曰青童雙勒玉騘嘶淡白春衫綠帶圍半夜歸來花底月金鞭敲落亂紅飛又曰九重城裡本非遙射折重重箭倍饒忽遇二軍圍繞處分明有路直通霄頌投子指雨示僧曰天日來好雨曰百花香裡鷓鴣啼白面郎君醉似泥赫日光中開得眼福城東際草萋萋無學元禪師法嗣月庭忠禪師甞頌迦葉擯文殊曰錦衣公子遊春慣白首佳人懊恨多彼富尚嫌千口少自貧無奈一身何又頌僧問白雲舊歲已去新歲到來如何是不遷義曰落葉已隨流水去春風未放百花舒青山面目依然在盡日橫陳對落暉雪峰湘禪師法嗣泉州開元斷崖妙恩禪師全州倪氏子初遍參名宿旋入雪峰湘和尚之室湘器之至使分座退居善見痛自韜晦至元二十二年僧錄劉鑑義言于行省奏合開元百二十院為一禪剎明年秋延師為開山第一世堅致不獲謝至門曰第一句最初步說到行到大千揑聚喝一喝莫來攔我毬門路陞座嗣湘法示眾吾心似破竹徑直無迂曲一點不相瞞六六三十六上堂是法非思量分別之所能解三家村裏十字街頭穢語相爭惡言廝罵總是面門放光助佛揚化其柰學此道者如人𦘕龍真龍見時却又驚怕因甚如此識真者寡師履行純實律身清苦終始無斁脇不沾席者四十二年語言無華而人心悅服叢林法敝以之具興三十年三月望以法弟契祖補其處越三日圓寂既火而雨舍利藏于西山賜諡廣明通慧普濟禪師有上生經解語錄行世泉州開元契祖禪師同安張氏子初侍法石元智智奇其材既遍參畢乃湛伏鄉院至元二十九年妙恩請為堂中上座至敬愛之師甞疾恩餽藥資不受偈曰政坐虗消人信施生身受此銕圍殃鎔銅熱銕都吞了那更教人入鑊湯恩益重其為人三十年恩使嗣位代行湘師之道重陽上堂今朝重九節籬根菊又花諸方不說陶潛即說孟嘉開元無可說者歸堂喫茶鼓山行聳至上堂屴崱峯前靈源洞口不墮嶮崖有一句子今日開元擬為重舉嗄鼓山門下不許咳嗽時真首座有能頌聲以卜隱頌要師作師頌曰自斷胸中更沒疑行藏那許鬼神知直饒天下藏天下未是羚羊挂角時真嘆服寺有傑道者頗清狂出言無度恒掃除街市所至群稚相與譁笑之素所服衣垢甚忽取澣之言明日行矣至明日求僧粥不予傑請曰求之不再幸予我得粥還置于几危坐而化師為闍維曰一生傑斗打硬參禪街頭巷尾掣風掣顛若無末上一解不值一半文錢傑道者誰信寒灰有煖烟有司以師道行聞賜佛心正悟之號延祐六年秋無疾而化壽九十全身塔于西山育王珙禪師法嗣金陵保寧古林清茂禪師十三歲為僧見老宿舉高菴見僧不會便扭住曰父母生汝身師友成汝志無饑寒之迫無征役之勞於此不堅確精進成辦道業他日有何面目見父母師友乎師聞之不覺涕淚俱下便知有出生死一著子遂參善知識即便放下身心如是二十年間矻矻孜孜未甞暫捨及到育王會中稍知觸淨後得徹悟出住開元永福保寧諸剎解夏小參僧問毛巨吞海芥納須彌是衲僧分上事不是衲僧分上事師云拈却門前大案山進云鯨吞海水盡露出珊瑚枝師云金剛腦後鐵蒺藜進云只如教中道我得無諍三昧人中最為第一如何是無諍三昧師云放汝三十棒進云仁義盡從貧處斷世情偏向有錢家師云知恩者少負恩者多僧問昔日舉上座見琅琊琊問近離甚處舉云兩浙琊云船來陸來舉云船來琊曰船在什處舉云步下意旨如何師云開口見膽進云琅琊云不涉程途一句作麼生道如何是不涉程途底句師云前不迭村後不迭店進云只如舉上座以坐具摵云杜撰長老如麻似粟又作麼生師云焦磚打著連底凍進云後來琅琊問侍者此是甚麼人者云舉上座琅琊遂親下旦過問云莫是舉上座麼莫怪適來相觸忤作麼生是觸忤處師云爛泥裏有刺進云舉上座喝云長老何年到汾陽我在浙中早聞汝名見解如此何得名喧宇宙琅琊遂作禮云某甲罪過那裏是他罪過處師云若不登樓望安知滄海深進云後來大慧和尚道二大老相見如日月麗天龍象蹴踏未審還端的也無師云土上加泥又一重進云琅琊後遇慈明舉此語明云舉見處纔能自了是汝負墮為復肯伊不肯伊師云一點水墨兩處成龍進云可謂龍得水時添意氣虎逢山勢長威獰師曰無人處斫額望汝僧禮拜師乃云秋初夏末東去西去萬里無寸草處去出門便是草擬向什麼處去古人事不獲已開却通天大路又謂之清淨大寂滅海與諸人同出同入初無絲毫差別彼我之相直下會得九十日內功不浪施明朝自恣之辰一任東去西去只不得向萬里無寸草處去何故葢為諸人未甞踏著者一路子所以前頭大有事在雪峰云盡大地是解脫門把手拽不入雲門云盡大地是解脫門枉作佛法會却一處不通兩處失功兩處失通觸途成滯山僧道盡大地是解脫門過去未來現在三世諸佛盡在裡許汝諸人亦在裏許拈拄杖云拄杖子亦在裡許且道還有不在裡許者麼良久喝一喝云空將未歸意說向欲行人永福入寺小參紅塵閙市十字街頭百草頭邊孤峰頂上若作佛法商量入地獄如箭射直得萬機休罷千聖不擕聲前非聲色後非色簡點將來正是髑髏前妄想借使打破髑髏揭却腦葢踢倒須彌踏翻大海脚跟下推勘得出也是落七落八通方上士出格高人除非自有生涯終不守他窠窟現前大眾冀善參詳山僧二千里水陸間關來此聚頭不為別事復說偈云處世行藏各有由老來誰不愛心休為圓鄮嶺先師話來結鄱陽衲子讎跛鱉但隨他逐浪錦鱗終是解吞鈎相逢試把家私展蜜菓時懸檗樹頭淨慈鞏禪師法嗣杭州靈隱東嶼德海禪師甞頌俱胝竪指曰深深無底高高絕攀思之轉遠尋之復難嘉興府天寧竺雲景曇禪師婺州浦江嚴氏子及長學無常師預石林座下委心請法林示曰佛之妙用在汝觸事不迷師一言解悟初住婺之治平遷蘇之北禪僧問諸法已聞於今日西來祖意願敷宣師曰西來無意可宣曰達磨却傳個什麼師曰九年面壁羞惶殺人曰與麼則佛法遍天下談玄口不開師曰切忌喚鐘作甕問古人道須參活句莫參死句如何是活句師曰路逢死蛇莫打殺曰如何是死句師曰無底籃兒盛將歸曰不死不活句又作麼生師曰易分雪裡粉難辨墨中煤問三贒未達十聖難知如何是此宗師曰無孔笛氈拍板曰知音者誰師曰聾人爭得聞曰也知和尚慣有此機師曰子過新羅問如何是涅槃心師曰須彌山曰如何是差別智師曰四海水曰都來總不消得師曰金剛王寶劒你還提得起否曰請師高著眼師曰話作兩橛住余山慈雲昭慶寺上堂金烏東上玉兔西沉伶俐衲僧東討西尋忽然撞破虗空歷劫只在如今卓拄杖下座焙經上堂海藏靈文經天緯地琅函玉軸塞壑填溝如來不說說敲出鳳凰五色髓迦葉不聞聞擊碎驪龍頷下珠火焰為三世諸佛說法義天朗耀揭坤維三世諸佛向火焰上說法字脚不留空法界兜羅綿裏玉轉珠回文武火中星移電捲行行鑄出黃金字朵朵花開白玉蓮只如經歸藏禪歸海又作麼生五千餘卷瘡疣紙一眾傳來耿夜光徑山度禪師法嗣杭州徑山虎巖淨伏禪師淮安人至元二十一年正月帝御大明殿受朝賀因問南禪才者右相和禮霍孫首舉師師作偈以進其略曰過去諸如來安住秘密藏現在十方佛成道轉法輪未來諸世尊一切眾生是由妄想執著結煩惱盖纏迷成六道身虗受三塗苦唯念過現佛不敬未來尊與佛結冤讐或烹宰殺害不了眾生相全是法性身昔有常不輕禮拜於一切言我不輕汝汝等當作佛若能念自他同是未來佛現世增福壽生生生佛國帝覧悅而問曰戒勿殺有道者試為朕言之師對曰有宋仁宗皇帝一日語群臣曰朕夜來饑甚思欲燒羊群臣奏曰陛下何不宣付有司辦之仁宗曰朕偶饑思爾慮為常例寧忍一時之饑不忍啟無窮之殺殿下皆稱萬歲上嘉納即受帝師戒徑山愚禪師法嗣寶葉源禪師甞頌五通仙人曰那一通你問我口是禍門招因帶果慚愧慈悲大法王丙丁離壬不屬火又頌羅山開堂珍重便下座曰瑞世優曇見最難異香浮動曉風寒自非世主垂青眼却作閑花野草看又頌德山見僧入門便棒曰皎潔晴天吼怒雷鐵山萬疊盡驚開因思塊雨條風日安得全提有此來閑極雲禪師舉莊宗酬價因緣頌曰君王寶自難酬價興化何甞敢借看天地既無私盖載至今留得鎮中原又頌黃檗在鹽官殿上禮佛唐宣宗問不著佛求曰轟雷掣電奮全機正是潛龍熟睡時忽地夢回春恨斷曉風吹雨過前谿徑山月禪師法嗣南叟茙禪師甞頌婆生七子話曰鄂渚渡頭窮鬼子全機錯在扣舷時何如別下一轉語救取婆婆第七兒又頌魯祖面壁曰日暖佳人刺綉遲紫荊枝上囀黃鸝欲知無限傷春意盡在停針不語時又頌僧問趙州道人相見呈漆器曰漱石泠泠古㵎陰喬松千尺帶寒青多應只看昂霄操誰信根頭有茯苓天池信禪師法嗣建寧府天寶山鐵關法樞禪師溫州平陽林氏子年十七辭父母詣華藏禮竺西坦為師受具後參中峯本及菴信俱不契遂見元翁信于石門教看三不是話凡三載一日齋後下床忽大悟作頌曰不是心佛物拶出虗空骨金色獅子兒豈戀野狐窟咄咄即詣方丈翁問作麼師曰南泉被我捉敗了也翁曰不是心不是佛不是物是個甚麼師曰牙齒一具骨耳朵兩片皮翁曰不是別道師曰鶯啼燕語鵲噪鴉鳴翁曰錯師亦曰錯翁曰南泉即今在什麼處師便喝翁曰離却者一喝南泉在什麼處師拂袖而出由是往參江西諸尊宿凡四年復歸石門翁問南泉向何處去也師曰說甚南泉釋迦老子來也翁曰不是心不是佛不是物是如何師曰劒去久矣翁乃曰諸佛妙道善自護持遂留侍巾拂一十五載盡得其末後大事後南遊建州郡將請主天寶不數載遂成叢席再住松溪之普載開堂日師曰當陽一句直截根源把住放行全機歷落坐斷千聖頂𩕳鑿開衲僧眼睛疾𦦨過鋒奔流度刃直得妙峰𨁝跳慧海波騰正恁麼時開堂祝讚一句作麼生道擊拂子曰龍袖拂開全體現象王行處絕狐踪上堂弗弗弗莫莫莫錯錯錯顧侍者曰老僧舌頭在麼遂下座小參金剛正印率土咸歸佛祖鉗鎚人天罔措階梯不立知解不存德山棒通上徹下臨濟喝絕後光前一明一切明一用一切用大丈夫秉吹毛劒懸肘後符雙收雙放全殺全活雖然鶴有九臯難翥翼馬無千里謾追風三年謝歸天寶至元六年八月示疾十三日作書別諸外護十五日索浴畢書偈曰本無來去一句全提紅霞穿碧落白日遶須彌擲筆而逝塔于本山蒙山異禪師法嗣鐵山瓊禪師參雪巖巖曰有甚麼事師曰門前好個五鳳樓巖連打二三十棒曰未在更去做工夫以紙求得法語曰風吹林葉四窓虗明獨坐一榻萬象鏡清汝撑得鐵船來載鐵山下得海然後向汝道一一現成猶是錯認定盤星佛法如大海前面洪濤際天轉入轉深偈曰一拶虗空粉碎時花開鐵樹散瓊枝紹隆佛種向上事腦後依然欠一槌偶頭痛欲煎藥手提瓶子遇見覺赤鼻曰你須是如那吒太子析肉還母析骨還父然後為父母說法始得師忽然打破疑團偈曰一莖草上現瓊樓識破古今閑話頭拈起集雲峯頂月人前拋作百花毬值巖示寂遂至東林因東林入室次舉問心不是佛智不是道作麼生道師曰抱贓呌屈曰不是心不是佛不是物是如何師曰眉間迸出遼天鶻後到蒙山每遇入室山只道欠在後於定中觸著欠字於是身心豁然徹骨徹髓走上方丈捉住山曰我少欠個什麼山打三掌師禮三拜又曰啞鐵山者著子幾年今日方了次年命首座冬至秉拂曰冬在月頭賣被買牛冬在月尾賣牛買被卓拄杖曰者裏無頭無尾中道齊休行也休休住也休休坐也休休臥也休休睡眼豁開五雲現瑞光風霽月無處不週梅綻枯枝古渡頭風前時復暗香浮雖然到此向上一路萬里崖州何以見得靠拄杖曰休休太湖寬禪師法嗣常州龍池一源永寧禪師淮東通州朱氏子世為宦族九歲懇求離俗依利和州廣慧寺出家寺乃州之望剎宋有淮海肇禪師說法度人聲聞當時前一夕寺眾同夢迎淮海次日而師至識者異之受具後遍參諸老皆弗契謁無用于太湖用門庭高峻師方入門即厲聲叱出師作禮於門外合爪而立久之乃許入見用問何處人師曰通州用曰淮海近日盈虗若何師曰沃日滔天不存涓滴用曰不著㷮道師曰請和尚道用便喝師退就禪室徹夜不寐一日聞用舉雲門一念不起語聲未絕而有省急趨入室無用便打然知師已悟令頌趙州狗子話師立成曰趙州狗子無佛性萬象森羅齊乞命無底籃子盛死蛇多添少減無餘剩用嗒然一笑復舉證道偈問曰掣電飛來全身不顧擬議之間聖凡無路速道速道師曰火迸星飛有何擬議覿面當機不是不是用振威一喝師曰喝作麼用曰東瓜山前吞扁擔捉住清風剝了皮師不覺通身汗下亟五體投地曰今日方知和尚用處用曰閉著口至治癸亥宜興之龍池請師建立禪林業已告就後復擇絕巘作室以居至順庚午出主李山始開法無何遷常之天寧順帝賜號本覺妙明真淨禪師戊子有旨召入覲命說法于龍光殿上大悅賜金襴法衣兼玉環加師號佛心了悟大禪師賜歸未幾奉旨函香至五臺感文殊現祥光五道明年辭歸庚子復為眾所逼出領善權寺壬午謝歸龍池洪武己酉六月示微疾命弟子裁紙製內外衣且曰吾將逝矣移龕至絕巘所居十七日師起浴索筆書偈曰七十八年守拙明明一場敗闕泥牛海底翻身六月炎炎飛雪書畢側臥而化茶毗有五色光現齒牙舌輪數珠皆不壞舍利無數煙所到處亦纍纍然眾共取之至灰土中掬取淘汰獲者亦眾無能教禪師法嗣西湖妙果竺源水盛禪師饒之樂平范氏子十七依羅山院出家既得度首謁月庭忠於蔣山時孤舟濟為第一座以皖山示蒙山語示之師極力參究越五載有省濟曰蒙山常言栽松道者不具二緣而生達磨塟熊耳後隻履西歸果神通耶抑法如是耶師曰此形神俱妙而已濟曰不然子他日當自知之師住無為州見無能以濟所舉質之能曰為汝弗解故也師忽大悟能撫其背曰爾後當大弘吾宗也尋分座于荐福既而隱于南巢天曆己巳出主西湖妙果未幾復還南巢至正丁亥夏示寂初預立塔于南巢五峯之下是夜有光如匹練自天際下燭俄頃散布五峰之頂復合于塔中彌三夕乃止師制行峻絕如孤峰萬仞可聖而不可攀甞囑其徒曰凡剃髮染衣當洞明心宗行解相應以正悟之境靈靈自炤歲久月深具大無畏如透水月華萬浪千波觸之不散方不被生死陰魔所惑此師之生平實悟實證者故亦用之以誨人也
