body:
  text: 鼓山嗣祖沙門元賢輯臨濟宗南嶽下二十四世伏龍長禪師法嗣蘇州鄧蔚山萬峰時蔚禪師溫州樂清金氏子年十三依本縣演慶升講主出家十六落髮十九更衣學禪聞杭州虎跑止巖和尚道譽遂往參謁巖付以三不是話乃回明州於達蓬山佛跡寺故址卓菴辦道一日正在疑悶中忽聞寺中宗律師舉百丈問溈山不可喚作淨瓶喚作甚麼溈山踢倒淨瓶便行不覺觸破疑團說偈曰顛顛倒倒老南泉纍我工夫却半年當下若能親薦得如何不進劈胸拳遂往華頂訪無見求決擇見問曰萬法歸一一歸何處師進前問訊云不審見復問如何是道師曰道無可道見曰不道又不道個甚麼師曰正要和尚疑著見曰疑著即錯師曰不疑亦錯見便喝師亦喝見又喝師亦喝拂袖而出復回達蓬山居十載後往伏龍見千巖巖便問不是心不是佛不是物是個甚麼師以坐具打一圓相叉手而立巖休去次日復見巖問你將甚麼來與老僧相見師竪起拳曰者裏與和尚相見巖曰死了燒了向何處安身立命師曰漚生漚滅水還在風息浪平月映潭巖復曰莫要請益受戒麼師掩耳而出巖次日命師入堂首衆一日巖上堂舉無風荷葉動必定有魚行師出衆一喝拂袖而行巖印以偈曰鬱鬱黃花滿目秋白雲端坐碧峰頭無賓主句輕拈出一喝千江水逆流師見偈從此退職遂往蘭溪嵩山結茅以居後巖以書招之不至乃令人賫法衣頂相授之師始開法元末移錫蘇州鄧蔚山創立伽藍名曰聖恩道風彌布僧俗歸向益衆洪武十四年正月十九日集衆付囑畢趺坐說偈曰七十九年一味杜田懸崖撒手杲日當天語畢而逝世壽七十有九僧臘六十夏停龕十三日顏色如生二月十三日塔全身於院西杭州天龍無用守貴禪師婺之浦江甄氏子入康侯山為僧首參千巖恍有所契次見中峰諸老乃曰千江雖殊而明月則一吾今後無疑矣至正庚寅主天龍不數載大小咸備隱然一大伽藍矣後示寂日書偈曰一蝸臭殼內外穢惡撒手便行虗空振鐸天龍一指今猶昨擲筆而逝松江府松隱唯菴德然禪師郡之張氏子少祝髮於無用貴公次謁千巖聞其提唱豁然悟入後嗣主其席上堂元正啓祚萬物咸新驀拈拄杖曰拄杖子昨夜抽條今朝吐蕊花開五葉香滿大千且道當得新年頭佛法也無卓拄杖喝一喝上堂天無門地無戶俊快衲僧一任去來藏裏摩尼照徹十方洞裏桃花千葩競吐假劫外之春風應今時之律呂海神夜半看鮫珠眼光挂在扶桑樹喝一喝上堂蠟人為驗始於今日九十日終推功辨的黃面老瞿曇結住布袋頭百萬人天咸皆受屈松隱結制總不恁麼以手作搖櫓勢曰山僧即今駕無底鐵船普請大衆同入大圓覺海遊戲去也喝一喝曰看取定南針白蓮安禪師法嗣杭州開元寺空谷景隆禪師蘇之洞庭陳氏子為童時不茹葷趺坐若禪定嘗從辨山懶雲咨問道要湖海諸大老亦靡不遍謁後禮虎丘石菴為師宣德二年從杭昭慶受戒遂依石菴住靈隱七年往天目禮祖塔憩錫一載刻苦參究忽有省遂造懶雲剖露雲印可之初居西湖之正傳院晚年遷居開元示寂塔于西湖之修吉山所著有空谷集行世南嶽下二十五世鄧蔚蔚禪師法嗣武昌府九峰無念勝學禪師德安隨州應山人陳姓九歲禮本郡寶林緣公出家自覺己事不明參無聞聞示萬法歸一話後入嵩山住靜一日有省偈曰數載東山昏霧濛憑欄終日待晴空夜來忽起霜天月萬象全彰一鏡中由是參萬峰于鄧蔚山峰以偈證之復回寶林道風昭著楚昭王建剎延師居之師問衆如何是達磨直指一句衆無語師代曰五乳峰前談少室洪武間太祖召至奉天殿親問法要師進偈上大悅御製詩文以賜永樂三年乙酉三月草九日說偈曰世尊七十九無念八十邊打破華藏海依舊水連天儼然而逝塔全身於師子巖諡清福廣慧禪師慈舟濟禪師法嗣壽昌西竺本來禪師撫州崇仁人姓裴氏七歲出家于本邑觀音寺年十三參見一峰寧付以禪觀之法孜孜究明己躬下事一日頓覺身若虗空心絶邊表行住坐臥不知是誰忽聞人誦清淨經云內觀其心心無其心豁然有省作偈曰幾年外走喪真魂今日相逢逈不同身畔金毛石獅子回頭吞却鐵崑崙乃往見一峰寧呈所見寧弗許遂往貴溪江東卓菴以居凡七年方得發明時寧已示寂乃往金山見慈舟濟得蒙印可歸隱劒江聖壽寺後寧王聞師道邁遣使三請師終不赴又呈偈問道師答以進修之要王大悅授師慧光普照頓悟圓通西江西竺大禪師之號從此道譽遠播四方來學者衆次遷新城壽昌竪大伽藍上堂花燦爛日輪紅心法昭彰觸處通衲僧鼻孔大頭下浩氣騰騰宇宙中眼空四海無家計只者拄杖子在手要西便西要東便東卓一卓下座小參了了了一片長空光皎皎休休休雲自高飛水自流豁眼通身無向背十方沙界任遨遊後杉關福田寺廢請師重興工將畢一日焚香趺坐索筆書偈曰者個老乞兒教化何時了顛顛倒倒任隨流是聖是凡人不曉咄來來來去去去海湛空澄風清月皎擲筆而逝世壽六十八僧臘五十五門人奉真身于師表堂繁昌俊禪師法嗣普州東林無際悟禪師蜀人二十出纏縛竹為菴研勵無懈四指大書帖亦不看只是拍盲做鈍工夫後得大徹大悟作偈曰寂照無上下光明處處通本來無皂白何處不含容往見繁昌昌曰還我照用來師曰若有照用即成障隔昌曰者廝著空底佛也救不得師曰有無俱寂滅空佛悉皆非昌然之後寄以偈曰憶昔繁昌一別時此心能有幾人知無絃曲子真堪續慧命懸懸付阿誰何密菴居士法嗣楊州素菴田大士僧問補陀路向甚麼門出士曰即今從何門入曰抑勒人作麼士曰看腳下僧擡頭進前三步士曰錯僧又退後三步士曰錯僧茫然士曰是汝錯貧道錯曰未舉已前早知錯了士拍膝曰正好喫棒在僧無對士曰若到諸方分明記取南嶽下二十六世鄧蔚持禪師法嗣杭州東明虗白慧旵禪師姓王氏湖廣人年十四往丹陽妙覺寺禮湛然落髮一日作務次然問曰子在此作甚麼師曰切蘿蔔然曰汝只會切蘿蔔師曰也會殺人然引頸就師師曰降將不斬值然住疏山聞松隱唱道雲間即往咨叩一日出定舉首覩蒼松有省尋至蘇之鄧蔚見果林林擲下蒲團索頌師曰只些消息本無言說破蒲團上地迸天裂林曰且道裂個甚麼師擬進語林便打林復指見寶藏具陳悟因藏問心不是佛智不是道汝云何會師向前問訊叉手而立藏呵曰汝在者裏許多時還作者見解師乃發憤忘食至第二夜豁然徹法源底偈曰一拳打破太虗空百億須彌不露踪借問個中誰是主扶桑湧出一輪紅藏見笑曰雖然如是也須善自護持永樂戊子至安溪東明設關三十餘年影不出山道俗揚播宿衲爭趨座下宣德辛酉六月草七日將去世衆請留偈師曰一大藏教無人看著爭得者幾句間言語草九日辰時跏趺而逝塔于安溪東塢東林悟禪師法嗣成都府東山天成寺楚山紹琦禪師唐安雷氏子八歲入鄉校授經成誦九歲失怙詣玄極通禪師學出世法後謁無際示以無子公案偶聞開靜板鳴礙胸氷泮往見際際曰還我無字意來師曰這僧問處偏多事趙老何曾涉所思信口一言都吐露翻身特地使人疑曰如何是汝不疑處師曰青山緑水燕語鶯啼歷歷分明更疑何事曰未在更道師曰頭頂虗空腳踏實地際曰亦未在師乃禮拜師再參際問數年來住在何處師曰我所住廓然無定在際曰汝有何所得師曰本自無失何得之有曰莫不是學得來者師曰一法不有學自何來曰汝落空耶師曰我尚非我誰落誰空曰畢竟若何師曰水淺石出雨霽雲收曰莫亂道只如佛祖來也不許縱你橫吞藏教現百千神通到者裏更是不許師曰和尚雖是把斷要津其奈勞神不易際拍膝一下曰會麼師便喝際笑曰克家須是破家兒恁麼幹蠱也省力師掩耳而出際授法偈曰我無法可付汝無心可受無付無受心何人不成就後居天柱僧問如何是天柱境師曰㵎濶雲歸晚山高日出遲曰如何是境中人師曰額下眉遮眼腮邊耳搭肩曰如何是天柱家風師曰雲甑炊松粉氷鐺煮月團曰如何是祖師西來意師曰海神撒出夜明珠曰學人不會師曰文殊失却玻璃盞曰如何是佛師曰生鐵稱槌曰如何是法師曰石頭土塊曰如何是僧師曰黑漆拄杖曰不涉寒暑者是甚麼人師曰為汝道了也汝還識否僧擬對師咄曰擬心即乖開口便錯眨得眼來錯過了也曰原來恁麼地近那師曰汝見個甚麼道理曰面目分明當機不露師震威一喝僧當下豁然景泰五年住投子僧問遠離皖山來據投子海衆臨筵請師祝聖師曰鼎內長生篆峰頭不老松曰祝聖已蒙師的旨投子家風事若何師曰提瓶穿市過不是賣油翁曰只如祖師道不許夜行投明須到還端的也無師曰雖然眼裏有筋爭奈舌頭無骨曰趙州道我早猴白更有猴黑意作麼生師曰不因弓矢盡未肯竪降旗問今日和尚升座說法未審有何祥瑞師曰麒麟步驟丹霄外優鉢花開烈火中曰如何是祖師西來意師曰雪消山頂露風過樹頭搖師乃顧視大衆曰只這些子誵訛古今多少師僧到這裏開口不得思量不及舉揚不出驀拈拄杖曰今日因甚却落在山僧手中以拄杖橫按曰橫也由我拈起拄杖曰竪也由我放下拄杖曰放下也由我以卷舒殺活總由我又以拄杖向空中點一下曰正當恁麼時從上佛祖乃至天下老和尚到這裡只得乞命有分衆中莫有為佛祖出氣底麼良久卓拄杖一下曰𭣟瞎金剛正眼靠倒空王寶座汝等諸人討甚麼碗師一日到菜園見園頭縛冬瓜架師指冬瓜曰這個無口因甚長得許多頭曰某甲不曾怠惰一時師曰你主人公還替你出些氣力也無頭曰全靠他力師曰請來與老僧相見頭禮拜師曰猶是奴兒婢子在頭拈篾縛冬瓜架師呵呵大笑回顧侍僧曰菜園有蟲成化九年三月十五日示微疾衆請師末後句師展兩手示之曰會麼曰不會師復曰今年今日推車撞壁挂倒虗空青天霹靂呵呵呵泥牛吞却老龍珠澄澄性海漚花息遂安詳而逝伏牛山物外圓信禪師金臺高氏子依無際參究後得灑脫偈曰崑崙倒跨清風舞㵎底泥牛鬪石虎磕著蒼松眼上眉蟭螟踏破虗空肚重慶府西禪雪峰瑞禪師天奇參師問如何是無字意奇移時乃答曰㵎底頑氷吞宇宙性湖明月匝天寒師大喝曰汝還有嫌凡愛聖的心掃妄求真底見奇曰是師曰你若嫌凡愛聖斷般若之善根你若掃妄求真絶諸佛之命脉又震聲喝曰真又是誰妄又是誰凡又是誰聖又是誰奇乃豁然便禮拜古庭善堅禪師滇之昆明人參一歸何處話一日定中聞僧曰見無所見即真見師於此頓然脫落正統乙丑至隆恩見無際際曰子將從前做工夫處親似一遍師實供說至見諦處叉手默然際曰子見諦如何與我不同師以兩手大展曰這個非別際曰這個還著言句也無師曰實無一字際曰只此無一字處吾與汝證明已竟師禮辭際曰子向甚麼處去師曰十字街頭呵佛罵祖去際曰子再來麼師曰不違和尚尊顏驀直而去就止金臺大容山雲水不絶際恐師出世早命為首座問曰子別在甚處師曰佛祖行不到處際曰還許人來否師曰坦然無礙際曰從上古人阿誰有超祖之智師曰黃檗際曰子見黃檗麼師曰縱是黃檗也須見擯際曰敢在我這裏說大話師曰正眼無私際曰觀子知見吾非子之師也師曰無有過量豈免貶駁際曰如是如是素菴田大士法嗣佛跡菴真禪師開堂普說曰青山疊疊緑水滔滔於斯會得獨步高超雖然如此也是尋常茶飯古德云欲窮千里目更上一層樓承古有言機不離位墮在毒海語不驚群陷於流俗若擊石火裏別緇素閃電光中辨殺活可以坐斷千差壁立萬仞還知有恁麼時節也無錯勘破了也如今談禪者腳跟點地鼻孔撩天具正眼者落落罕聞所以偏正不一各立異端堅執己解莫通實理所謂正法難扶邪法競興古云信有十分疑有十分疑有十分悟有十分可將盡平生眼裏所見耳裏所聞惡知惡解奇言妙句禪道佛法貢高我慢等心徹底傾瀉莫存毫末只就向未明未了公案上距定腳跟竪起脊梁無分晝夜無參處參無疑處疑直得東西不辨南北不分呆樁樁地却如個有氣的死人相似心隨境化觸著便知打破髑髏不從他得豈不慶快平生者哉南嶽下二十七世東明旵禪師法嗣湖州東明海舟普慈禪師西川人姓氏未詳嘗聽講楞嚴至但有言說都無實義有疑往參萬峯問如何是實義峰便劈頭兩棒攔背一踏以腳兩踢曰只這是實義師起曰好只好大費和尚心力峰笑而許之遂承付囑尋命首衆後廬於洞庭山塢草有九年一日因一僧至激發參東明師往見適有人設齊師至關前問曰今日齊是甚麼滋味明曰到口方知師曰如何是到口味明即打滅燈曰識得燈光何處著落味即到口師無語明日遣侍者請師師即至明問曰曾見人否師曰見只見萬峰明曰若親見萬峰萬峰即今在甚麼處師罔然明曰恁麼則何曾見萬峰師歸寮三晝夜𥨊食俱忘偶琉璃燈墮地忽然大悟詣呈悟由明曰老闍黎親嗣萬峰去師曰和尚為我打徹豈得承嗣萬峰明乃笑遂集衆出關升座付法曰瞿曇有意向誰傳迦葉無端開笑顏到此豈容七佛長文殊面赤也茫然今朝好笑東明事千古令人費唾涎幸得海公忘我我濟宗一派續綿綿擲下拄杖曰千斤擔子方全付玄要如今拄杖談以拂子擊三下下座逮明示寂衆請師繼席後遷五祖而終廣善潭禪師法嗣南京崇福寺大慧覺華禪師維楊劉氏子幼歲出家棲止千天長瓜婁山請益海舟慈禪師有省成化元年至太平繁昌參寶月月問如何是萬法歸一師曰人間寒暑不能侵月曰杲日當空無所不照因甚麼被片雲遮却師曰船去船來岸不移月曰人人有個影子因甚踏不著師曰昨日有人從廣東來月曰盡大地是火坑得何三昧不被燒却師曰東海鯉魚吞却日月曰如是如是以偈付之住後上堂舉拂子曰威音那畔元只是這個如今目前也只是這個山僧將來上下拂左右拂若喚作拂子瞎却人天眼目若不喚作拂子亦瞎却人天眼目大衆畢竟喚作甚麼若也會得便知迦葉微笑二祖覔心了不得處紹如來之傳燈續祖庭之正脉聯二十八世之英華接三十四代之骨髓衆皆默然良久曰千聖不能識以拂子擊香几下座太岡澄禪師法嗣杭州天真寺毒峰本善禪師鳳陽吳氏子隨父任生于之雷陽十七出家初遇老宿開示無字公案囑曰須發大願以自護持師便發願曰若生死不了大事未明遺棄修行苦行貪著名利死墮阿鼻地獄受苦無盡寓淯溪閉關一朝聞鼓聲忽不自由說偈曰沉沉寂寂絶施為觸著無端吼似雷動地一聲消息盡髑髏粉碎夢初回參月溪於廣恩溪問如何是無字師曰某甲一向只隨人道是個無字今日看來是一口金剛王寶劒曰如何是金剛王寶劒師曰寒霜𦦨𦦨輝古騰今曰還我劒來師曰擬動即犯他鋒鋩曰橫按當軒時如何師曰佛來也殺祖來也殺曰老僧來聻師曰亦不相饒曰殺後如何師曰且喜天下太平溪然之後為衆普說其略曰寶劒全提日用中高揮大抹肯從容卷兮魂膽迎風喪舒也髑髏遍地橫萬死萬生渾不顧一鎗一戟便收功趙州性命分明也血刃參天不露鋒又曰虗空廓徹無消息萬里無雲天碧碧拶得須彌入藕絲彌勒釋迦齊呌屈倒騎鐵馬逐西風驚得泥牛從海出諸仁者若作奇特勝妙會正是孤負己靈不作奇特勝妙會又是抱贓呌屈且作麼生會不見道解藏天下於天下始見林梢挂角羊代州五臺普濟寺孤月淨澄禪師燕京西河張氏子參月溪看狗子無佛性話三日有省溪可之後入蜀謁廣福福問大死底人却活時如何師曰眉毛眼上橫鼻孔大頭垂曰如何是無字意師曰風行草偃水到渠成曰大地平沉虗空粉碎汝向何處安身立命師曰雲消山嶽露日出海天清天順改元返清涼代王請詣內掖問道感光明庭煥王心大悅而師禮焉王斥俸金建寺華嚴谷額曰普濟師有山居偈曰寰中獨許五臺高無位真人伴寂寥一任諸方風浩浩常空兩眼視雲霄甘貧林下思悠悠竹榻橫眠枕石頭格外生涯隨分足都緣胸次了無求自住丹崖緑水傍了無榮辱與閒忙老僧不會還源旨一任青山葉又黃深隱巖阿不記年名韁利鎖莫能牽七斤衫子重聯補日炙風吹愈轉鮮颯颯春風和鳥哀清音直到耳邊來爐燒柏子端然坐對月殘經又展開後坐脫於本寺未詳法嗣溈山太初禪師字子愚溫陵人世為儒者師倜儻有大志所為詩文皆不凡士大夫多推目之一旦棄去選佛於尊勝以律自檢盡去豪舉之習出嶺遍參叢林中有聲藉甚久之罷參歸閩會南劒報恩虗席郡守陳宓聞師名命主之亡何真德秀以大溈來延住二十載衆至一千師說法縱橫博大不謝古尊宿德秀既致政每與師遊從容論道莫不心醉大抵師以平實接人始會儒釋大同為門使之得入終則示吾法之極致為室使之得所歸故諸儒雅重之中觀沼禪師海雲印簡之受業師也嘗訓海雲曰汝所欲者文字語言耳向去皆止之令身心若枯木死灰今時及盡功用純熟大死一場休有餘氣到那時節瞥然自省方可與吾相見後同海雲為元兵所劫北渡到朔方元國主署師慈雲正覺大師之號及師將示寂有羽客楊至慎求偈師命執筆代書偈曰七十三年如掣電臨行為君通一線泥牛飛過海東來天上人間尋不見客曰師幾時行師曰三日後時五月念七日也至六月初一果無疾而逝雪峰樵隱悟逸禪師懷安人姓聶氏既為僧不肯局守一隅屢叩名宿後得法于雪峰佛海禪師大德十年郡帥舉住雪峰凡七載退居西菴皇慶三年復奉旨再住賜佛智之號六年謝事泰定二年仍奉旨補前席居七載師三住雪峰百廢俱修大為法門盛事嘗序雪峰録有曰老真覺自德山一棒桶底脫後直得鰲店月寒象峰雪霽攬醍醐於一杓彰大用于三毬譬之轟百億雷霆于四天之下曠數百世其聲愈宏所有垂示流出胸襟蓋天蓋地廣陵一奏么絃下愧不復聲矣元統二年示寂塔于佛海塔傍玉溪通玄菴圓通大禪師嘗著百問激勵學徒後萬松答之林泉頌之各如其數今盛行于世天台上雲峰無盡祖燈禪師四明王氏子參日溪詠公於天寧問曰生死事大無常迅速乞賜指示溪曰十二時中密密參究忽然觸著却來再問師抗聲曰無常迅速生死事大語未終溪便喝師遽禮拜溪曰見何道理便爾作禮師曰開口即錯溪頷之出參方山諸大老尋卓錫上雲峰影不出山者五十春秋洪武二年二月八日示微疾夜將半顧左右曰天向明乎曰未也或曰和尚正當此際何如師破顏笑曰昔古德坐疾僧問還有不病者麼德曰有曰如何是不病者德曰阿㖿阿㖿師良久曰如此喚作病得麼衆無語師曰色身無常早求證悟時至吾將去矣侍者執紙求偈師曰終若無偈便未可死耶侍者請益堅乃書曰生滅與去來本是如來藏拶倒五須彌廓然無背向投筆端坐而逝徑山敬菴莊禪師台州人自幼厭葷穢薄世塵父母捨廣慈菴出家久之遍參方外了徹宗源曾于越中主二剎稍不如意即辭去往依全室于天界全處以二座未幾推主徑山道化隆盛永樂十二年奉詔入京同修大典寓天界三載少師姚公等交章薦住持堅辭不受歸徑山示寂塔于水嶺小池上少林匾囤無空悟頓禪師開封錫州陳氏子忽辭父母求出家父曰此兒尋常引舌過鼻非常人相令投少林一日跪於師前請求法名其師曰道本無形何名之有師曰三世諸佛皆有名號其師授以心經念至五蘊皆空豁然大悟乃曰身尚是幻何處求名一日其師手編大囤於師前曰匾囤是汝名也師答曰既名匾囤內也無空其師曰教外別傳方契此旨後造神仙山大川處酬答三日辨若懸河川曰真少林師子他日截斷衆流去在後到峨嵋結茅以居一日至夔州江中曰道曠無涯逢人不盡下岸端坐而化
